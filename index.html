      money(grand.income,C.headTxt,true,C.head),money(grand.cost,C.headTxt,true,C.head),
      money(grand.tax,C.headTxt,true,C.head),money(grand.profit,C.headTxt,true,C.head),
      {v:grand.income?grand.profit/grand.income:0,f:'0%',border:true,align:'center',bold:true,color:C.headTxt,fill:C.head}]);
    sheets.push({name:uniqueName('Tổng hợp dự án'), rows:s0, cols:[6,36,17,17,15,17,9],
      merges:[{s:{r:0,c:0},e:{r:0,c:6}}]});
  }

  // ============================================================
  // MỖI DỰ ÁN → 1 SHEET CHI TIẾT (Vật tư · Nhân công · Ca máy)
  // ============================================================
  // Sắp xếp dự án theo địa điểm để các sheet nằm gần nhau
  const ordered=[];
  [...LOCATION_GROUPS.map(g=>g.key),''].forEach(k=>{
    DB.projects.filter(p=>(p.location||'')===k).forEach(p=>ordered.push(p));
  });

  ordered.forEach((p,pi)=>{
    const t=totals(p);
    const b=p.budget||blankBudget();
    const loc=(LOCATION_GROUPS.find(g=>g.key===p.location)||{}).name||'—';
    let s=[];
    // Tiêu đề
    s.push([title((pi+1)+'. '+p.name),'','','','','']); s[0].__h=24;
    s.push([lbl('Địa điểm',true),txt(loc),lbl('Doanh thu',true),money(t.income,C.inc,true),'','']);
    s.push([lbl('Chi phí',true),money(t.cost,C.cost,true),lbl('Lợi nhuận',true),money(t.profit,t.profit<0?C.cost:C.prof,true),'','']);
    s.push([lbl('Thuế',true),money(t.tax,C.tax,true),lbl('Biên LN',true),pctCell(t.income?t.profit/t.income*100:0,true),'','']);
    s.push(['','','','','','']);

    // ---- Bảng chi tiết theo 3 hạng mục: từng đầu mục dự toán + thực chi ----
    const catList=[{id:'vt',name:'VẬT TƯ',icon:'📦'},{id:'nc',name:'NHÂN CÔNG',icon:'👷'},
                   {id:'tb',name:'CA MÁY / THIẾT BỊ',icon:'🚜'},
                   {id:'chung',name:'CHI PHÍ CHUNG',icon:'🏢'},{id:'khac',name:'CHI PHÍ KHÁC',icon:'🧾'}];
    s.push([headL('HẠNG MỤC / ĐẦU MỤC'),head('ĐVT DỰ TOÁN'),head('HẠN MỨC'),head('THỰC CHI'),head('% DÙNG'),head('CHÊNH LỆCH')]);
    catList.forEach(c=>{
      const cat=b.cats[c.id]||{total:0,items:[]};
      const spentCat=spentByCat(p,c.id);
      const items=(cat.items||[]).slice().sort((a,b)=>b.limit-a.limit);
      if(!(cat.total>0 || items.length || spentCat>0)) return;
      const st=budgetStatus(cat.total,spentCat);
      const stColor=st.over?C.over:C.ok;
      // dòng hạng mục
      s.push([{v:c.icon+' '+c.name,bold:true,color:C.ink,fill:C.subBg,border:true,align:'left'},
        {v:'',fill:C.subBg,border:true},
        money(cat.total,C.ink,true,C.subBg),money(spentCat,stColor,true,C.subBg),
        pctCell(st.pct,true),money(cat.total-spentCat,cat.total-spentCat<0?C.over:C.ink,true,C.subBg)]);
      // từng đầu mục dự toán
      items.forEach((it,ii)=>{
        const isp=spentByItem(p,c.id,it.name); const s3=budgetStatus(it.limit,isp);
        const f=ii%2===1?C.band:undefined;
        s.push([txt('   • '+it.name,'left',f), txt('','center',f),
          money(it.limit,C.ink,false,f), money(isp,isp>0?C.ok:C.sub,false,f),
          pctCell(s3.pct), money(it.limit-isp,it.limit-isp<0?C.over:C.ink,false,f)]);
      });
      // các khoản thực chi trong hạng mục nhưng KHÔNG gán đầu mục dự toán
      const unmapped=p.costs.filter(x=>x.cat===c.id && !(x.blItem||'').trim());
      if(unmapped.length){
        const un=unmapped.reduce((a,x)=>a+Number(x.amount||0),0);
        s.push([txt('   • (Chi khác — chưa gán đầu mục dự toán)','left'),txt('','center'),
          money(0,C.sub),money(un,C.cost),pctCell(0),money(-un,C.over)]);
      }
    });
    // tổng chi phí
    s.push([{v:'TỔNG CHI PHÍ',bold:true,color:C.headTxt,fill:C.head,border:true,align:'left'},
      {v:'',fill:C.head,border:true},money(t.cost,C.headTxt,true,C.head),money(t.cost,C.headTxt,true,C.head),
      {v:'',fill:C.head,border:true},{v:'',fill:C.head,border:true}]);

    sheets.push({name:uniqueName((pi+1)+'.'+p.name), rows:s, cols:[40,14,17,17,10,17],
      merges:[{s:{r:0,c:0},e:{r:0,c:5}}]});
  });

  // ============================================================
  // GIAO DỊCH CHI TIẾT — TẤT CẢ DỰ ÁN (1 sheet, gom theo dự án)
  // ============================================================
  {
    let sd=[];
    sd.push([title('GIAO DỊCH CHI PHÍ — TẤT CẢ DỰ ÁN'),'','','','','','','']); sd[0].__h=24;
    sd.push(['','','','','','','','']);
    sd.push([headL('DỰ ÁN / HẠNG MỤC'),head('NHÓM TT'),head('ĐỢT'),head('ĐẦU MỤC DỰ TOÁN'),head('GHI CHÚ'),head('VAT'),head('NGÀY GIỜ'),head('SỐ TIỀN')]);
    let stt=0;
    ordered.forEach(p=>{
      if(!p.costs.length) return;
      stt++;
      sd.push([{v:stt+'. '+p.name,bold:true,color:C.headTxt,fill:C.locBg,border:true,align:'left'},
        ...Array(6).fill({v:'',fill:C.locBg,border:true}), {v:'',fill:C.locBg,border:true}]);
      COST_CATS.forEach(c=>{
        const list=p.costs.filter(x=>x.cat===c.id).sort((a,b)=>fmtDT(b).localeCompare(fmtDT(a)));
        if(!list.length) return;
        let sub=0;
        list.forEach((x,i)=>{ sub+=Number(x.amount||0); const hv=x.hasVat!==false;
          const f=i%2===1?C.band:undefined;
          sd.push([{v:'   '+c.name,border:true,align:'left',fill:f},
            {v:x.payGroup?(pgIcon(p,x.payGroup)+' '+pgName(p,x.payGroup)):'',border:true,align:'left',fill:f},
            {v:x.dot||'',border:true,align:'center',fill:f},
            {v:x.blItem||'',border:true,align:'left',fill:f},
            {v:x.note||'',border:true,align:'left',fill:f},
            {v:hv?'Có':'Không',color:hv?C.ok:C.sub,border:true,align:'center',fill:f,bold:true},
            {v:fmtDT(x),border:true,align:'center',fill:f},money(x.amount,C.cost,false,f)]); });
        sd.push([{v:'   Cộng '+c.name,bold:true,color:C.ink,fill:C.subBg,border:true,align:'left'},
          ...Array(6).fill({v:'',fill:C.subBg,border:true}),money(sub,C.cost,true,C.subBg)]);
      });
    });
    sheets.push({name:uniqueName('Giao dịch chi phí'), rows:sd, cols:[24,18,10,20,24,8,17,17],
      merges:[{s:{r:0,c:0},e:{r:0,c:7}}]});
  }

  // ============================================================
  // NHÓM THANH TOÁN & ĐỢT — TẤT CẢ DỰ ÁN
  // ============================================================
  {
    let sp=[];
    sp.push([title('NHÓM THANH TOÁN & ĐỢT (thầu phụ · NCC · máy)'),'','','','','']); sp[0].__h=24;
    sp.push(['','','','','','']);
    sp.push([headL('DỰ ÁN / NHÓM / ĐỢT'),head('HẠNG MỤC'),head('SỐ GD'),head('','center'),head('','center'),head('SỐ TIỀN')]);
    let any=false;
    ordered.forEach(p=>{
      const pgs=payGroups(p);
      if(!pgs.length) return;
      any=true;
      sp.push([{v:'🏗️ '+p.name,bold:true,color:C.headTxt,fill:C.locBg,border:true,align:'left'},
        ...Array(4).fill({v:'',fill:C.locBg,border:true}),{v:'',fill:C.locBg,border:true}]);
      PG_CATS.forEach(pc=>{
        const groups=pgs.filter(g=>g.cat===pc.id);
        groups.forEach(g=>{
          const gt=pgTotal(p,g.id); const rounds=pgRounds(p,g.id);
          sp.push([{v:'  '+(g.icon||pc.icon)+' '+g.name,bold:true,color:C.ink,fill:C.subBg,border:true,align:'left'},
            {v:pc.name,fill:C.subBg,border:true,align:'center'},
            {v:pgCosts(p,g.id).length,fill:C.subBg,border:true,align:'center'},
            {v:'',fill:C.subBg,border:true},{v:'',fill:C.subBg,border:true},
            money(gt,C.cost,true,C.subBg)]);
          rounds.forEach((r,ri)=>{
            const f=ri%2===1?C.band:undefined;
            sp.push([txt('      • '+r.dot,'left',f),txt('','center',f),
              {v:r.count,border:true,align:'center',fill:f},txt('','center',f),txt('','center',f),
              money(r.amount,C.ink,false,f)]);
          });
        });
      });
    });
    if(!any){ sp.push([txt('Chưa tạo nhóm thanh toán nào. Vào tab Chi phí → Nhóm thanh toán để tạo.'),'','','','','']); }
    sheets.push({name:uniqueName('Nhóm thanh toán'), rows:sp, cols:[38,14,8,4,4,18],
      merges:[{s:{r:0,c:0},e:{r:0,c:5}}]});
  }

  // ============================================================
  // THU / TẠM ỨNG — TẤT CẢ DỰ ÁN
  // ============================================================
  {
    let si=[];
    si.push([title('THU / TẠM ỨNG — TẤT CẢ DỰ ÁN'),'','','','']); si[0].__h=24;
    si.push(['','','','','']);
    si.push([headL('DỰ ÁN / LOẠI'),head('GHI CHÚ'),head('NGÀY GIỜ'),head('SỐ TIỀN'),head('')]);
    let grand=0;
    ordered.forEach(p=>{
      if(!p.income.length) return;
      let sub=0;
      si.push([{v:'💰 '+p.name,bold:true,color:C.headTxt,fill:C.locBg,border:true,align:'left'},
        {v:'',fill:C.locBg,border:true},{v:'',fill:C.locBg,border:true},{v:'',fill:C.locBg,border:true},{v:'',fill:C.locBg,border:true}]);
      [...p.income].sort((a,b)=>fmtDT(b).localeCompare(fmtDT(a))).forEach((x,i)=>{
        sub+=Number(x.amount||0); const f=i%2===1?C.band:undefined;
        si.push([{v:'   '+(x.type==='adv'?'Tạm ứng':'Thanh toán'),border:true,align:'left',fill:f},
          {v:x.note||'',border:true,align:'left',fill:f},{v:fmtDT(x),border:true,align:'center',fill:f},
          money(x.amount,C.inc,false,f),{v:'',border:true,fill:f}]);
      });
      si.push([{v:'   Cộng '+p.name,bold:true,color:C.ink,fill:C.subBg,border:true,align:'left'},
        {v:'',fill:C.subBg,border:true},{v:'',fill:C.subBg,border:true},money(sub,C.inc,true,C.subBg),{v:'',fill:C.subBg,border:true}]);
      grand+=sub;
    });
    si.push([{v:'TỔNG THU TẤT CẢ DỰ ÁN',bold:true,color:C.headTxt,fill:C.head,border:true,align:'left'},
      {v:'',fill:C.head,border:true},{v:'',fill:C.head,border:true},money(grand,C.headTxt,true,C.head),{v:'',fill:C.head,border:true}]);
    sheets.push({name:uniqueName('Thu-Tạm ứng'), rows:si, cols:[26,34,18,18,2],
      merges:[{s:{r:0,c:0},e:{r:0,c:4}}]});
  }

  // ============================================================
  // SHEET: CHỨNG TỪ (ĐÍNH KÈM) — liệt kê + NHÚNG ẢNH, kèm file gốc trong .zip
  // ============================================================
  // Gom mọi chứng từ của mọi giao dịch (chi phí + thu) trên tất cả dự án.
  const attRows=[];   // {proj, kind, cat, note, dt, amount, meta}
  ordered.forEach(p=>{
    (p.costs||[]).forEach(x=>{ (x.att||[]).forEach(a=>attRows.push({
      proj:p.name, kind:'Chi', cat:catName(x.cat), note:x.note||'', dt:fmtDT(x), amount:Number(x.amount||0), meta:a})); });
    (p.income||[]).forEach(x=>{ (x.att||[]).forEach(a=>attRows.push({
      proj:p.name, kind:(x.type==='adv'?'Tạm ứng':'Thu'), cat:'', note:x.note||'', dt:fmtDT(x), amount:Number(x.amount||0), meta:a})); });
  });

  // Chuẩn bị file gốc cho .zip + ảnh nhúng cho sheet
  const zipExtra=[];         // {name,data} file gốc trong thư mục chung-tu/
  const attImages=[];        // ảnh nhúng vào sheet Chứng từ
  const attSheetRows=[];     // dữ liệu bảng
  if(attRows.length){
    attSheetRows.push([title('CHỨNG TỪ THANH TOÁN (ĐÍNH KÈM)'),'','','','','','']); attSheetRows[0].__h=24;
    attSheetRows.push([lbl('Tổng số chứng từ',true),txt(attRows.length+' file'),'','','','','']);
    attSheetRows.push(['','','','','','','']);
    attSheetRows.push([headL('STT'),head('DỰ ÁN'),head('LOẠI'),head('GHI CHÚ'),head('NGÀY GIỜ'),head('SỐ TIỀN'),headL('CHỨNG TỪ (ảnh xem trực tiếp · file gốc trong thư mục chung-tu)')]);
    const nameCount={};
    const headerRows=attSheetRows.length; // số dòng tiêu đề trước dữ liệu
    for(let idx=0; idx<attRows.length; idx++){
      const it=attRows[idx]; const a=it.meta;
      let blob=null; try{ blob=await attGet(a.id); }catch(e){}
      // đường dẫn trong zip: chung-tu/<slug dự án>/<STT>-<tên file>
      const folder='chung-tu/'+slugFolder(it.proj);
      let base=safeName(a.name); const key=folder+'/'+base;
      nameCount[key]=(nameCount[key]||0)+1; if(nameCount[key]>1){ const dot=base.lastIndexOf('.');
        base = dot>0 ? base.slice(0,dot)+'-'+nameCount[key]+base.slice(dot) : base+'-'+nameCount[key]; }
      const zipPath=folder+'/'+(idx+1)+'-'+base;
      if(blob){ try{ zipExtra.push({name:zipPath, data:await blobBytes(blob)}); }catch(e){} }
      const rIndex=attSheetRows.length; // dòng hiện tại (0-based) cho ảnh
      const f=idx%2===1?C.band:undefined;
      attSheetRows.push([
        numCell(idx+1,'center',f),
        txt(it.proj,'left',f),
        txt(it.kind+(it.cat?(' · '+it.cat):''),'left',f),
        txt(it.note,'left',f),
        txt(it.dt,'center',f),
        money(it.amount, it.kind==='Chi'?C.cost:C.inc, false, f),
        txt(zipPath,'left',f)
      ]);
      // nhúng ảnh (nếu là ảnh) vào cột cuối; đặt chiều cao dòng để vừa ảnh
      if(blob && isImgType(a.type)){
        try{
          const bytes=await blobBytes(blob); const sz=await imgSize(blob);
          const maxW=260, maxH=170; let w=sz.w, h=sz.h;
          const sc=Math.min(maxW/w, maxH/h, 1); w=Math.round(w*sc); h=Math.round(h*sc);
          let ext=(a.type.split('/')[1]||'png').toLowerCase(); if(ext==='jpeg') ext='jpeg';
          if(ext!=='png'&&ext!=='jpeg'&&ext!=='jpg') ext='png';
          attImages.push({col:6, row:rIndex, colOff:3, rowOff:3, w, h, data:bytes, ext});
          attSheetRows[rIndex].__h = Math.max(h+8, 20)/1.33; // xấp xỉ px->point
        }catch(e){}
      }
    }
    sheets.push({name:uniqueName('Chứng từ'), rows:attSheetRows, cols:[5,22,16,26,17,16,44],
      merges:[{s:{r:0,c:0},e:{r:0,c:6}}], images:attImages});
  }

  try{
    const bytes=buildXlsx(sheets);
    if(zipExtra.length){
      // Gói .zip: báo cáo .xlsx + toàn bộ file chứng từ gốc
      const pkg=[{name:'bao-cao-tat-ca-du-an.xlsx', data:bytes}, ...zipExtra];
      const zipBytes=zipStore(pkg);
      const blob=new Blob([zipBytes],{type:'application/zip'});
      const ok=await downloadBlob(blob, 'bao-cao-kem-chung-tu.zip');
      toast(ok?('Đã xuất báo cáo + '+attRows.length+' chứng từ (.zip)'):'Không tải được — thử lại');
    } else {
      const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
      const ok=await downloadBlob(blob, 'bao-cao-tat-ca-du-an.xlsx');
      toast(ok?('Đã xuất báo cáo '+DB.projects.length+' dự án'):'Không tải được — thử lại hoặc dùng sao lưu Drive');
    }
  }catch(e){ toast('Lỗi xuất: '+e.message); console.error(e); }
}


/* ==================== MODALS: THÊM/SỬA ==================== */
function fabToggle(){ document.getElementById('fab').classList.toggle('open'); }
function fabClose(){ document.getElementById('fab').classList.remove('open'); }
document.addEventListener('click',e=>{ const f=document.getElementById('fab'); if(f&&f.classList.contains('open')&&!f.contains(e.target)) f.classList.remove('open'); });
function closeModal(){ document.getElementById('modal').classList.remove('show');
  if(PENDING_ATT && PENDING_ATT.some(a=>a._new)) discardPendingAtt(); else PENDING_ATT=[]; }
document.getElementById('modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });

function openIncome(id){

      const found=pp.income.find(x=>x.id===id);
      if(found){ ex=found; p=pp; ownerId=pp.id; break; }

  const type = ex? ex.type : 'in';
  const projOpts=DB.projects.map(pp=>`<option value="${pp.id}" ${pp.id===ownerId?'selected':''}>${esc(pp.name)}</option>`).join('');

    document.getElementById('sheet').innerHTML = `

    renderAttList();
    return;
  }
  document.getElementById('sheet').innerHTML = `
    <h3>Sửa khoản Thu / Tạm ứng</h3>
    <label>Dự án <span style="color:var(--cost)">*</span></label>
    <select id="iProj">${projOpts}</select>

      <button type="button" class="${type==='in'?'on':''}" onclick="segSet('segType',this,'in')">Thanh toán</button>
      <button type="button" class="${type==='adv'?'on':''}" onclick="segSet('segType',this,'adv')">Tạm ứng</button>
    </div>
    <input type="hidden" id="iType" value="${type}">
    <label>Số tiền (đ)</label>
    <input type="text" id="iAmt" inputmode="numeric" value="${ex?ex.amount:''}" placeholder="VD: 25000000000">
    <div class="row">
      <div><label>Ngày</label><input type="date" id="iDate" value="${ex?ex.date:today()}"></div>
      <div><label>Giờ:phút:giây</label><input type="time" step="1" id="iTime" value="${ex&&ex.time?ex.time:nowTime()}"></div>
    </div>
    <label>Ghi chú</label><input type="text" id="iNote" value="${ex?esc(ex.note):''}" placeholder="VD: Tạm ứng đợt 1 — CĐT Tân Cảng">
    <label>Chứng từ (uỷ nhiệm chi, hoá đơn, ảnh, PDF…)</label>
    <div id="attList" class="attList"></div>

// Lưu gộp: tạo khoản Thanh toán và/hoặc Tạm ứng từ một form
function saveIncomeCombined(){
  const targetId=document.getElementById('iProj')?.value||CUR;
  const target=DB.projects.find(pp=>pp.id===targetId)||proj();
  const pay=parseNum(document.getElementById('iPay').value);
  const adv=parseNum(document.getElementById('iAdv').value);
  if(!pay && !adv){ toast('Nhập số tiền thanh toán hoặc tạm ứng'); return; }
  const date=document.getElementById('iDate').value||today();
  const time=document.getElementById('iTime').value||'';
  const note=(document.getElementById('iNote').value||'').trim();
  const att=Array.isArray(PENDING_ATT)?PENDING_ATT.map(a=>({...a})):[];
  const mk=(type,amount)=>({id:'i'+Date.now()+Math.floor(Math.random()*99999),type,amount,date,time,note,att:att.map(a=>({...a}))});
  if(!Array.isArray(target.income)) target.income=[];
  let n=0;
  if(pay){ target.income.push(mk('in',pay)); n++; }
  if(adv){ target.income.push(mk('adv',adv)); n++; }
  save(); closeModal(); renderAll();
  toast(n===2?'Đã lưu 1 thanh toán + 1 tạm ứng':'Đã lưu khoản thu');
}

function saveIncome(id){
  const targetId = document.getElementById('iProj')?.value || CUR;
  const target = DB.projects.find(pp=>pp.id===targetId) || proj();
  const obj={ id:id||('i'+Date.now()+Math.floor(Math.random()*999)),
    type:document.getElementById('iType').value,
    amount:parseNum(document.getElementById('iAmt').value),
    date:document.getElementById('iDate').value,
    time:document.getElementById('iTime').value||'',
    note:document.getElementById('iNote').value.trim() };
  if(!obj.amount){ toast('Nhập số tiền'); return; }
  // Xoá khỏi dự án cũ nếu chuyển dự án
  if(id){
    DB.projects.forEach(pp=>{ pp.income = (pp.income||[]).filter(x=>x.id!==id); });
  }
  target.income = target.income||[];
  target.income.push(obj);
  logAudit('add','income',(obj.type==='adv'?'Tạm ứng ':'Thu ')+fmtShortMoney(obj.amount), target.name);
  // Gắn chứng từ
  if(PENDING_ATT && PENDING_ATT.length) obj.att = PENDING_ATT.map(a=>({id:a.id,name:a.name,type:a.type,size:a.size}));
  PENDING_ATT=[];
  CUR = target.id;
  save(); closeModal(); renderAll();
  const loai = obj.type==='adv'?'Tạm ứng':'Thanh toán';
  toast(loai+' → '+target.name);
  const hasHD = (target.budget&&target.budget.revenue>0) || (target.contractAmount>0);
  if(!hasHD) setTimeout(()=>toast('Nhập Doanh thu HĐ ở Cài đặt để tính Còn lại'), 1800);
}

// cảnh báo vượt hạn mức trực tiếp trong form
function updateBudgetWarn(){
  const box=document.getElementById('budgetWarn'); if(!box) return;
  const p=proj(); if(!hasBudget(p)){ box.innerHTML=''; return; }
  const cat=document.getElementById('cCat').value;
  const amt=parseNum(document.getElementById('cAmt').value);
  const item=document.getElementById('cItem')?document.getElementById('cItem').value:'';
  let html='';
  // hạn mức con
  if(item){
    const it=(p.budget.cats[cat].items||[]).find(x=>x.name===item);
    if(it){ const already=spentByItem(p,cat,item); const after=already+amt; const st=budgetStatus(it.limit,after);
      html+=warnLine(item, after, it.limit, st); }
  }
  // hạn mức nhóm
  const c=p.budget.cats[cat];
  if(c && c.total>0){ const already=spentByCat(p,cat); const after=already+amt; const st=budgetStatus(c.total,after);
    html+=warnLine('Tổng '+catName(cat), after, c.total, st); }
  box.innerHTML=html;
}
function warnLine(label, spent, limit, st){
  const col=st.over?'#dc2626':(st.pct>=90?'#d97706':'#059669');
  const icon=st.over?'⚠️ VƯỢT':(st.pct>=90?'⚠️ Sắp vượt':'✓');
  return `<div style="margin:6px 0;padding:8px 10px;border-radius:8px;background:${st.over?'#fef2f2':(st.pct>=90?'#fffbeb':'#f0fdf4')};font-size:12px">
    <div style="display:flex;gap:8px"><b style="color:${col}">${icon}</b><span>${esc(label)}</span><span style="margin-left:auto" class="num">${st.pct.toFixed(0)}%</span></div>
    <div style="height:5px;background:#e5e7eb;border-radius:3px;margin-top:5px;overflow:hidden"><div style="width:${Math.min(st.pct,100).toFixed(0)}%;height:100%;background:${col}"></div></div>
    <div class="num" style="color:var(--sub);margin-top:3px">${fmtFull(spent)} / ${fmtFull(limit)}${st.over?(' · vượt '+fmtFull(spent-limit)):(' · còn '+fmtFull(limit-spent))}</div>
  </div>`;
}
function saveCost(id){
  const targetId=document.getElementById('cProj')?.value||CUR;
  let p=DB.projects.find(pp=>pp.id===targetId)||proj();
  // Nếu sửa và đổi dự án: gỡ khỏi dự án cũ
  if(id){
    DB.projects.forEach(pp=>{
      if(pp.id!==p.id) pp.costs=(pp.costs||[]).filter(x=>x.id!==id);
    });
  }
  CUR=p.id;
  const acctId=document.getElementById('cAcct')?document.getElementById('cAcct').value:'';
  const obj={ id:id||('c'+Date.now()+Math.floor(Math.random()*999)),
    cat:document.getElementById('cCat').value,
    group:document.getElementById('cGroup').value.trim(),
    blItem:document.getElementById('cItem')?document.getElementById('cItem').value:'',
    payGroup:(document.getElementById('cPayGroup')&&document.getElementById('cPayGroup').value!=='__new__')?document.getElementById('cPayGroup').value:'',
    dot:document.getElementById('cDot')?document.getElementById('cDot').value.trim():'',
    amount:parseNum(document.getElementById('cAmt').value),
    date:document.getElementById('cDate').value,
    time:document.getElementById('cTime').value||'',
    note:document.getElementById('cNote').value.trim(),
    hasVat:document.getElementById('cVat')?document.getElementById('cVat').value==='1':true,
    payStatus:(document.getElementById('cStatus')||{}).value||'paid',
    acctId:acctId||'',
    att: PENDING_ATT.map(a=>({id:a.id,name:a.name,type:a.type,size:a.size})) };
  if(!obj.amount){ toast('Nhập số tiền'); return; }
  // dọn chứng từ đã bị gỡ khỏi giao dịch (so với bản cũ) khỏi IndexedDB
  if(id){ const old=p.costs.find(x=>x.id===id); if(old&&Array.isArray(old.att)){
    const keep=new Set(obj.att.map(a=>a.id));
    old.att.forEach(a=>{ if(!keep.has(a.id)) attDel(a.id); });
  }}
  PENDING_ATT=[];   // đã gắn vào giao dịch, không dọn nữa
  // gỡ giao dịch tài khoản cũ (nếu sửa)
  if(id){ removeAcctRef(id); }
  if(id){ const i=p.costs.findIndex(x=>x.id===id); p.costs[i]=obj; } else p.costs.push(obj);
  logAudit(id?'edit':'add', 'cost', 'Chi '+fmtShortMoney(obj.amount)+(obj.note?(' — '+obj.note.slice(0,24)):''), p.name);
  // trừ tiền tài khoản nếu có chọn
  let acctMsg='';
  if(acctId){
    const a=acctById(acctId);
    if(a){ a.txns.push({id:'at'+Date.now()+Math.floor(Math.random()*999), date:obj.date, time:obj.time||nowTime(),
      amount:-Math.abs(obj.amount), note:obj.note||('Chi '+catName(obj.cat)), ref:'cost:'+obj.id});
      acctMsg=' · trừ '+a.name; }
  }
  save(); closeModal(); renderAll();
  if(hasBudget(p) && obj.blItem){
    const it=(p.budget.cats[obj.cat].items||[]).find(x=>x.name===obj.blItem);
    if(it){ const sp=spentByItem(p,obj.cat,obj.blItem); if(sp>it.limit){ toast('⚠️ "'+obj.blItem+'" đã VƯỢT hạn mức '+fmtFull(sp-it.limit)); return; } }
  }
  toast('Đã lưu'+acctMsg);
}
// gỡ giao dịch tài khoản liên kết với 1 khoản chi
function removeAcctRef(costId){
  DB.accounts.forEach(a=>{ a.txns=(a.txns||[]).filter(x=>x.ref!=='cost:'+costId); });
}
function delCost(id){ const p=proj(); const ex=p.costs.find(x=>x.id===id);
  if(ex) logAudit('delete','cost','Xoá chi '+fmtShortMoney(ex.amount)+(ex.note?(' — '+ex.note.slice(0,24)):''), p.name);
  if(ex&&Array.isArray(ex.att)) ex.att.forEach(a=>attDel(a.id));
  PENDING_ATT=[]; removeAcctRef(id); p.costs=p.costs.filter(x=>x.id!==id); save(); closeModal(); renderAll(); toast('Đã xoá'); }

// Đọc số tiền thành chữ tiếng Việt
function docSoThanhChu(n){
  if(!n) return 'Không đồng';
  const chuSo=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  const donVi=['','nghìn','triệu','tỷ'];
  function docBaSo(so, dayDu){
    let tram=Math.floor(so/100), chuc=Math.floor((so%100)/10), donvi=so%10, kq='';
    if(dayDu||tram>0){ kq+=chuSo[tram]+' trăm'; }
    if(chuc>1){ kq+=' '+chuSo[chuc]+' mươi'; if(donvi===1) kq+=' mốt'; else if(donvi===5) kq+=' lăm'; else if(donvi>0) kq+=' '+chuSo[donvi]; }
    else if(chuc===1){ kq+=' mười'; if(donvi===5) kq+=' lăm'; else if(donvi>0) kq+=' '+chuSo[donvi]; }
    else if(donvi>0){ if(tram>0||dayDu) kq+=' lẻ'; kq+=' '+chuSo[donvi]; }
    return kq.trim();
  }
  let so=Math.floor(Math.abs(n)), nhom=[];
  if(so===0) return 'Không đồng';
  while(so>0){ nhom.push(so%1000); so=Math.floor(so/1000); }
  let kq='';
  for(let j=nhom.length-1;j>=0;j--){
    if(nhom[j]>0){ kq+=' '+docBaSo(nhom[j], j<nhom.length-1)+' '+donVi[j]; }
  }
  kq=kq.trim().replace(/\s+/g,' ');
  return kq.charAt(0).toUpperCase()+kq.slice(1)+' đồng';
}

// khóa nhận diện trùng: cùng số tiền + cùng ngày + cùng ghi chú (bỏ dấu, thường hóa)
function dupKey(x){ return [Math.round(Number(x.amount||0)), (x.date||''), normText(x.note||'')].join('|'); }
// trả về Set các id là "bản trùng" (giữ lại bản đầu, đánh dấu các bản sau)
function dupIdSet(list){
  const seen=new Map(), dups=new Set();
  [...list].sort((a,b)=>((a.date||'')+(a.time||'')).localeCompare((b.date||'')+(b.time||'')))
    .forEach(x=>{ const k=dupKey(x); if(seen.has(k)) dups.add(x.id); else seen.set(k,x.id); });
  return dups;
}
// nhóm các giao dịch trùng: [{key, items:[...]}] cho toàn dự án hiện tại
function dupGroups(p){
  const all=[...(p.costs||[]).map(x=>({...x,_kind:'cost'})), ...(p.income||[]).map(x=>({...x,_kind:'income'}))];
  const map=new Map();
  all.forEach(x=>{ const k=(x._kind)+'|'+dupKey(x); if(!map.has(k)) map.set(k,[]); map.get(k).push(x); });
  return [...map.values()].filter(g=>g.length>1);
}
// đếm tổng số bản trùng (thừa) trong dự án
function dupCount(p){ return dupGroups(p).reduce((s,g)=>s+(g.length-1),0); }

/* ==================== XLSX WRITER (xuất báo cáo) ==================== */
/* ============ MINIMAL XLSX WRITER (store-only ZIP, pure JS) ============ */
function crc32(bytes){
  let c, crc=0xFFFFFFFF;
  if(!crc32.tab){ crc32.tab=[]; for(let n=0;n<256;n++){ c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); crc32.tab[n]=c>>>0; } }
  for(let i=0;i<bytes.length;i++) c=crc32.tab[(crc^bytes[i])&0xFF]^(crc>>>8), crc=c;
  return (crc^0xFFFFFFFF)>>>0;
}
function strBytes(s){ return new TextEncoder().encode(s); }
function u16(n){ return [n&0xFF,(n>>8)&0xFF]; }
function u32(n){ return [n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>24)&0xFF]; }

function zipStore(files){ // files: [{name, data(Uint8Array)}]
  const chunks=[]; const central=[]; let offset=0;
  files.forEach(f=>{
    const nameB=strBytes(f.name); const crc=crc32(f.data); const sz=f.data.length;
    const local=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(crc),u32(sz),u32(sz),u16(nameB.length),u16(0));
    const localB=new Uint8Array(local);
    chunks.push(localB, nameB, f.data);
    const cen=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(crc),u32(sz),u32(sz),u16(nameB.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset));
    central.push(new Uint8Array(cen), nameB);
    offset += localB.length+nameB.length+f.data.length;
  });
  let cenSize=0; central.forEach(c=>cenSize+=c.length);
  const cenStart=offset;
  const eocd=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),
    u16(files.length),u16(files.length),u32(cenSize),u32(cenStart),u16(0)));
  const all=[...chunks,...central,eocd];
  let total=0; all.forEach(a=>total+=a.length);
  const out=new Uint8Array(total); let p=0; all.forEach(a=>{out.set(a,p);p+=a.length;});
  return out;
}
function xlsxEsc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function colL(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; } return s; }

// sheets: [{name, rows:[[cell,...]]}], cell = {v, t:'n'|'s', b:bool, f:'#,##0'}
// sheets: [{name, rows:[[cell,...]], cols:[width,...], merges:[{s:{r,c},e:{r,c}}]}]
// cell = {v, t:'n'|'s', bold, f:'#,##0'|'0%', fill:'HEX', color:'HEX', align:'left'|'center'|'right', border:true, size:number, wrap:true}
function buildXlsx(sheets){
  // ---- Thu thập style duy nhất ----
  const numFmtList=['#,##0','0%','dd/mm/yyyy hh:mm:ss','@','#,##0" đ"'];
  const numFmtId=f=>{ const i=numFmtList.indexOf(f); return i<0?0:164+i; };
  const fills=['none','none']; // 0=none,1=gray125(mặc định excel)
  const fillId=hex=>{ if(!hex) return 0; const key='FF'+hex.replace('#','').toUpperCase(); let i=fills.indexOf(key); if(i<0){ i=fills.length; fills.push(key);} return i; };
  const fonts=[{}]; // 0 = mặc định
  const fontId=(bold,color,size)=>{ const key=JSON.stringify([!!bold,color||'',size||11]); let i=fonts.findIndex(f=>JSON.stringify([!!f.bold,f.color||'',f.size||11])===key); if(i<0){ i=fonts.length; fonts.push({bold,color,size});} return i; };
  const xfs=[{}]; // cellXfs, 0 mặc định
  const xfId=spec=>{ const key=JSON.stringify(spec); let i=xfs.findIndex(x=>JSON.stringify(x.__k)===key); if(i<0){ i=xfs.length; xfs.push({...spec,__k:key});} return i; };
  // pre-map style của mỗi cell
  const cellStyle=c=>{
    if(!(typeof c==='object')) return 0;
    const spec={};
    const nf=c.f?numFmtId(c.f):0; if(nf) spec.numFmtId=nf;
    const fo=fontId(c.bold, c.color, c.size); if(fo) spec.fontId=fo;
    const fi=c.fill?fillId(c.fill):0; if(fi) spec.fillId=fi;
    if(c.align) spec.align=c.align;
    if(c.wrap) spec.wrap=true;
    if(c.border) spec.border=1;
    if(!Object.keys(spec).length) return 0;
    return xfId(spec);
  };
  // gán trước để build bảng style
  sheets.forEach(sh=>sh.rows.forEach(row=>row.forEach(cell=>{ if(typeof cell==='object') cell.__s=cellStyle(cell); })));

  // ---- styles.xml ----
  const numFmtsXml=numFmtList.map((f,i)=>`<numFmt numFmtId="${164+i}" formatCode="${xlsxEsc(f)}"/>`).join('');
  const fontsXml=fonts.map(f=>{
    const parts=[`<sz val="${f.size||11}"/>`,`<name val="Calibri"/>`];
    if(f.bold) parts.unshift('<b/>');
    if(f.color) parts.push(`<color rgb="FF${String(f.color).replace('#','').toUpperCase()}"/>`);
    return `<font>${parts.join('')}</font>`;
  }).join('');
  const fillsXml=fills.map((hex,i)=>{
    if(i===0) return '<fill><patternFill patternType="none"/></fill>';
    if(i===1) return '<fill><patternFill patternType="gray125"/></fill>';
    return `<fill><patternFill patternType="solid"><fgColor rgb="${hex}"/><bgColor indexed="64"/></patternFill></fill>`;
  }).join('');
  const thin='<left style="thin"><color rgb="FFD9D9D9"/></left><right style="thin"><color rgb="FFD9D9D9"/></right><top style="thin"><color rgb="FFD9D9D9"/></top><bottom style="thin"><color rgb="FFD9D9D9"/></bottom>';
  const bordersXml=`<border/><border>${thin}</border>`;
  const cellXfsXml=xfs.map(x=>{
    if(!x || !Object.keys(x).filter(k=>k!=='__k').length) return '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>';
    const nf=x.numFmtId||0, fo=x.fontId||0, fi=x.fillId||0, bo=x.border||0;
    let align='';
    if(x.align||x.wrap) align=`<alignment${x.align?` horizontal="${x.align}"`:''}${x.wrap?' wrapText="1"':''} vertical="center"/>`;
    return `<xf numFmtId="${nf}" fontId="${fo}" fillId="${fi}" borderId="${bo}" xfId="0"`+
      `${nf?' applyNumberFormat="1"':''}${fo?' applyFont="1"':''}${fi?' applyFill="1"':''}${bo?' applyBorder="1"':''}${align?' applyAlignment="1"':''}>`+
      `${align}</xf>`;
  }).join('');
  const styles=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<numFmts count="${numFmtList.length}">${numFmtsXml}</numFmts>
<fonts count="${fonts.length}">${fontsXml}</fonts>
<fills count="${fills.length}">${fillsXml}</fills>
<borders count="2">${bordersXml}</borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="${xfs.length}">${cellXfsXml}</cellXfs>
</styleSheet>`;

  // ---- worksheets ----
  const wsFiles=[]; const wbSheets=[]; const rels=[];
  const mediaFiles=[];        // {name, data} ảnh nhúng trong xl/media
  const drawingFiles=[];      // {name, data} xl/drawings/drawingN.xml
  const drawingRelFiles=[];   // {name, data} xl/drawings/_rels/drawingN.xml.rels
  const extraContentTypes=[]; // Override cho drawings + Default cho png/jpeg
  const seenExt={};
  let mediaIdx=0, drawIdx=0;
  sheets.forEach((sh,si)=>{
    let colsXml='';
    if(sh.cols&&sh.cols.length){
      colsXml='<cols>'+sh.cols.map((w,i)=>`<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join('')+'</cols>';
    }
    let rowsXml='';
    sh.rows.forEach((row,ri)=>{
      let cellsXml='';
      row.forEach((cell,ci)=>{
        if(cell==null||cell==='') return;
        const ref=colL(ci+1)+(ri+1);
        let c=(typeof cell==='object')?cell:{v:cell};
        const s=c.__s||0;
        const isStr = c.t==='s' || (typeof c.v==='string' && c.t!=='n');
        if(isStr){
          cellsXml+=`<c r="${ref}" t="inlineStr"${s?` s="${s}"`:''}><is><t xml:space="preserve">${xlsxEsc(c.v)}</t></is></c>`;
        } else {
          cellsXml+=`<c r="${ref}"${s?` s="${s}"`:''}><v>${c.v}</v></c>`;
        }
      });
      const rh = row.__h ? ` ht="${row.__h}" customHeight="1"` : '';
      rowsXml+=`<row r="${ri+1}"${rh}>${cellsXml}</row>`;
    });
    let mergeXml='';
    if(sh.merges&&sh.merges.length){
      mergeXml='<mergeCells count="'+sh.merges.length+'">'+sh.merges.map(m=>`<mergeCell ref="${colL(m.s.c+1)}${m.s.r+1}:${colL(m.e.c+1)}${m.e.r+1}"/>`).join('')+'</mergeCells>';
    }
    // ---- ảnh nhúng (drawing) cho sheet này ----
    let drawingXml='';
    const imgs=(sh.images||[]).filter(im=>im&&im.data&&im.data.length);
    if(imgs.length){
      drawIdx++;
      const drawName=`drawing${drawIdx}`;
      const anchors=[]; const drels=[];
      imgs.forEach((im,k)=>{
        mediaIdx++;
        const ext=(im.ext||'png').toLowerCase();
        const mediaName=`image${mediaIdx}.${ext}`;
        mediaFiles.push({name:`xl/media/${mediaName}`, data:im.data});
        if(!seenExt[ext]){ seenExt[ext]=1;
          const ct=ext==='png'?'image/png':(ext==='jpg'||ext==='jpeg'?'image/jpeg':'application/octet-stream');
          extraContentTypes.push(`<Default Extension="${ext==='jpeg'?'jpeg':ext}" ContentType="${ct}"/>`);
        }
        const rId='rId'+(k+1);
        drels.push(`<Relationship Id="${rId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="../media/${mediaName}"/>`);
        // neo 2 điểm (oneCellAnchor): đặt tại (col,row), rộng/cao theo EMU (1px≈9525 EMU)
        const cx=Math.round((im.w||220)*9525), cy=Math.round((im.h||150)*9525);
        anchors.push(`<xdr:oneCellAnchor><xdr:from><xdr:col>${im.col||0}</xdr:col><xdr:colOff>${Math.round((im.colOff||0)*9525)}</xdr:colOff><xdr:row>${im.row||0}</xdr:row><xdr:rowOff>${Math.round((im.rowOff||0)*9525)}</xdr:rowOff></xdr:from><xdr:ext cx="${cx}" cy="${cy}"/><xdr:pic><xdr:nvPicPr><xdr:cNvPr id="${k+1}" name="Picture ${k+1}"/><xdr:cNvPicPr/></xdr:nvPicPr><xdr:blipFill><a:blip xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" r:embed="${rId}"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill><xdr:spPr><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></xdr:spPr></xdr:pic><xdr:clientData/></xdr:oneCellAnchor>`);
      });
      const drawingDoc=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><xdr:wsDr xmlns:xdr="http://schemas.openxmlformats.org/drawingml/2006/spreadsheetDrawing" xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main">${anchors.join('')}</xdr:wsDr>`;
      drawingFiles.push({name:`xl/drawings/${drawName}.xml`, data:strBytes(drawingDoc)});
      drawingRelFiles.push({name:`xl/drawings/_rels/${drawName}.xml.rels`, data:strBytes(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${drels.join('')}</Relationships>`)});
      extraContentTypes.push(`<Override PartName="/xl/drawings/${drawName}.xml" ContentType="application/vnd.openxmlformats-officedocument.drawing+xml"/>`);
      // rels của worksheet -> drawing
      const wsDrawRid='rIdDraw';
      drawingXml=`<drawing r:id="${wsDrawRid}"/>`;
      wsFiles.push({name:`xl/worksheets/_rels/sheet${si+1}.xml.rels`, data:strBytes(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="${wsDrawRid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/drawing" Target="../drawings/${drawName}.xml"/></Relationships>`)});
    }
    const ws=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0" showGridLines="0"/></sheetViews>${colsXml}<sheetData>${rowsXml}</sheetData>${mergeXml}${drawingXml}</worksheet>`;
    wsFiles.push({name:`xl/worksheets/sheet${si+1}.xml`, data:strBytes(ws)});
    wbSheets.push(`<sheet name="${xlsxEsc(sh.name).slice(0,31)}" sheetId="${si+1}" r:id="rId${si+1}"/>`);
    rels.push(`<Relationship Id="rId${si+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${si+1}.xml"/>`);
  });
  const styleRid=sheets.length+1;
  const workbook=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${wbSheets.join('')}</sheets></workbook>`;
  const wbRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${rels.join('')}<Relationship Id="rId${styleRid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const contentTypes=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>${extraContentTypes.filter(x=>x.startsWith('<Default')).join('')}<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}${extraContentTypes.filter(x=>x.startsWith('<Override')).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`;
  const rootRels=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  const files=[
    {name:'[Content_Types].xml', data:strBytes(contentTypes)},
    {name:'_rels/.rels', data:strBytes(rootRels)},
    {name:'xl/workbook.xml', data:strBytes(workbook)},
    {name:'xl/_rels/workbook.xml.rels', data:strBytes(wbRels)},
    {name:'xl/styles.xml', data:strBytes(styles)},
    ...wsFiles,
    ...drawingFiles,
    ...drawingRelFiles,
    ...mediaFiles
  ];
  return zipStore(files);
}


/* ==================== XLS (.xls BIFF8) READER + TRÍCH XUẤT DỰ TOÁN ==================== */
/* ================= XLS (BIFF8 / OLE2) reader — pure JS, no libs ================= */
/* Đọc file .xls cũ: trả về { sheetName: [ [cellA,cellB,...], ... ] } */

function readXls(bytes){
  const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
  // ---- OLE2 compound document ----
  if(dv.getUint32(0,true)!==0xE011CFD0) throw new Error('Không phải file .xls (OLE2)');
  const sectorShift = dv.getUint16(30,true);      // thường 9 -> 512
  const miniSectorShift = dv.getUint16(32,true);  // thường 6 -> 64
  const secSize = 1<<sectorShift;
  const miniSize = 1<<miniSectorShift;
  const numFATsec = dv.getUint32(44,true);
  const dirStart = dv.getUint32(48,true);
  const miniCutoff = dv.getUint32(56,true);
  const miniFATstart = dv.getUint32(60,true);
  const numMiniFAT = dv.getUint32(64,true);
  const difStart = dv.getUint32(68,true);
  const numDIF = dv.getUint32(72,true);

  const sectorOff = s => 512 + s*secSize;

  // ---- build FAT sector list (DIFAT) ----
  let fatSectors=[];
  for(let i=0;i<109;i++){ const s=dv.getUint32(76+i*4,true); if(s===0xFFFFFFFF) break; fatSectors.push(s); }
  // extended DIFAT chain
  let dif=difStart, cnt=numDIF;
  while(dif!==0xFFFFFFFE && dif!==0xFFFFFFFF && cnt>0){
    const base=sectorOff(dif);
    const perSec=secSize/4;
    for(let i=0;i<perSec-1;i++){ const s=dv.getUint32(base+i*4,true); if(s!==0xFFFFFFFF) fatSectors.push(s); }
    dif=dv.getUint32(base+(perSec-1)*4,true); cnt--;
  }
  // ---- read FAT ----
  const FAT=[];
  fatSectors.forEach(fs=>{
    const base=sectorOff(fs);
    for(let i=0;i<secSize/4;i++) FAT.push(dv.getUint32(base+i*4,true));
  });
  // follow a FAT chain -> concatenated bytes
  function readChain(start){
    const out=[]; let s=start; let guard=0;
    while(s!==0xFFFFFFFE && s!==0xFFFFFFFF && guard++ < FAT.length+10){
      const base=sectorOff(s);
      for(let i=0;i<secSize;i++) out.push(bytes[base+i]);
      s=FAT[s];
    }
    return new Uint8Array(out);
  }
  // ---- directory ----
  const dirBytes=readChain(dirStart);
  const ddv=new DataView(dirBytes.buffer);
  const entries=[];
  for(let off=0; off+128<=dirBytes.length; off+=128){
    const nameLen=ddv.getUint16(off+64,true);
    if(nameLen<=0) continue;
    let name='';
    for(let i=0;i<nameLen-2;i+=2){ const ch=ddv.getUint16(off+i,true); if(ch) name+=String.fromCharCode(ch); }
    const type=dirBytes[off+66]; // 2=stream,5=root
    const startSec=ddv.getUint32(off+116,true);
    const size=ddv.getUint32(off+120,true);
    entries.push({name,type,startSec,size});
  }
  const root=entries.find(e=>e.type===5);
  // mini stream container = root's chain
  const miniContainer = root? readChain(root.startSec): new Uint8Array(0);
  function readMiniChain(start,size){
    const out=[]; let s=start; let guard=0;
    // mini FAT
    while(s!==0xFFFFFFFE && s!==0xFFFFFFFF && guard++<100000){
      const base=s*miniSize;
      for(let i=0;i<miniSize;i++) out.push(miniContainer[base+i]);
      s=miniFAT[s];
    }
    return new Uint8Array(out).slice(0,size);
  }
  // mini FAT
  const miniFATbytes=readChain(miniFATstart);
  const mdv=new DataView(miniFATbytes.buffer);
  const miniFAT=[];
  for(let i=0;i<miniFATbytes.length/4;i++) miniFAT.push(mdv.getUint32(i*4,true));

  function readStream(e){
    if(e.size<miniCutoff && e.type!==5) return readMiniChain(e.startSec,e.size);
    return readChain(e.startSec).slice(0,e.size);
  }
  // ---- Workbook stream ----
  const wbEntry=entries.find(e=>/^(Workbook|Book)$/i.test(e.name));
  if(!wbEntry) throw new Error('Không tìm thấy Workbook trong .xls');
  const wb=readStream(wbEntry);
  return parseBIFF(wb);
}

function parseBIFF(buf){
  const dv=new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  let pos=0;
  const recs=[];
  while(pos+4<=buf.length){
    const type=dv.getUint16(pos,true);
    const len=dv.getUint16(pos+2,true);
    recs.push({type,pos:pos+4,len});
    pos+=4+len;
  }
  // ---- SST (shared strings) with CONTINUE handling ----
  const sst=[];
  // gather boundsheets (sheet name + BOF offset)
  const sheets=[]; // {name, offset}
  recs.forEach(r=>{
    if(r.type===0x0085){ // BOUNDSHEET8
      const bofPos=dv.getUint32(r.pos,true);
      const cch=buf[r.pos+6];
      const grbit=buf[r.pos+7];
      let name='';
      if(grbit&1){ for(let i=0;i<cch;i++) name+=String.fromCharCode(dv.getUint16(r.pos+8+i*2,true)); }
      else { for(let i=0;i<cch;i++) name+=String.fromCharCode(buf[r.pos+8+i]); }
      sheets.push({name, offset:bofPos});
    }
  });

  // Parse SST: need continuous byte stream across SST+CONTINUE
  const sstRec=recs.find(r=>r.type===0x00FC);
  if(sstRec){
    // Build merged buffer of SST payload + following CONTINUE payloads
    const idx=recs.indexOf(sstRec);
    let chunks=[[sstRec.pos,sstRec.len]];
    for(let i=idx+1;i<recs.length;i++){
      if(recs[i].type===0x003C) chunks.push([recs[i].pos,recs[i].len]); // CONTINUE
      else break;
    }
    // reader over chunk list with ability to know chunk boundaries
    const reader=makeChunkReader(buf,chunks);
    const total=reader.u32();
    const cnt=reader.u32();
    for(let i=0;i<cnt;i++){
      sst.push(readUnicodeString(reader));
    }
  }

  // ---- parse each sheet ----
  const result={};
  sheets.forEach(sh=>{
    result[sh.name]=xlsParseSheet(buf,dv,recs,sh.offset,sst);
  });
  return result;
}

// Reader spanning multiple (pos,len) chunks in the same underlying buffer
function makeChunkReader(buf,chunks){
  let ci=0, off=chunks[0][0], end=chunks[0][0]+chunks[0][1];
  function ensure(){ while(off>=end && ci<chunks.length-1){ ci++; off=chunks[ci][0]; end=chunks[ci][0]+chunks[ci][1]; } }
  function byte(){ ensure(); return buf[off++]; }
  function u16(){ const a=byte(),b=byte(); return a|(b<<8); }
  function u32(){ const a=u16(),b=u16(); return a+b*65536; }
  // when a unicode string spans a CONTINUE, the grbit (compression flag) restarts.
  function atChunkStart(){ return off===chunks[ci][0]; }
  function crossBoundaryPeekFlag(){ // returns the new grbit byte at start of next chunk
    return buf[chunks[ci+1] ? chunks[ci+1][0] : off];
  }
  return {byte,u16,u32,
    remainingInChunk:()=> end-off,
    nextChunkFlag(){ ensure(); },
    _raw:{get ci(){return ci;}, get off(){return off;}, chunks}
  };
}

// BIFF8 unicode string in SST (with rich/phonetic + CONTINUE spanning)
function readUnicodeString(reader){
  const cch=reader.u16();
  const flags=reader.byte();
  let compressed=!(flags&0x01);
  const rich=flags&0x08, ext=flags&0x04;
  let cRun=0, cbExt=0;
  if(rich) cRun=reader.u16();
  if(ext) cbExt=reader.u32();
  let str='';
  let i=0;
  while(i<cch){
    // handle CONTINUE boundary: when current chunk exhausted mid-string,
    // the next chunk begins with a fresh compression flag byte.
    if(reader.remainingInChunk()<=0){
      reader.nextChunkFlag();
      const f=reader.byte();
      compressed=!(f&0x01);
    }
    if(compressed){ str+=String.fromCharCode(reader.byte()); }
    else { str+=String.fromCharCode(reader.u16()); }
    i++;
  }
  // skip rich-run formatting (4 bytes each) and ext phonetic
  for(let r=0;r<cRun;r++){ reader.u16(); reader.u16(); }
  for(let e=0;e<cbExt;e++){ reader.byte(); }
  return str;
}

function rkToNum(rk){
  let val;
  const cents = rk & 1;
  const isInt = rk & 2;
  if(isInt){ val = rk>>2; }
  else {
    // top 30 bits are high bits of a float64
    const buf=new ArrayBuffer(8); const dv=new DataView(buf);
    dv.setUint32(4, (rk & 0xFFFFFFFC), true); // low? actually high dword
    // rk holds high 30 bits of the 64-bit double (low 34 bits zero)
    dv.setUint32(0, 0, true);
    dv.setUint32(4, (rk & 0xFFFFFFFC)>>>0, true);
    val=dv.getFloat64(0,true);
  }
  if(cents) val=val/100;
  return val;
}

function xlsParseSheet(buf,dv,recs,bofOffset,sst){
  // find record index whose (pos-4)===bofOffset  (BOF)
  let startIdx=recs.findIndex(r=>r.pos-4===bofOffset && r.type===0x0809);
  if(startIdx<0){ // fallback: nearest BOF at/after offset
    startIdx=recs.findIndex(r=>r.type===0x0809 && (r.pos-4)>=bofOffset);
  }
  const grid={};
  let maxR=0,maxC=0;
  for(let i=startIdx+1;i<recs.length;i++){
    const r=recs[i];
    if(r.type===0x0809) break; // next sheet's BOF (shouldn't hit before EOF)
    if(r.type===0x000A) break; // EOF
    const set=(row,col,val)=>{ grid[row+'_'+col]=val; if(row>maxR)maxR=row; if(col>maxC)maxC=col; };
    switch(r.type){
      case 0x0204:{ // LABEL (old)
        const row=dv.getUint16(r.pos,true), col=dv.getUint16(r.pos+2,true);
        const cch=dv.getUint16(r.pos+6,true); let s='';
        for(let k=0;k<cch;k++) s+=String.fromCharCode(buf[r.pos+8+k]);
        set(row,col,s); break; }
      case 0x00FD:{ // LABELSST
        const row=dv.getUint16(r.pos,true), col=dv.getUint16(r.pos+2,true);
        const isst=dv.getUint32(r.pos+6,true);
        set(row,col, sst[isst]!==undefined? sst[isst]:''); break; }
      case 0x0203:{ // NUMBER
        const row=dv.getUint16(r.pos,true), col=dv.getUint16(r.pos+2,true);
        const num=dv.getFloat64(r.pos+6,true);
        set(row,col,num); break; }
      case 0x027E:{ // RK
        const row=dv.getUint16(r.pos,true), col=dv.getUint16(r.pos+2,true);
        const rk=dv.getUint32(r.pos+6,true);
        set(row,col, rkToNum(rk)); break; }
      case 0x00BD:{ // MULRK
        const row=dv.getUint16(r.pos,true); const colFirst=dv.getUint16(r.pos+2,true);
        const n=(r.len-6)/6;
        for(let k=0;k<n;k++){ const rk=dv.getUint32(r.pos+4+k*6+2,true); set(row,colFirst+k, rkToNum(rk)); }
        break; }
      case 0x0006:{ // FORMULA -> cached result
        const row=dv.getUint16(r.pos,true), col=dv.getUint16(r.pos+2,true);
        // result: 8 bytes at pos+6; if first 6 bytes == special & byte7,8==0xFFFF -> string/bool/err
        const b6=buf[r.pos+6], b12=buf[r.pos+12], b13=buf[r.pos+13];
        if(b13===0xFF && b12===0xFF){
          if(b6===0){ // string in following STRING record
            const nxt=recs[i+1];
            if(nxt && nxt.type===0x0207){
              const cch=dv.getUint16(nxt.pos,true); const flag=buf[nxt.pos+2];
              let s=''; if(flag&1){ for(let k=0;k<cch;k++) s+=String.fromCharCode(dv.getUint16(nxt.pos+3+k*2,true)); }
              else { for(let k=0;k<cch;k++) s+=String.fromCharCode(buf[nxt.pos+3+k]); }
              set(row,col,s);
            } else set(row,col,'');
          } else if(b6===1){ set(row,col, buf[r.pos+8]?true:false); }
          else set(row,col,'');
        } else {
          const num=dv.getFloat64(r.pos+6,true);
          set(row,col, num);
        }
        break; }
    }
  }
  // to 2D array
  const out=[];
  for(let r=0;r<=maxR;r++){ const row=[]; for(let c=0;c<=maxC;c++){ const v=grid[r+'_'+c]; row.push(v===undefined?'':v); } out.push(row); }
  return out;
}


/* ==================== TRÍCH XUẤT NGÂN SÁCH TỪ DỰ TOÁN ==================== */
// LẤY SỐ NGUYÊN — bỏ phần thập phân (yêu cầu: chỉ lấy số trước dấu thập phân)
function xnum(v){
  if(typeof v==='number') return isNaN(v)?null:Math.trunc(v);
  let s=String(v==null?'':v).trim();
  if(!s) return null;
  const neg=/^\s*-/.test(s) || /\(\s*[\d.,]/.test(s); // dấu âm hoặc (…)
  s=s.replace(/[^\d.,]/g,'');
  if(!s) return null;
  const dots=(s.match(/\./g)||[]).length;
  const commas=(s.match(/,/g)||[]).length;
  let decSep='';
  if(dots && commas){
    // dấu xuất hiện SAU cùng là thập phân
    decSep = s.lastIndexOf(',')>s.lastIndexOf('.') ? ',' : '.';
  } else if(dots===1 || commas===1){
    // một dấu duy nhất: nếu đúng 3 chữ số phía sau -> ngăn cách nghìn; ngược lại -> thập phân
    const sep = dots? '.' : ',';
    const after = s.length - s.lastIndexOf(sep) - 1;
    if(after!==3) decSep=sep;   // vd 12,5 hay 12.5 -> thập phân
  } // nhiều hơn 1 dấu cùng loại (vd 2.793.791.470) -> tất cả là ngăn cách nghìn
  let intPart = decSep ? s.slice(0, s.lastIndexOf(decSep)) : s;
  const digits=intPart.replace(/[^\d]/g,'');
  if(!digits) return null;
  const n=Number(digits);
  if(isNaN(n)) return null;
  return neg?-n:n;
}
function xnorm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/\s+/g,' ').trim(); }
function xFindSheet(wb, keywords){
  for(const name in wb){ const n=xnorm(name); if(keywords.some(k=>n.includes(k))) return {name, rows:wb[name]}; }
  return null;
}
function xFindTotalRow(rows, keywords){
  if(!rows) return null;
  for(const row of rows){
    const joined=xnorm(row.join(' '));
    if(keywords.some(k=>joined.includes(k))){
      const nums=row.map(xnum).filter(x=>x!=null && x>1000);
      if(nums.length) return Math.max(...nums);
    }
  }
  return null;
}
// Tìm cột "Tên" (tên vật tư / công việc / máy) bằng cách xét cột chữ dài nhất trong nhiều dòng.
// Dự toán VN thường: STT | Mã hiệu | TÊN | ĐVT | Khối lượng | Đơn giá | Thành tiền
function xFindNameCol(rows){
  const score={}; // col -> điểm (số dòng là chuỗi chữ có ý nghĩa)
  const cap=Math.min(rows.length, 500);
  for(let r=0;r<cap;r++){
    const row=rows[r]||[];
    for(let c=0;c<row.length;c++){
      const v=row[c];
      if(typeof v==='number') continue;
      const s=String(v||'').trim();
      if(!s) continue;
      // Bỏ ô là SỐ THUẦN (chỉ chữ số + dấu ngăn cách) — không phải tên
      if(/^[\d.,\-\s]+$/.test(s)) continue;
      // Đếm số chữ cái (kể cả tiếng Việt). Tên hạng mục thường nhiều chữ.
      const letters=(s.match(/[a-zA-ZÀ-ỹ]/g)||[]).length;
      if(letters>=3){ score[c]=(score[c]||0)+(letters>=6?2:1); }
    }
  }
  let best=-1, bestC=2;
  Object.entries(score).forEach(([c,sc])=>{ if(sc>best){ best=sc; bestC=+c; } });
  return bestC;
}
// Đơn vị tính phổ biến để nhận diện dòng đầu mục (có ĐVT + số)
const XLS_UNITS=/^(m3|m2|m|kg|tan|tấn|cai|cái|bo|bộ|md|ca|cong|công|nguoi|người|chiec|chiếc|vien|viên|bao|thung|thùng|lit|lít|cuon|cuộn|tam|tấm|cay|cây|hop|hộp|luot|lượt|nhom|nhóm|100m|1000|10m)/i;
function xExtractItems(sheet){
  if(!sheet) return [];
  const rows=sheet.rows;
  const nameCol=xFindNameCol(rows);
  const items=[]; const seen={};
  for(const row of rows){
    const name=String(row[nameCol]==null?'':row[nameCol]).trim();
    if(!name) continue;
    // bỏ dòng tiêu đề / tổng cộng / cộng
    const nn=xnorm(name);
    if(!/[a-z]/.test(nn)) continue;                 // phải có chữ
    // tiêu đề cột (khớp chính xác, tránh nhầm "công nhân" với "cộng")
    if(/^(stt|ma hieu|ma|ten( vat tu| cong viec| may| hang muc)?|noi dung|dien giai|don vi tinh|don vi|dvt|khoi luong|don gia|thanh tien|ghi chu)\s*$/.test(nn)) continue;
    // dòng tổng: "cộng", "tổng", "tổng cộng", "cộng nhóm"... (không có chữ khác theo sau đáng kể)
    if(/^(cong|tong|tong cong|cong nhom|cong hang muc)\s*$/.test(nn)) continue;
    if(nn.length<3) continue;
    // số tiền = số lớn nhất trên dòng (thành tiền), lấy phần nguyên
    const nums=row.map(xnum).filter(x=>x!=null && x>1000);
    if(!nums.length) continue;
    const amt=Math.max(...nums);
    if(amt<=0) continue;
    // gộp trùng tên (cộng dồn hạn mức nếu lặp)
    if(seen[name]!=null){ items[seen[name]].limit+=amt; }
    else { seen[name]=items.length; items.push({name, limit:amt}); }
  }
  return items;
}
// Tách Hạng mục + Địa điểm từ tiêu đề dự toán (dòng đầu các sheet)
function xExtractTitle(wb){
  // gom vài dòng đầu của mọi sheet, tìm dòng "công trình / hạng mục / địa điểm"
  let congTrinh='', hangMuc='', diaDiem='';
  const rowsAll=[];
  for(const name in wb){ (wb[name]||[]).slice(0,25).forEach(r=>rowsAll.push(r)); }
  for(const row of rowsAll){
    const joined=String(row.join(' ')).replace(/\s+/g,' ').trim();
    const nj=xnorm(joined);
    const grab=(label)=>{
      // "Hạng mục: XXX"  hoặc  "Hạng mục XXX"
      const re=new RegExp(label+'\\s*[:\\-]?\\s*(.+)','i');
      const m=joined.match(new RegExp(label.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\s*[:\\-]?\\s*(.+)','i'));
      return m? m[1].split(/\s{2,}|\t/)[0].trim() : '';
    };
    if(!hangMuc && /hang muc/.test(nj)){ hangMuc=pickAfter(joined,/hạng\s*mục/i); }
    if(!diaDiem && /(dia diem|dia chi)/.test(nj)){ diaDiem=pickAfter(joined,/(địa\s*điểm|địa\s*chỉ)/i); }
    if(!congTrinh && /cong trinh/.test(nj)){ congTrinh=pickAfter(joined,/công\s*trình/i); }
  }
  return {congTrinh, hangMuc, diaDiem};
}
function pickAfter(text, re){
  const m=text.match(re); if(!m) return '';
  let rest=text.slice(m.index+m[0].length);
  rest=rest.replace(/^\s*[:\-–]\s*/,'');
  // cắt tại nhãn kế tiếp nếu có
  rest=rest.split(/\s{2,}|\t|(?:công trình|hạng mục|địa điểm|địa chỉ|chủ đầu tư|đơn vị)/i)[0];
  return rest.trim();
}

// Tìm tất cả sheet khớp từ khoá (trả mảng)
function xFindSheets(wb, keywords){
  const out=[];
  for(const name in wb){ const n=xnorm(name); if(keywords.some(k=>n.includes(k))) out.push({name, rows:wb[name]}); }
  return out;
}
// Tìm cột chứa "mã chi phí" (VL, NC, MTC, C, T...) trong bảng THKP
function xFindCodeCol(rows){
  const codes=['vl','nc','mtc','c','t'];
  const score={};
  rows.slice(0,60).forEach(row=>{
    row.forEach((v,c)=>{
      const s=xnorm(String(v||'')).replace(/[^a-z0-9]/g,'');
      if(codes.includes(s)) score[c]=(score[c]||0)+1;
    });
  });
  let best=-1,bestC=-1;
  Object.entries(score).forEach(([c,sc])=>{ if(sc>best){best=sc;bestC=+c;} });
  return best>=2?bestC:-1;
}
// Lấy giá trị (số lớn nhất trên dòng) của dòng có mã = code, trong cột codeCol
function xValueByCode(rows, codeCol, code){
  const want=xnorm(code).replace(/[^a-z0-9]/g,'');
  for(const row of rows){
    const cell=xnorm(String(row[codeCol]||'')).replace(/[^a-z0-9]/g,'');
    if(cell===want){
      const nums=row.map(xnum).filter(x=>x!=null && x>1000);
      if(nums.length) return Math.max(...nums);
    }
  }
  return null;
}
// Tìm dòng có nhãn chứa từ khoá (bất kỳ cột), trả số lớn nhất
function xValueByLabel(rows, keywords, minVal){
  minVal=minVal||1000;
  for(const row of rows){
    const joined=xnorm(row.join(' '));
    if(keywords.some(k=>joined.includes(k))){
      const nums=row.map(xnum).filter(x=>x!=null && x>minVal);
      if(nums.length) return Math.max(...nums);
    }
  }
  return null;
}
// ===== NGUỒN CHUẨN: "BẢNG GIÁ TRỊ VẬT TƯ" (Gia tri vat tu) =====
// Sheet này liệt kê ĐÚNG từng đầu mục thật, chia 3 khối liên tiếp:
//   VL (Vật liệu) → NC (Nhân công) → MTC (Máy thi công)
// Mỗi khối: mở đầu bằng ô mã (VL/NC/MTC) ở cột "MÃ HIỆU", kết thúc bằng TCVL/TCNC/TCMTC.
// Cột: MÃ HIỆU | TÊN | ĐVT | KHỐI LƯỢNG | ĐƠN GIÁ | THÀNH TIỀN(lấy) | ...
// Đây là nguồn tránh được lỗi "trùng lặp" (mỗi loại lấy đúng danh sách riêng, không dùng chung cột tên).
function xExtractItemsFromGiaTri(sheet){
  if(!sheet) return null;
  const rows=sheet.rows;
  // tìm cột MÃ HIỆU và cột TÊN từ dòng tiêu đề
  let codeCol=-1, nameCol=-1, hdrRow=-1;
  for(let r=0;r<Math.min(rows.length,12);r++){
    const s=(rows[r]||[]).map(v=>xnorm(String(v||'')));
    for(let c=0;c<s.length;c++){
      if(codeCol<0 && (s[c]==='ma hieu'||s[c]==='ma')) codeCol=c;
      if(nameCol<0 && /^ten( vat tu| vt)?/.test(s[c])) nameCol=c;
    }
    if(codeCol>=0){ hdrRow=r; break; }
  }
  if(codeCol<0) return null;
  if(nameCol<0) nameCol=codeCol+1;
  // cột THÀNH TIỀN: ô "thanh tien" đầu tiên ở dòng tiêu đề (sau cột tên).
  // Nhiều file dự toán tách tiêu đề làm 2 dòng: dòng trên "THÀNH", dòng dưới "TIỀN"
  // (khối lượng = "KHỐI"+"LƯỢNG", đơn giá = "ĐƠN"+"GIÁ"...). Vì vậy phải GHÉP
  // nội dung ô của dòng tiêu đề với dòng ngay dưới nó rồi mới so khớp "thanh tien".
  let amtCol=-1;
  const hdrTop=(rows[hdrRow]||[]).map(v=>xnorm(String(v||'')));
  const hdrBot=(rows[hdrRow+1]||[]).map(v=>xnorm(String(v||'')));
  const hdrJoin=[];
  const wide=Math.max(hdrTop.length,hdrBot.length);
  for(let c=0;c<wide;c++){ hdrJoin[c]=((hdrTop[c]||'')+' '+(hdrBot[c]||'')).replace(/\s+/g,' ').trim(); }
  for(let c=nameCol+1;c<hdrJoin.length;c++){ if(hdrJoin[c]==='thanh tien'){ amtCol=c; break; } }
  // nếu ghép 2 dòng khiến hdrRow trỏ vào dòng "THÀNH", các dòng dữ liệu bắt đầu
  // sau dòng "TIỀN" — dịch điểm bắt đầu quét xuống 1 nếu dòng dưới cũng là tiêu đề.
  let dataStart=hdrRow+1;
  if(hdrBot.some(x=>x==='tien'||x==='luong'||x==='gia')) dataStart=hdrRow+2;
  const blocks={vt:[],nc:[],tb:[]};
  const seen={vt:{},nc:{},tb:{}};
  let cur=null; // 'vt'|'nc'|'tb'
  const codeKey=v=>xnorm(String(v||'')).replace(/[^a-z0-9]/g,'');
  for(let r=dataStart;r<rows.length;r++){
    const row=rows[r]||[]; const code=codeKey(row[codeCol]);
    // dấu mở khối
    if(code==='vl'){ cur='vt'; continue; }
    if(code==='nc'){ cur='nc'; continue; }
    if(code==='mtc'||code==='m'){ cur='tb'; continue; }
    // dấu đóng khối (tổng cộng)
    if(code==='tcvl'||code==='tcnc'||code==='tcmtc'||code==='tc'){ cur=null; continue; }
    if(!cur) continue;
    const name=String(row[nameCol]==null?'':row[nameCol]).trim();
    if(!name) continue;
    const nn=xnorm(name);
    if(!/[a-z]/.test(nn)) continue;
    if(/^(cong|tong|tong cong|cong nhom)\s*$/.test(nn)) continue;
    // số tiền = cột THÀNH TIỀN. Nếu file có cột này, tôn trọng đúng giá trị của nó
    // (kể cả bằng 0 → bỏ qua), KHÔNG nhặt số lạ trên dòng để tránh lấy nhầm định mức/khối lượng.
    let amt=null;
    if(amtCol>=0){ amt=xnum(row[amtCol]); }
    else { const nums=row.map(xnum).filter(x=>x!=null && x>1000); if(nums.length) amt=Math.max(...nums); }
    if(amt==null || amt<=0) continue;
    const arr=blocks[cur], sn=seen[cur];
    if(sn[name]!=null) arr[sn[name]].limit+=amt;
    else { sn[name]=arr.length; arr.push({name, limit:amt}); }
  }
  if(!blocks.vt.length && !blocks.nc.length && !blocks.tb.length) return null;
  return blocks;
}
// Trích hạn mức con từ bảng dự thầu chi tiết: mỗi công việc -> tách VL/NC/MTC (cột THÀNH TIỀN)
function xExtractItemsFromDetail(sheet){
  if(!sheet) return null;
  const rows=sheet.rows;
  // Dự toán VN thường có 2 dòng tiêu đề: dòng trên có ô gộp "THÀNH TIỀN",
  // dòng dưới có "VẬT LIỆU / NHÂN CÔNG / MÁY" nằm ngay dưới cụm THÀNH TIỀN đó.
  let colVL=-1,colNC=-1,colMTC=-1,hdrRow=-1,nameCol=-1;
  for(let r=0;r<Math.min(rows.length,15);r++){
    const top=(rows[r]||[]).map(v=>xnorm(String(v||'')));
    const bot=(rows[r+1]||[]).map(v=>xnorm(String(v||'')));
    if(!bot.length) continue;
    // vị trí các ô "thanh tien" ở dòng trên (có thể có nhiều)
    const ttCols=[]; top.forEach((s,i)=>{ if(s==='thanh tien') ttCols.push(i); });
    // với mỗi cụm THÀNH TIỀN, kiểm tra 3 ô dưới có phải VẬT LIỆU/NHÂN CÔNG/MÁY
    for(const tc of ttCols){
      // dò trong khoảng [tc, tc+4] cho VẬT LIỆU/NHÂN CÔNG/MÁY liên tiếp
      for(let base=tc; base<=tc+2; base++){
        const a=bot[base], bb=bot[base+1], c=bot[base+2];
        const isVL=s=>s==='vat lieu'||s==='vl';
        const isNC=s=>s==='nhan cong'||s==='nc';
        const isMay=s=>s==='may'||s==='may tc'||s==='mtc'||s==='may thi cong';
        if(isVL(a)&&isNC(bb)&&isMay(c)){ colVL=base;colNC=base+1;colMTC=base+2;hdrRow=r+1;break; }
      }
      if(colNC>=0) break;
    }
    if(colNC>=0) break;
  }
  if(colNC<0){
    // fallback: dòng đơn có VẬT LIỆU/NHÂN CÔNG/MÁY liền nhau (bố cục 1 dòng tiêu đề)
    for(let r=0;r<Math.min(rows.length,15);r++){
      const s=(rows[r]||[]).map(v=>xnorm(String(v||'')));
      for(let i=0;i<s.length-2;i++){
        if((s[i]==='vat lieu'||s[i]==='vl')&&(s[i+1]==='nhan cong'||s[i+1]==='nc')&&(s[i+2]==='may'||s[i+2]==='may tc'||s[i+2]==='mtc')){
          colVL=i;colNC=i+1;colMTC=i+2;hdrRow=r;break;
        }
      }
      if(colNC>=0) break;
    }
  }
  if(colNC<0) return null;
  nameCol=xFindNameCol(rows);
  const vt=[],nc=[],tb=[];
  const seen={vt:{},nc:{},tb:{}};
  for(let r=hdrRow+1;r<rows.length;r++){
    const row=rows[r]||[];
    const name=String(row[nameCol]==null?'':row[nameCol]).trim();
    if(!name) continue;
    const nn=xnorm(name);
    if(!/[a-z]/.test(nn)) continue;
    if(/^(cong|tong|tong cong|cong nhom)\s*$/.test(nn)) continue;
    if(/(tong cong|noi dung cong viec)/.test(nn) && name.length<25) continue;
    const vVL=xnum(row[colVL]), vNC=xnum(row[colNC]), vMTC=xnum(row[colMTC]);
    const add=(arr,seenO,val)=>{ if(val!=null && val>1000){
      if(seenO[name]!=null) arr[seenO[name]].limit+=val;
      else { seenO[name]=arr.length; arr.push({name, limit:val}); } } };
    add(vt,seen.vt,vVL); add(nc,seen.nc,vNC); add(tb,seen.tb,vMTC);
  }
  if(!vt.length && !nc.length && !tb.length) return null;
  return {vt,nc,tb};
}

// Trích danh sách CÔNG TÁC sạch từ sheet Dự thầu (STT | Mã | Tên công tác | ... | Thành tiền)
function xExtractWorkItemsFromDuThau(sheet){
  if(!sheet) return [];
  const rows = sheet.rows || [];
  let nameCol = -1, moneyCol = -1, hdr = -1;
  for(let r=0; r<Math.min(rows.length, 20); r++){
    const cells = (rows[r]||[]).map(v => xnorm(String(v||'')));
    cells.forEach((s,i)=>{
      if(nameCol<0 && (s.includes('ten cong tac') || s==='ten' || s.includes('danh muc cong tac') || s.includes('noi dung cong viec') || s.includes('ten cong viec'))) nameCol=i;
      if(moneyCol<0 && (s==='thanh tien' || s==='gia tri')) moneyCol=i;
    });
    if(nameCol>=0 || moneyCol>=0){ hdr=r; if(nameCol>=0 && moneyCol>=0) break; }
  }
  if(nameCol<0) nameCol = xFindNameCol(rows);
  if(moneyCol<0){
    for(let r=hdr+1; r<Math.min(rows.length, hdr+40); r++){
      const row=rows[r]||[];
      let bestI=-1, bestV=0;
      row.forEach((v,i)=>{ const n=xnum(v); if(n!=null && n>bestV && n>10000){ bestV=n; bestI=i; } });
      if(bestI>=0){ moneyCol=bestI; break; }
    }
  }
  if(nameCol<0 || moneyCol<0) return [];
  const items=[], seen={};
  for(let r=hdr+1; r<rows.length; r++){
    const row = rows[r]||[];
    let name = String(row[nameCol]==null?'':row[nameCol]).trim();
    if(!name) continue;
    const nn = xnorm(name);
    if(/^(stt|ma hieu|tong|tong cong|cong|t\*|tong nhom|sc nang cap|he thong|lam tron|bang chu)/.test(nn)) continue;
    if(nn.length < 4 || !/[a-z]/.test(nn)) continue;
    if(/^[a-z]{1,3}\.?\d+$/i.test(name)) continue;
    const amt = xnum(row[moneyCol]);
    if(amt==null || amt < 1000) continue;
    if(seen[name]!=null){ items[seen[name]].limit += amt; }
    else { seen[name]=items.length; items.push({name, limit: Math.trunc(amt)}); }
  }
  return items;
}


// Trích hạn mức con TỪ SHEET THUẦN (Vật liệu / Nhân công / Máy thi công)
// Chỉ lấy dòng CÓ SỐ STT (dòng chính), bỏ dòng con là tên công tác → hết lẫn lộn.
function xExtractPureCategoryItems(sheet){
  if(!sheet) return [];
  const rows = sheet.rows || [];
  // Tìm header: cột STT, cột Tên, cột Thành tiền
  let sttCol=-1, nameCol=-1, moneyCol=-1, hdr=-1;
  for(let r=0; r<Math.min(rows.length, 15); r++){
    const cells = (rows[r]||[]).map(v => xnorm(String(v||'')));
    cells.forEach((s,i)=>{
      if(sttCol<0 && (s==='stt' || s==='tt')) sttCol=i;
      if(nameCol<0 && (s.includes('ten vat tu') || s.includes('ten may') || s.includes('ten nhan cong') || s==='ten' || s.includes('danh muc'))) nameCol=i;
      if(s==='thanh tien' || s.includes('thanh tien gia thong bao') || s.includes('thanh tien gia goc')) moneyCol=i;
    });
    if(nameCol>=0){ hdr=r; if(sttCol>=0) break; }
  }
  if(nameCol<0) nameCol = xFindNameCol(rows);
  if(sttCol<0) sttCol = 0;
  // Nếu chưa rõ cột tiền: lấy cột có nhiều số lớn nhất ở các dòng data
  if(moneyCol<0){
    const colScore={};
    for(let r=hdr+1; r<Math.min(rows.length, hdr+80); r++){
      (rows[r]||[]).forEach((v,i)=>{
        const n=xnum(v);
        if(n!=null && n>50000) colScore[i]=(colScore[i]||0)+1;
      });
    }
    let best=-1, bestC=-1;
    Object.entries(colScore).forEach(([i,sc])=>{ if(sc>best){ best=sc; bestC=+i; } });
    moneyCol = bestC;
  }
  if(nameCol<0 || moneyCol<0) return [];
  const items=[], seen={};
  for(let r=hdr+1; r<rows.length; r++){
    const row = rows[r]||[];
    // CHỈ lấy dòng có STT là số (dòng chính của vật tư/nhân công/máy)
    const sttRaw = row[sttCol];
    const sttNum = typeof sttRaw==='number' ? sttRaw : parseFloat(String(sttRaw||'').replace(',','.'));
    if(!(sttNum > 0)) continue;   // bỏ dòng con (tên công tác)
    let name = String(row[nameCol]==null?'':row[nameCol]).trim();
    if(!name) continue;
    const nn = xnorm(name);
    if(nn.length < 3 || !/[a-z]/.test(nn)) continue;
    if(/^(stt|ma hieu|tong|cong|tong cong)/.test(nn)) continue;
    const amt = xnum(row[moneyCol]);
    if(amt==null || amt < 1000) continue;
    if(seen[name]!=null) items[seen[name]].limit += Math.trunc(amt);
    else { seen[name]=items.length; items.push({name, limit: Math.trunc(amt)}); }
  }
  return items;
}


function extractBudget(wb){
  const b=blankBudget();

  // 1) Doanh thu: TỔNG CỘNG ở sheet Dự thầu / Dự toán / THKP
  const revSheets=[...xFindSheets(wb,['du thau','dau thau','gia du thau']),
                   ...xFindSheets(wb,['tong hop kinh phi','thkp']),
                   ...xFindSheets(wb,['du toan'])];
  for(const s of revSheets){
    const v=xValueByLabel(s.rows,['tong cong','tong cong sau thue','gxdst','tong muc dau tu']);
    if(v!=null){ b.revenue=v; break; }
  }

  // 2) Hạn mức tổng VL / NC / MTC / Chi phí chung
  //    a) từ bảng THKP theo MÃ CHI PHÍ (VL, NC, MTC, C)
  const thkpSheets=xFindSheets(wb,['thkp','tong hop kinh phi','th_cpxd','th cpxd']);
  for(const s of thkpSheets){
    const codeCol=xFindCodeCol(s.rows);
    if(codeCol>=0){
      const vl=xValueByCode(s.rows,codeCol,'VL');
      const nc=xValueByCode(s.rows,codeCol,'NC');
      const mtc=xValueByCode(s.rows,codeCol,'MTC');
      const cc=xValueByCode(s.rows,codeCol,'C');
      if(vl!=null) b.cats.vt.total=vl;
      if(nc!=null) b.cats.nc.total=nc;
      if(mtc!=null) b.cats.tb.total=mtc;
      if(cc!=null) b.cats.chung.total=cc;
      if(vl!=null||nc!=null||mtc!=null) break;
    }
  }
  //    b) fallback: dò theo nhãn chữ trong mọi sheet tổng hợp
  if(!b.cats.vt.total || !b.cats.nc.total || !b.cats.tb.total){
    const allTH=[...thkpSheets, ...xFindSheets(wb,['thdt','tong hop du toan','tong hop hang muc'])];
    for(const s of allTH){
      if(!b.cats.vt.total){ const v=xValueByLabel(s.rows,['chi phi vat lieu']); if(v!=null) b.cats.vt.total=v; }
      if(!b.cats.nc.total){ const v=xValueByLabel(s.rows,['chi phi nhan cong']); if(v!=null) b.cats.nc.total=v; }
      if(!b.cats.tb.total){ const v=xValueByLabel(s.rows,['chi phi may','chi phi may thi cong']); if(v!=null) b.cats.tb.total=v; }
      if(!b.cats.chung.total){ const v=xValueByLabel(s.rows,['chi phi chung']); if(v!=null) b.cats.chung.total=v; }
    }
  }

  // 3) Hạn mức con từng đầu mục — ƯU TIÊN sheet thuần Vật liệu / Nhân công / Máy
  //    (chỉ lấy dòng có STT → không lẫn tên công tác)
  let gotItems=false;
  const vlS = xFindSheet(wb, ['vat lieu','bang tong hop vat lieu','tong hop vat lieu']);
  const ncS = xFindSheet(wb, ['nhan cong','bang tong hop nhan cong','tong hop nhan cong']);
  const mayS = xFindSheet(wb, ['may thi cong','bang tong hop may','tong hop may thi cong','ca may']);
  const vi = xExtractPureCategoryItems(vlS);
  const ni = xExtractPureCategoryItems(ncS);
  const mi = xExtractPureCategoryItems(mayS);
  if(vi.length || ni.length || mi.length){
    b.cats.vt.items = vi;
    b.cats.nc.items = ni;
    b.cats.tb.items = mi;
    gotItems = true;
  }
  //    b) fallback: "BẢNG GIÁ TRỊ VẬT TƯ" kiểu cũ
  if(!gotItems){
    const giaTriSheets=xFindSheets(wb,['gia tri vat tu','gia tri vt','bang gia tri']);
    for(const s of giaTriSheets){
      const split=xExtractItemsFromGiaTri(s);
      if(split){
        b.cats.vt.items=split.vt; b.cats.nc.items=split.nc; b.cats.tb.items=split.tb;
        gotItems=true; break;
      }
    }
  }
  //    c) fallback cuối: Dự thầu (tên công tác) — chỉ khi không có sheet thuần
  if(!gotItems){
    const duThauSheets = xFindSheets(wb,['du thau','dau thau','gia du thau']);
    for(const s of duThauSheets){
      const items = (typeof xExtractWorkItemsFromDuThau==='function') ? xExtractWorkItemsFromDuThau(s) : [];
      if(items && items.length){
        b.cats.vt.items = items;
        gotItems = true;
        break;
      }
    }
  }

  // 4) Nếu tổng nhóm vẫn trống, lấy tổng từ hạn mức con
  ['vt','nc','tb'].forEach(k=>{ if(!b.cats[k].total && b.cats[k].items.length){
    b.cats[k].total=b.cats[k].items.reduce((s,x)=>s+x.limit,0); } });

  b.title=xExtractTitle(wb);
  b.importedAt=Date.now();
  return b;
}
// Tên dự án gợi ý từ tiêu đề dự toán: "Hạng mục — Địa điểm"
function budgetProjectName(b, fallback){
  const t=b.title||{};
  const parts=[];
  if(t.hangMuc) parts.push(t.hangMuc);
  else if(t.congTrinh) parts.push(t.congTrinh);
  if(t.diaDiem) parts.push(t.diaDiem);
  const nm=parts.join(' — ').trim();
  return nm || fallback || 'Dự án nhập từ dự toán';
}



/* ==================== OFFLINE XLSX PARSER (no libs) ==================== */
// Đọc TẤT CẢ sheet của .xlsx -> { tênSheet: rows[][] } (dùng cho trích xuất dự toán)
async function readXlsxWorkbook(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const files = await unzip(buf);
  const shared = parseShared(files['xl/sharedStrings.xml']);
  // map tên sheet -> file qua workbook.xml + rels
  const wbXml=files['xl/workbook.xml']||'';
  const relsXml=files['xl/_rels/workbook.xml.rels']||'';
  const relMap={}; // rId -> target
  [...relsXml.matchAll(/<Relationship\b[^>]*>/g)].forEach(m=>{
    const tag=m[0];
    const id=(tag.match(/Id="([^"]*)"/)||[])[1];
    const tgt=(tag.match(/Target="([^"]*)"/)||[])[1];
    if(id&&tgt!=null) relMap[id]=tgt;
  });
  const sheetDefs=[...wbXml.matchAll(/<sheet\b[^>]*>/g)].map(m=>{
    const tag=m[0];
    const nm=(tag.match(/name="([^"]*)"/)||[])[1];
    const rid=(tag.match(/r:id="([^"]*)"/)||tag.match(/\br:id="([^"]*)"/)||[])[1];
    return nm!=null ? {name:unesc(nm), rid} : null;
  }).filter(Boolean);
  const wb={};
  if(sheetDefs.length){
    sheetDefs.forEach(sd=>{
      let tgt=relMap[sd.rid]||'';
      // chuẩn hoá: bỏ '/' đầu, bỏ 'xl/' thừa; ghép về gốc 'xl/' nếu là đường dẫn tương đối
      tgt=tgt.replace(/^\//,'');                 // "/xl/worksheets/sheet1.xml" -> "xl/worksheets/sheet1.xml"
      if(!tgt.startsWith('xl/')) tgt='xl/'+tgt.replace(/^\.\.\//,''); // "worksheets/.." -> "xl/worksheets/.."
      let xml=files[tgt];
      if(xml==null){ // thử vài biến thể đường dẫn
        const base=tgt.split('/').pop();
        const alt=Object.keys(files).find(k=>k.endsWith('/'+base)||k===base);
        if(alt) xml=files[alt];
      }
      if(xml!=null) wb[sd.name]=sheetCellsTo2D(parseSheet(xml,shared));
    });
  }
  // fallback: nếu không map được, đọc tất cả sheetN theo thứ tự
  if(!Object.keys(wb).length){
    Object.keys(files).filter(k=>/xl\/worksheets\/sheet\d+\.xml/.test(k)).sort().forEach((k,i)=>{
      wb['Sheet'+(i+1)]=sheetCellsTo2D(parseSheet(files[k],shared));
    });
  }
  return wb;
}
// chuyển mảng {A:..,B:..} -> mảng 2D theo cột
function sheetCellsTo2D(rows){
  const out=[];
  rows.forEach(r=>{
    const cols=Object.keys(r); if(!cols.length){ out.push([]); return; }
    const maxc=Math.max(...cols.map(colNum));
    const line=[]; for(let c=1;c<=maxc;c++){ line.push(r[colLetter(c)]??''); }
    out.push(line);
  });
  return out;
}
function colLetter(n){ let s=''; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; } return s; }

async function readXlsx(file){
  const buf = new Uint8Array(await file.arrayBuffer());
  const files = await unzip(buf);
  const shared = parseShared(files['xl/sharedStrings.xml']);
  // find first sheet
  let sheetXml = files['xl/worksheets/sheet1.xml'];
  if(!sheetXml){ for(const k in files){ if(/xl\/worksheets\/sheet\d+\.xml/.test(k)){ sheetXml=files[k]; break; } } }
  return parseSheet(sheetXml, shared);
}
// --- minimal ZIP reader using DecompressionStream deflate-raw ---
async function unzip(data){
  const dv=new DataView(data.buffer);
  const out={}; const td=new TextDecoder();
  // find End Of Central Directory
  let eocd=-1;
  for(let i=data.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }
  if(eocd<0) throw new Error('Không đọc được ZIP');
  let cnt=dv.getUint16(eocd+10,true), off=dv.getUint32(eocd+16,true);
  for(let n=0;n<cnt;n++){
    if(dv.getUint32(off,true)!==0x02014b50) break;
    const method=dv.getUint16(off+10,true);
    const csize=dv.getUint32(off+20,true);
    const nameLen=dv.getUint16(off+28,true);
    const extraLen=dv.getUint16(off+30,true);
    const commLen=dv.getUint16(off+32,true);
    const lho=dv.getUint32(off+42,true);
    const name=td.decode(data.subarray(off+46,off+46+nameLen));
    // local header
    const lnameLen=dv.getUint16(lho+26,true);
    const lextraLen=dv.getUint16(lho+28,true);
    const dstart=lho+30+lnameLen+lextraLen;
    const comp=data.subarray(dstart,dstart+csize);
    let content;
    if(method===0){ content=comp; }
    else { content = await inflateRaw(comp); }
    out[name]=td.decode(content);
    off += 46+nameLen+extraLen+commLen;
  }
  return out;
}
async function inflateRaw(bytes){
  const ds=new DecompressionStream('deflate-raw');
  const w=ds.writable.getWriter(); w.write(bytes); w.close();
  const chunks=[]; const r=ds.readable.getReader();
  while(true){ const {done,value}=await r.read(); if(done) break; chunks.push(value); }
  let len=chunks.reduce((s,c)=>s+c.length,0); const res=new Uint8Array(len); let p=0;
  chunks.forEach(c=>{res.set(c,p);p+=c.length;}); return res;
}
function parseShared(xml){
  const arr=[]; if(!xml) return arr;
  const re=/<si>([\s\S]*?)<\/si>/g; let m;
  while((m=re.exec(xml))){
    const txt=[...m[1].matchAll(/<t[^>]*>([\s\S]*?)<\/t>/g)].map(x=>unesc(x[1])).join('');
    arr.push(txt);
  }
  return arr;
}
function parseSheet(xml, shared){
  const rows=[];
  const rowRe=/<row[^>]*>([\s\S]*?)<\/row>/g; let rm;
  while((rm=rowRe.exec(xml))){
    const cells={};
    const cellRe=/<c\s([^>]*)>(?:<v>([\s\S]*?)<\/v>|<is><t[^>]*>([\s\S]*?)<\/t><\/is>)?<\/c>/g;
    let cm;
    while((cm=cellRe.exec(rm[1]))){
      const attrs=cm[1];
      const col=(attrs.match(/r="([A-Z]+)\d+"/)||[])[1];
      const type=(attrs.match(/t="([^"]*)"/)||[])[1];
      const v=cm[2], inl=cm[3];
      if(!col) continue;
      let val='';
      if(inl!=null) val=unesc(inl);
      else if(type==='s') val=shared[+v]||'';
      else if(v!=null) val=v;
      cells[col]=val;
    }
    rows.push(cells);
  }
  return rows;
}
function unesc(s){
  return String(s)
    .replace(/&#x([0-9a-fA-F]+);/g,(_,h)=>String.fromCodePoint(parseInt(h,16)))
    .replace(/&#(\d+);/g,(_,d)=>String.fromCodePoint(parseInt(d,10)))
    .replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'")
    .replace(/&amp;/g,'&');
}
function colToArr(rows){
  // convert {A:..,B:..} to header-mapped objects
  if(!rows.length) return [];
  const hdr=rows[0]; const cols=Object.keys(hdr).sort((a,b)=>colNum(a)-colNum(b));
  const names=cols.map(c=>hdr[c]);
  return rows.slice(1).map(r=>{ const o={}; cols.forEach((c,i)=>o[names[i]]=r[c]??''); return o; });
}
function colNum(c){ let n=0; for(const ch of c) n=n*26+(ch.charCodeAt(0)-64); return n; }
