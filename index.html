/* ==================== TOTALS ==================== */
function totals(p){
  const income = Math.trunc(p.income.reduce((s,x)=>s+Number(x.amount||0),0));
  const adv    = Math.trunc(p.income.filter(x=>x.type==='adv').reduce((s,x)=>s+Number(x.amount||0),0));
  const paidIn = income - adv;
  const cost   = Math.trunc(p.costs.reduce((s,x)=>s+Number(x.amount||0),0));
  // chi phí có VAT / không VAT
  const costVat   = Math.trunc(p.costs.filter(x=>x.hasVat!==false).reduce((s,x)=>s+Number(x.amount||0),0));
  const costNoVat = cost - costVat;
  // Giá trị hợp đồng (nhập tay hoặc từ dự toán)
  let contract = null;
  if(p.contractAmount!=null && p.contractAmount!=='') contract = Math.trunc(Number(p.contractAmount)||0);
  else if(p.budget && p.budget.revenue!=null) contract = Math.trunc(Number(p.budget.revenue)||0);
  // Cơ sở tính thuế = GIÁ TRỊ HỢP ĐỒNG (nếu có), không có thì lấy tổng đã thu
  const taxBase = (contract!=null) ? contract : income;
  // Tính thuế theo chế độ
  let taxRaw;
  const mode = p.taxMode || 'rate';
  if(mode==='manual' || (p.taxManual!=null && p.taxManual!=='' && mode!=='cit' && mode!=='rate')){
    taxRaw = Number(p.taxManual)||0;
  } else if(mode==='cit'){
    // Thuế TNDN = (Giá trị hợp đồng − Chi phí có VAT) / VAT × hệ số thuế TNDN
    const div = Number(p.vatDivisor||1.08) || 1;
    const base = (taxBase - costVat) / div;
    taxRaw = base * Number(p.citRate||0);
    if(taxRaw < 0) taxRaw = 0;
  } else if(p.taxManual!=null && p.taxManual!==''){
    taxRaw = Number(p.taxManual);
  } else {
    taxRaw = taxBase*Number(p.taxRate||0);
  }
  const tax    = Math.trunc(taxRaw);
  const profit = Math.trunc(income - cost - tax);
  const byCat={}; COST_CATS.forEach(c=>byCat[c.id]=0);
  p.costs.forEach(x=>{ byCat[x.cat]=(byCat[x.cat]||0)+Number(x.amount||0); });
  Object.keys(byCat).forEach(k=>byCat[k]=Math.trunc(byCat[k]));
  const remain = (contract!=null) ? contract - income : null;   // còn lại = HĐ − (Thanh toán + Tạm ứng)
  return {income,adv,paidIn,cost,costVat,costNoVat,tax,profit,byCat,contract,remain,taxBase};
}

// Nhãn mô tả cách tính thuế

  if(m==='cit') return 'TNDN ÷'+p.vatDivisor+'×'+p.citRate;
  if(m==='manual') return 'thủ công';
  return (p.taxRate*100)+'%×HĐ';
}

// Chuẩn hoá chuỗi để so khớp: bỏ dấu, thường hoá
function normText(s){
  return String(s||'').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d')
    .replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim();
}
// Đoán hạng mục con phù hợp nhất trong 1 nhóm cho 1 ghi chú (fuzzy theo từ chung)
function guessItem(p,cat,note){
  const items=(p.budget?.cats?.[cat]?.items)||[];
  if(!items.length) return '';
  const nq=normText(note); if(!nq) return '';
  const qw=new Set(nq.split(' ').filter(w=>w.length>=2));
  let best='', bestScore=0;
  items.forEach(it=>{
    const iw=normText(it.name).split(' ').filter(w=>w.length>=2);
    let common=0; iw.forEach(w=>{ if(qw.has(w)) common++; });
    // ưu tiên tỉ lệ trùng trên số từ của item
    const score=common/(iw.length||1) + common*0.05;
    if(common>0 && score>bestScore){ bestScore=score; best=it.name; }
  });
  return bestScore>=0.3 ? best : '';
}
// Trạng thái vượt hạn mức: trả {limit,spent,pct,over}

  const l=Number(limit||0), s=Number(spent||0);
  const pct=l>0? s/l*100 : (s>0?999:0);
  return {limit:l, spent:s, pct, over:l>0 && s>l, remain:l-s};
}

// Gộp chi phí theo nhóm chi tiết (Danh mục), trả về mảng đã sắp giảm dần.
// Nếu truyền p -> gộp theo nhóm cha (những nhóm con thuộc 1 nhóm cha sẽ được cộng chung).
function groupTotals(costs,p){
  const smap = p? superOf(p):{};
  const g={};
  costs.forEach(x=>{
    const sub=subName(x);
    const key=smap[sub]||sub;            // nếu nhóm con thuộc nhóm cha -> dùng tên cha
    const isSuper=!!smap[sub];
    g[key]=g[key]||{name:key,amount:0,count:0,cat:x.cat,isSuper};
    g[key].amount+=Number(x.amount||0); g[key].count++;
  });
  const total=Object.values(g).reduce((s,x)=>s+x.amount,0)||1;
  return Object.values(g).sort((a,b)=>b.amount-a.amount)
    .map(x=>({...x,pct:x.amount/total*100}));
}

// các đợt trong 1 nhóm: gom theo nhãn "dot", trả [{dot,amount,count,items}]
function pgRounds(p,id){
  const map={};
  pgCosts(p,id).forEach(x=>{
    const d=(x.dot&&String(x.dot).trim())||'(chưa ghi đợt)';
    (map[d]=map[d]||{dot:d,amount:0,count:0,items:[]});
    map[d].amount+=Number(x.amount||0); map[d].count++; map[d].items.push(x);
  });
  // sắp theo thứ tự đợt (số) nếu có, rồi theo tên
  return Object.values(map).sort((a,b)=>{
    const na=parseInt(String(a.dot).replace(/\D/g,'')), nb=parseInt(String(b.dot).replace(/\D/g,''));
    if(!isNaN(na)&&!isNaN(nb)&&na!==nb) return na-nb;
    return String(a.dot).localeCompare(String(b.dot),'vi');
  });
}

function pgNextDot(p,id){
  const rounds=pgRounds(p,id).map(r=>parseInt(String(r.dot).replace(/\D/g,''))).filter(n=>!isNaN(n));
  const mx=rounds.length?Math.max(...rounds):0; return 'Đợt '+(mx+1);
}

// PERIOD.mode: 'all' | 'month' | 'year' ; offset: 0 = hiện tại, -1 = trước đó...
const PERIOD={mode:'month', offset:0};
function periodRange(){
  if(PERIOD.mode==='all') return null;
  const now=new Date();
  if(PERIOD.mode==='month'){
    const d=new Date(now.getFullYear(), now.getMonth()+PERIOD.offset, 1);
    const start=new Date(d.getFullYear(), d.getMonth(), 1);
    const end=new Date(d.getFullYear(), d.getMonth()+1, 0);
    return {start,end,label:('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()};
  }
  // year
  const y=now.getFullYear()+PERIOD.offset;
  return {start:new Date(y,0,1), end:new Date(y,11,31), label:'Năm '+y};
}
function inPeriod(dateStr){
  const r=periodRange(); if(!r) return true;
  if(!dateStr) return false;
  const d=new Date(dateStr); if(isNaN(d)) return true;
  return d>=r.start && d<=new Date(r.end.getFullYear(),r.end.getMonth(),r.end.getDate(),23,59,59);
}
// Trả về bản sao project chỉ chứa giao dịch trong kỳ đã lọc
function filteredProj(p){
  if(PERIOD.mode==='all') return p;
  return {...p, income:(p.income||[]).filter(x=>inPeriod(x.date)), costs:(p.costs||[]).filter(x=>inPeriod(x.date))};
}
function periodLabel(){
  const r=periodRange();
  if(!r) return 'Tất cả';
  if(PERIOD.mode==='month'){
    if(PERIOD.offset===0) return 'Tháng này';
    if(PERIOD.offset===-1) return 'Tháng trước';
    return r.label;
  }
  if(PERIOD.mode==='year'){ return PERIOD.offset===0?'Năm nay':r.label; }
  return r.label;
}
function periodBar(where){
  const r=periodRange();
  return `<div class="period-bar">
    <button class="pb-arrow" onclick="periodStep('${where}',-1)" ${PERIOD.mode==='all'?'disabled':''}>‹</button>
    <select class="pb-mode" onchange="periodSetMode('${where}',this.value)">
      <option value="month" ${PERIOD.mode==='month'?'selected':''}>Tháng</option>
      <option value="year" ${PERIOD.mode==='year'?'selected':''}>Năm</option>
      <option value="all" ${PERIOD.mode==='all'?'selected':''}>Tất cả</option>
    </select>
    <div class="pb-label">${periodLabel()}</div>
    <button class="pb-arrow" onclick="periodStep('${where}',1)" ${PERIOD.mode==='all'||PERIOD.offset>=0?'disabled':''}>›</button>
  </div>`;
}
function periodStep(where,dir){ if(PERIOD.mode==='all') return; PERIOD.offset+=dir; if(PERIOD.offset>0)PERIOD.offset=0; drillReset(); renderAll(); }
function periodSetMode(where,m){ PERIOD.mode=m; PERIOD.offset=0; drillReset(); renderAll(); }

      <div class="ph-val num">${fmtFull(t.profit)}</div>

      <div class="k cost" style="cursor:pointer" onclick="event.stopPropagation();openTxnList('cost')"><div class="lab">Chi phí ›</div><div class="val num">${fmtFull(t.cost)}</div></div>
      <div class="k tax"><div class="lab">Thuế</div><div class="val num">${fmtFull(t.tax)}</div></div>

/* ---------- CARD BIỂU ĐỒ PHÂN BỔ CHI PHÍ (đồ họa) ---------- */
function costChartCard(p,t){
  if(!t.cost) return '';
  // dữ liệu theo hạng mục
  const data=COST_CATS.map(c=>({name:c.name,cls:c.cls,val:t.byCat[c.id]||0}))
    .filter(d=>d.val>0).sort((a,b)=>b.val-a.val);
  if(!data.length) return '';
  const CHART_COLORS={ 'Vật tư':'#d97706','Nhân công':'#2563eb','Thiết bị/Máy':'#7c3aed',
    'Chi phí chung':'#0891b2','Chi phí khác':'#64748b' };
  const total=data.reduce((s,d)=>s+d.val,0)||1;
  // donut SVG
  const R=52, SW=22, CX=64, CY=64, CIRC=2*Math.PI*R;
  let acc=0;
  const segs=data.map(d=>{
    const frac=d.val/total; const col=CHART_COLORS[d.name]||'#94a3b8';
    const dash=`${(frac*CIRC).toFixed(2)} ${(CIRC-frac*CIRC).toFixed(2)}`;
    const off=(-acc*CIRC).toFixed(2); acc+=frac;
    return `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${col}" stroke-width="${SW}"
      stroke-dasharray="${dash}" stroke-dashoffset="${off}" transform="rotate(-90 ${CX} ${CY})"/>`;
  }).join('');
  const legend=data.map(d=>{
    const col=CHART_COLORS[d.name]||'#94a3b8'; const pct=(d.val/total*100);
    return `<div class="lg-row">
      <span class="lg-dot" style="background:${col}"></span>
      <span class="lg-name">${esc(d.name)}</span>
      <span class="lg-pct num">${pct.toFixed(0)}%</span>
      <span class="lg-val num">${fmtShort(d.val)}</span>
    </div>`;
  }).join('');
  // thanh doanh thu - chi phí - lợi nhuận
  const maxV=Math.max(t.income,t.cost,Math.abs(t.profit),1);
  const bar=(label,val,col)=>`
    <div class="fbar-row">
      <span class="fbar-lb">${label}</span>
      <div class="fbar-track"><i style="width:${Math.max(2,Math.abs(val)/maxV*100).toFixed(1)}%;background:${col}"></i></div>
      <span class="fbar-v num" style="color:${col}">${fmtShort(val)}</span>
    </div>`;
  return `<div class="card coll ${isOpen('tong-chart')?'open':''}">
    <h2 onclick="toggleCard('tong-chart',this)">📈 Biểu đồ phân bổ <span class="chevD">▶</span></h2>
    <div class="cbody"><div class="cinner">
      <div class="donut-wrap">
        <svg viewBox="0 0 128 128" class="donut">
          ${segs}
          <text x="64" y="60" text-anchor="middle" class="donut-c1">Tổng chi</text>
          <text x="64" y="78" text-anchor="middle" class="donut-c2">${fmtShort(total)}</text>
        </svg>
        <div class="donut-legend">${legend}</div>
      </div>
      <div class="fbars">
        ${bar('Đã thanh toán',t.income,'#059669')}
        ${bar('Chi phí',t.cost,'#dc2626')}
        ${bar('Lợi nhuận',t.profit,t.profit<0?'#dc2626':'#2563eb')}
      </div>
    </div></div>
  </div>`;
}

/* ---------- CARD NGÂN SÁCH vs THỰC TẾ ---------- */
function budgetCard(p,t){
  if(!hasBudget(p)) return '';
  const b=p.budget;
  const revRow=(()=>{
    if(b.revenue==null) return '';
    return `<div style="margin-bottom:10px">
      <div style="display:flex;font-size:13px"><b>Doanh thu (dự thầu)</b><span style="margin-left:auto" class="num">${fmtFull(b.revenue)}</span></div>
      <div style="font-size:12px;color:var(--sub)">Đã thanh toán: <span class="num">${fmtFull(t.income)}</span></div>
    </div>`;
  })();
  const cats=['vt','nc','tb','chung','khac'].filter(k=>b.cats[k] && (b.cats[k].total>0 || (b.cats[k].items||[]).length));
  const rows=cats.map(k=>{
    const c=b.cats[k]; const spent=spentByCat(p,k); const st=budgetStatus(c.total,spent);
    const col=st.over?'#dc2626':(st.pct>=90?'#d97706':'#059669');
    const gk='bud-'+k;
    const gcls=st.over?'over-warn':(st.pct>=90?'near-warn':'');
    const gbadge=st.over?'<span class="over-badge">VƯỢT</span>':(st.pct>=90?'<span class="near-badge">SẮP VƯỢT</span>':'');
    const items=(c.items||[]).slice().sort((a,b)=>b.limit-a.limit);
    return `<div class="grp ${isOpen(gk)?'open':''}">
      <div class="ghead ${gcls}" onclick="toggleGrp('${gk}',this)">
        <span class="gchev">▶</span>
        <div class="ginfo">
          <div class="gname"><span class="pill ${catCls(k)}">${catName(k)}</span>
            <span style="color:${col};font-weight:800;font-size:12px">${st.pct.toFixed(0)}%</span>${gbadge}</div>
          <div class="gbar"><i style="width:${Math.min(st.pct,100).toFixed(1)}%;background:${col}"></i></div>
        </div>
        <div style="text-align:right">
          <div class="amt num" style="color:${col};${st.over?'font-weight:800':''}">${fmtFull(spent)}</div>
          <div class="num" style="font-size:11px;color:var(--sub)">/ ${fmtFull(c.total)}</div>
        </div>
      </div>
      <div class="glist">
        ${items.length? items.map(it=>{
          const isp=spentByItem(p,k,it.name); const s2=budgetStatus(it.limit,isp);
          const entered = isp>0;
          const c2=s2.over?'#dc2626':(s2.pct>=90?'#d97706':(entered?'#059669':'#94a3b8'));
          const icls=(s2.over?'over-warn':(s2.pct>=90?'near-warn':(entered?'entered':'not-entered')));
          const ibadge=s2.over?'<span class="over-badge">VƯỢT</span>':(s2.pct>=90?'<span class="near-badge">SẮP VƯỢT</span>':(entered?'<span class="in-badge">ĐÃ NHẬP</span>':'<span class="miss-badge">CHƯA NHẬP</span>'));
          return `<div class="item ${icls}">
            <div class="info">
              <div class="t1">${esc(it.name)}${ibadge}</div>
              <div class="gbar" style="margin-top:5px"><i style="width:${Math.min(s2.pct,100).toFixed(1)}%;background:${c2}"></i></div>
              <div class="t2 num" ${s2.over?'style="color:#b91c1c;font-weight:700"':''}>${fmtFull(isp)} / ${fmtFull(it.limit)} · ${s2.pct.toFixed(0)}%${s2.over?(' · vượt '+fmtFull(isp-it.limit)):''}</div>
            </div>
          </div>`;
        }).join('') : '<div class="empty" style="padding:10px">Nhóm này chưa có hạn mức con</div>'}
      </div>
    </div>`;
  }).join('');
  const anyOver=cats.some(k=>spentByCat(p,k)>b.cats[k].total && b.cats[k].total>0);
  return `<div class="card coll ${isOpen('tong-budget')?'open':''}">
    <h2 onclick="toggleCard('tong-budget',this)">📐 Ngân sách vs Thực tế ${anyOver?'<span style="color:#dc2626;font-size:12px">⚠️ có mục vượt</span>':''}<span class="chevD">▶</span></h2>
    <div class="cbody"><div class="cinner">
      ${revRow}
      ${rows||'<div class="empty">Chưa có hạn mức</div>'}
      <button class="btn sec sm" style="margin-top:10px;width:auto" onclick="openBudgetView()">Sửa hạn mức</button>
    </div></div>
  </div>`;
}

/* ---------- CARD CHI PHÍ THEO NHÓM (cat → group con → chi tiết) ---------- */
function costGroupCard(p,t){
  // gom theo mã hạng mục (VT/NC/Máy/...), rồi trong mỗi mã gom theo nhóm chi tiết (group), rồi tới giao dịch
  const cats=COST_CATS.filter(c=>p.costs.some(x=>x.cat===c.id));
  const body = cats.length ? cats.map((c,ci)=>{
    const catCosts=p.costs.filter(x=>x.cat===c.id);
    const catSum=catCosts.reduce((s,x)=>s+Number(x.amount||0),0);
    const catPct=t.cost? catSum/t.cost*100:0;
    const ck='cc-'+c.id;
    // gom theo group con
    const subMap={};
    catCosts.forEach(x=>{ const s=subName(x); (subMap[s]||(subMap[s]=[])).push(x); });
    const subs=Object.keys(subMap).map(name=>({name, txns:subMap[name],
      sum:subMap[name].reduce((s,x)=>s+Number(x.amount||0),0)})).sort((a,b)=>b.sum-a.sum);
    const col=groupColor(ci);
    return `<div class="grp ${isOpen(ck)?'open':''}">
      <div class="ghead" onclick="toggleGrp('${ck}',this)">
        <span class="gchev">▶</span>
        <div class="ginfo">
          <div class="gname"><span class="pill ${c.cls}">${c.name}</span> <span style="color:var(--sub);font-weight:500;font-size:12px">(${catPct.toFixed(1)}%)</span></div>
          <div class="gbar"><i style="width:${Math.max(catPct,2).toFixed(1)}%;background:${col}"></i></div>
        </div>
        <div class="amt minus num">${fmtFull(catSum)}</div>
      </div>
      <div class="glist">
        ${subs.map((sg,si)=>{
          const sk=ck+'-s'+si;
          const spct=catSum? sg.sum/catSum*100:0;
          const txns=sg.txns.slice().sort((a,b)=>fmtDT(b).localeCompare(fmtDT(a)));
          return `<div class="grp ${isOpen(sk)?'open':''}">
            <div class="ghead" onclick="toggleGrp('${sk}',this)">
              <span class="gchev">▶</span>
              <div class="ginfo">
                <div class="gname" style="font-size:13px">${esc(sg.name)} <span style="color:var(--sub);font-weight:500;font-size:11px">(${spct.toFixed(0)}%)</span></div>
              </div>
              <div class="amt minus num" style="font-size:13px">${fmtFull(sg.sum)}</div>
            </div>
            <div class="glist">
              ${txns.map(x=>`
                <div class="item">
                  <div class="info">
                    <div class="t1">${esc(x.note||'(không ghi chú)')}${x.blItem?` <span class="pill c-cg">${esc(x.blItem)}</span>`:''}${x.hasVat===false?` <span class="pill novat">Không VAT</span>`:''}</div>
                    <div class="t2">${fmtDT(x)}</div>
                  </div>
                  <div class="amt minus num">${fmtFull(x.amount)}</div>
                  <button type="button" class="more-btn" data-act="more" data-id="${x.id}" aria-label="Tùy chọn">⋮</button>
                </div>`).join('')}
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('') : '<div class="empty">Chưa có chi phí nào</div>';
  return `<div class="card coll ${isOpen('tong-cost')?'open':''}">
    <h2 onclick="toggleCard('tong-cost',this)">🧾 Chi phí theo nhóm
      <span style="margin-left:8px;color:var(--cost);font-size:13px" class="num">${fmtFull(t.cost)}</span>
      <span class="chevD">▶</span></h2>
    <div class="cbody"><div class="cinner">${body}</div></div>
  </div>`;
}

/* ---------- DANH SÁCH GIAO DỊCH (mở từ KPI) ---------- */
function openTxnList(kind){
  const p=proj();
  const isIn = kind==='in';
  if(!isIn){ return openCostList(p); }   // chi phí giữ như cũ
  const t=totals(p);
  const dt=t.contract;
  const pctTxt=v=>(dt&&dt>0)?(v/dt*100).toFixed(1)+'%':'—';
  // tách 2 loại, sắp theo ngày+giờ mới nhất, đánh số đợt theo thứ tự thời gian
  const byTime=(a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||''));
  const paidList=p.income.filter(x=>x.type!=='adv').slice().sort(byTime);
  const advList =p.income.filter(x=>x.type==='adv').slice().sort(byTime);
  // đánh số đợt theo thứ tự thời gian trên TOÀN BỘ (gộp chung), đợt 1 là sớm nhất
  const orderMap=new Map();
  [...p.income].slice().sort((a,b)=>((a.date||'')+(a.time||'')).localeCompare((b.date||'')+(b.time||'')))
    .forEach((x,i)=>orderMap.set(x.id,i+1));
  const rowHtml=x=>`
    <div class="item">
      <div class="info" data-act="edit-in" data-id="${x.id}" style="cursor:pointer;flex:1;min-width:0">
        <div class="t1"><span class="dot-round">Đợt ${orderMap.get(x.id)||''}</span> ${esc(x.note||'(không ghi chú)')} <span class="pill ${x.type==='adv'?'adv':'in'}">${x.type==='adv'?'Tạm ứng':'Thanh toán'}</span>${attBadge(x)}</div>
        <div class="t2">📅 ${fmtDT(x)||'—'}</div>
      </div>
      <div class="thu-right">
        <div class="amt plus num">${fmtFull(x.amount)}</div>
        <button type="button" class="more-btn" data-act="more-in" data-id="${x.id}" aria-label="Tùy chọn">⋮</button>
      </div>
    </div>`;
  const section=(title,cls,arr,tot)=>`
    <div class="pay-sec-h ${cls}"><span>${title}</span><b class="num">${fmtFull(tot)} · ${arr.length} đợt</b></div>
    ${arr.length? arr.map(rowHtml).join('') : '<div class="empty" style="padding:14px">Chưa có đợt nào</div>'}`;
  // gộp tất cả đợt (thanh toán + tạm ứng) thành một danh sách "Đã thanh toán", vẫn giữ nhãn loại mỗi đợt
  const allList=[...paidList,...advList].sort(byTime);
  document.getElementById('sheet').innerHTML=`
    <h3>💰 Thanh toán từ Chủ đầu tư</h3>
    ${dt==null
      ? `<div class="pay-need" onclick="closeModal();openContractQuick()">Chưa nhập <b>Giá trị hợp đồng</b> (theo dự toán). Đây là phần <b>chưa thanh toán</b> ban đầu. Chạm để nhập ›</div>`
      : `<div class="pay-hd"><span>Giá trị hợp đồng theo dự toán <span style="font-weight:500;font-size:11px;color:#94a3b8">(tổng chưa thanh toán)</span></span><b class="num">${fmtFull(dt)}</b></div>`}
    <div class="pay-grid" style="grid-template-columns:1fr 1fr">
      <div class="pay-box paid">
        <div class="pb-top"><span class="pb-lab">✅ Đã thanh toán</span><span class="pb-pct">${pctTxt(t.income)}</span></div>
        <div class="pb-val num">${fmtFull(t.income)}</div>
        <div class="pb-sub">${allList.length} đợt${t.adv>0?` · gồm ${fmtFull(t.adv)} tạm ứng`:''}</div>
      </div>
      <div class="pay-box rest">
        <div class="pb-top"><span class="pb-lab">⏳ Còn lại</span><span class="pb-pct">${dt?pctTxt(t.remain>0?t.remain:0):'—'}</span></div>
        <div class="pb-val num" ${t.remain!=null&&t.remain<0?'style="color:var(--cost)"':''}>${t.remain==null?'—':fmtFull(t.remain)}</div>
        <div class="pb-sub">chưa thanh toán</div>
      </div>
    </div>
    <div class="hint" style="margin:2px 0 8px">Còn lại = Giá trị hợp đồng − Đã thanh toán (gồm cả tạm ứng)</div>
    ${dt?`<div class="pay-bar"><div class="pay-fill paid" style="width:${Math.min(100,(t.income/dt*100)||0)}%"></div></div>
      <div class="pay-legend"><span><i class="dot paid"></i>Đã thanh toán ${pctTxt(t.income)}</span><span><i class="dot rest"></i>Còn lại</span></div>`:''}
    <div style="height:14px"></div>
    ${section('✅ Các đợt đã thanh toán','paid',allList,t.income)}
    <div class="row" style="margin-top:16px">
      <button class="btn" onclick="closeModal();openIncome()">＋ Thêm đợt thanh toán</button>
    </div>`;
  document.getElementById('modal').classList.add('show');
}
// Danh sách chi phí (mở từ KPI) — giữ định dạng cũ
function openCostList(p){
  const list=[...p.costs].sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||'')));

    <h3>🧾 Chi phí</h3>

    </div>

    ${list.length? list.map(x=>`
      <div class="item">

          <div class="t1">${esc(x.note||'(không ghi chú)')} <span class="pill ${catCls(x.cat)}">${catName(x.cat)}</span></div>
          <div class="t2">📅 ${fmtDT(x)||'—'}${x.group?' · '+esc(x.group):''}</div>
        </div>
        <div class="thu-right">
          <div class="amt minus num">${fmtFull(x.amount)}</div>
          <button type="button" class="more-btn" data-act="more" data-id="${x.id}" aria-label="Tùy chọn">⋮</button>
        </div>
      </div>`).join('') : '<div class="empty">Chưa có giao dịch</div>'}
    </div>

}

/* ==================== DRILL-DOWN PHÂN CẤP (Nhóm cha › Nhóm con › Chi tiết) ==================== */
// Trạng thái điều hướng cho mỗi vị trí đặt drill (Tong / Bao)
const DRILL={Tong:{level:0,parent:null,sub:null}, Bao:{level:0,parent:null,sub:null}};

function drillCard(p,t,where){
  return `<div class="card" id="drillCard_${where}"></div>`;
}

// Vẽ nội dung drill vào card tương ứng, theo trạng thái hiện tại
function renderDrill(where){
  const el=document.getElementById('drillCard_'+where);
  if(!el) return;
  const p=proj(); const st=DRILL[where];
  const total=p.costs.reduce((s,x)=>s+Number(x.amount||0),0);

  // Breadcrumb
  let crumb=`<span class="crumb-link" onclick="drillGo('${where}',0)">🗂️ Danh mục</span>`;
  if(st.level>=1 && st.parent!=null) crumb+=` <span class="crumb-sep">›</span> <span class="${st.level>1?'crumb-link':'crumb-cur'}" ${st.level>1?`onclick="drillGo('${where}',1)"`:''}>${esc(st.parent)}</span>`;
  if(st.level>=2 && st.sub!=null) crumb+=` <span class="crumb-sep">›</span> <span class="crumb-cur">${esc(st.sub)}</span>`;

  let head=`<div class="drill-head">
    ${st.level>0?`<button class="drill-back" onclick="drillGo('${where}',${st.level-1})">‹</button>`:''}
    <div class="crumb">${crumb}</div>
  </div>`;

  let body='';
  if(st.level===0){
    // Cấp 0: nhóm cha + nhóm con lẻ (giống ảnh Danh Mục)
    const groups=groupTotals(p.costs,p); // đã gộp theo cha, nhóm con lẻ đứng riêng
    if(!groups.length){ el.innerHTML=head+'<div class="empty">Chưa có chi phí nào</div>'; return; }
    body=`<div class="drill-total">Tổng: <b class="num">${fmtFull(total)}</b></div>`+
      groups.map((g,i)=>rowBar(g.name,g.amount,g.pct,groupColor(i),g.isSuper,
        `onclick="${g.isSuper?`drillOpenParent('${where}','${jsq(g.name)}')`:`drillOpenSubDirect('${where}','${jsq(g.name)}')`}"`)).join('');
  }
  else if(st.level===1){
    // Cấp 1: nhóm con bên trong nhóm cha
    const smap=superOf(p);
    const inParent=p.costs.filter(x=>smap[subName(x)]===st.parent);
    const sum=inParent.reduce((s,x)=>s+Number(x.amount||0),0);
    const sub={}; inParent.forEach(x=>{ const s=subName(x); sub[s]=sub[s]||0; sub[s]+=Number(x.amount||0); });
    const subs=Object.entries(sub).map(([name,amount])=>({name,amount})).sort((a,b)=>b.amount-a.amount);
    body=`<div class="drill-total">📦 ${esc(st.parent)}: <b class="num">${fmtFull(sum)}</b> · ${subs.length} nhóm con</div>`+
      subs.map((s,i)=>rowBar(s.name,s.amount,sum?s.amount/sum*100:0,groupColor(i),false,
        `onclick="drillOpenSub('${where}','${jsq(s.name)}')"`)).join('');
  }
  else {
    // Cấp 2: chi tiết giao dịch trong nhóm con (giống ảnh chi tiết Điều Hòa)
    const list=p.costs.filter(x=>subName(x)===st.sub).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const sum=list.reduce((s,x)=>s+Number(x.amount||0),0);
    body=`<div class="drill-total">${esc(st.sub)}: <b class="num">${fmtFull(sum)}</b> · ${list.length} giao dịch</div>`+
      (list.length? list.map(x=>`
        <div class="item">
          <div class="info">
            <div class="t1">${esc(x.note||'(không ghi chú)')} <span class="pill ${catCls(x.cat)}">${catName(x.cat)}</span>${attBadge(x)}</div>
            <div class="t2">${fmtDT(x)}</div>
          </div>
          <div class="amt minus num">${fmtFull(x.amount)}</div>
          <button type="button" class="more-btn" data-act="more" data-id="${x.id}" aria-label="Tùy chọn">⋮</button>
        </div>`).join('') : '<div class="empty">Không có giao dịch</div>');
  }
  el.innerHTML=head+body;
}

// Một dòng nhóm có % + thanh màu (kiểu Finance Assist)
function rowBar(name,amount,pct,col,isSuper,onclick){
  return `<div class="item drill-row" ${onclick} style="cursor:pointer">
    <div class="info">
      <div class="t1">${isSuper?'📦 ':''}${esc(name)} <span style="color:var(--sub);font-weight:500;font-size:12px">(${pct.toFixed(0)}%)</span></div>
      <div class="t2" style="height:6px;background:#f1f5f9;border-radius:4px;margin-top:6px;overflow:hidden">
        <div style="width:${Math.max(pct,2).toFixed(0)}%;height:100%;background:${col}"></div></div>
    </div>
    <div class="amt minus num">${fmtFull(amount)}</div>
    <span class="chev">›</span>
  </div>`;
}
function jsq(s){ return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'"); }
function fmtDate(d){ if(!d) return ''; const p=d.split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:d; }
// Thứ trong tuần tiếng Việt từ chuỗi ngày yyyy-mm-dd
function weekdayVN(d){ if(!d) return ''; const dt=new Date(d+'T00:00:00'); if(isNaN(dt)) return '';
  return ['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'][dt.getDay()]; }
// Thứ + ngày/tháng/năm + giờ
function fmtDOW(x){ const w=weekdayVN(x.date); return (w?w+', ':'')+(fmtDate(x.date)||'')+(x.time?(' · '+x.time):''); }

// Điều hướng
function drillGo(where,level){
  const st=DRILL[where];
  st.level=level;
  if(level<2) st.sub=null;
  if(level<1) st.parent=null;
  renderDrill(where);
}
function drillReset(){ ['Tong','Bao'].forEach(w=>{ DRILL[w]={level:0,parent:null,sub:null}; }); }
function drillOpenParent(where,name){ const st=DRILL[where]; st.level=1; st.parent=name; st.sub=null; renderDrill(where); }
function drillOpenSub(where,name){ const st=DRILL[where]; st.level=2; st.sub=name; renderDrill(where); }
// Nhóm con lẻ ở cấp 0 (không thuộc cha nào) -> nhảy thẳng vào chi tiết
function drillOpenSubDirect(where,name){ const st=DRILL[where]; st.level=2; st.parent=null; st.sub=name; renderDrill(where); }

let PG_SEARCH='', PG_SORT='name';   // sort: name|time|amount
let CHI_SORT='time';                // sắp xếp danh sách chi phí: time|az|amount
let CHI_SEARCH='';                   // tìm kiếm giao dịch chi phí
function chiSetSort(s){ CHI_SORT=s; const p=proj(); renderChi(p); }
function chiSetSearch(v){ CHI_SEARCH=v; renderChi(proj()); }
function pgSetSearch(v){ PG_SEARCH=v; const p=proj(); renderPayGroupBody(p); }
function pgSetSort(s){ PG_SORT=s; const p=proj(); renderChi(p); }
// sắp xếp danh sách nhóm theo tiêu chí
function pgSortGroups(p, groups){
  const arr=[...groups];
  if(PG_SORT==='name') arr.sort((a,b)=>a.name.localeCompare(b.name,'vi'));
  else if(PG_SORT==='amount') arr.sort((a,b)=>pgTotal(p,b.id)-pgTotal(p,a.id));
  else if(PG_SORT==='time'){ // theo giao dịch mới nhất trong nhóm
    const last=g=>{ const cs=pgCosts(p,g.id); return cs.length? cs.map(x=>fmtDT(x)).sort().slice(-1)[0]:''; };
    arr.sort((a,b)=>last(b).localeCompare(last(a)));
  }
  return arr;
}
function pgItemHtml(p, g, pc){

}
// chỉ vẽ lại phần thân danh sách nhóm (khi gõ tìm kiếm) — không đụng ô input để giữ con trỏ
function renderPayGroupBody(p){
  const el=document.getElementById('pgBody'); if(!el) return;
  const q=xnorm(PG_SEARCH||'');
  const body=PG_CATS.map(pc=>{
    let groups=payGroups(p).filter(g=>g.cat===pc.id);
    if(q) groups=groups.filter(g=>xnorm(g.name).includes(q)||xnorm(g.note||'').includes(q));
    if(!groups.length) return '';
    groups=pgSortGroups(p,groups);
    return `<div class="pg-cat"><div class="pg-cat-h"><span class="pill ${catCls(pc.id)}">${pc.icon} ${pc.name} <span style="opacity:.7">(${groups.length})</span></span></div>${groups.map(g=>pgItemHtml(p,g,pc)).join('')}</div>`;
  }).join('');
  el.innerHTML = body || `<div class="empty">${q?'Không tìm thấy nhóm phù hợp':'Chưa có nhóm thanh toán nào'}</div>`;
}

function savePayGroup(id){
  const p=proj();
  const name=document.getElementById('pgName').value.trim();
  if(!name){ toast('Nhập tên nhóm'); return; }
  const cat=document.getElementById('pgCat').value;
  const icon=PG_PICK_ICON||PG_CAT_ICON[cat]||'📦';
  const note=document.getElementById('pgNote').value.trim();
  const status=(document.getElementById('pgStatus')||{}).value||'unpaid';
  const limit=parseNum((document.getElementById('pgLimit')||{}).value||'');
  if(!Array.isArray(p.payGroups)) p.payGroups=[];
  if(id){ const i=p.payGroups.findIndex(g=>g.id===id); if(i>=0) p.payGroups[i]={...p.payGroups[i],cat,name,icon,note,status,limit}; }
  else p.payGroups.push({id:'pg'+Date.now()+Math.floor(Math.random()*999),cat,name,icon,note,status,limit});

}

function cyclePgStatus(id){
  const p=proj(); const g=pgById(p,id); if(!g) return;
  const order=['unpaid','advance','paid'];
  const i=order.indexOf(g.status||'unpaid');
  g.status=order[(i+1)%order.length];

}
function delPayGroup(id){

  if(!confirm('Xoá nhóm thanh toán này? Các giao dịch sẽ được gỡ khỏi nhóm nhưng vẫn giữ lại.')) return;
  (p.costs||[]).forEach(x=>{ if(x.payGroup===id){ x.payGroup=''; x.dot=''; } });
  p.payGroups=(p.payGroups||[]).filter(g=>g.id!==id);
  delete PG_OPEN[id];
  save(); closeModal(); renderChi(p); toast('Đã xoá nhóm');
}

  const byCat=PG_CATS.map(pc=>({pc, groups:pgs.filter(g=>g.cat===pc.id)})).filter(x=>x.groups.length>=2);
  if(!byCat.length){ toast('Không có hạng mục nào có từ 2 nhóm trở lên để gộp'); return; }

          ${groups.map(g=>`<option value="${g.id}">${g.icon||pc.icon} ${esc(g.name)} · ${fmtFull(pgTotal(p,g.id))}</option>`).join('')}
        </select>
        <label style="margin-top:8px">Nhóm nguồn gộp vào (tích chọn)</label>

      </div>`).join('')}

function mgSourceHtml(catId, targetId){
  const p=proj();
  const groups=payGroups(p).filter(g=>g.cat===catId && g.id!==targetId);
  if(!groups.length) return '<div class="hint">Không còn nhóm nào khác trong hạng mục này.</div>';
  return groups.map(g=>`
    <label style="display:flex;align-items:center;gap:10px;padding:8px 4px;margin:0;border-bottom:1px solid var(--line);cursor:pointer">
      <input type="checkbox" class="mgSrc" data-cat="${catId}" value="${g.id}" style="width:18px;height:18px;flex:none">
      <span style="font-size:14px">${g.icon||PG_CAT_ICON[catId]} ${esc(g.name)}</span>
      <span style="margin-left:auto;color:var(--sub);font-size:12px" class="num">${fmtFull(pgTotal(p,g.id))} · ${pgCosts(p,g.id).length} GD</span>
    </label>`).join('');
}
function mgRefresh(catId){
  const tgt=document.getElementById('mgTarget_'+catId).value;
  const box=document.getElementById('mgSources_'+catId);
  if(box) box.innerHTML=mgSourceHtml(catId, tgt);
}
function doMergePayGroups(){
  const p=proj();
  let mergedGroups=0, movedTxns=0;
  PG_CATS.forEach(pc=>{
    const tgtSel=document.getElementById('mgTarget_'+pc.id);
    if(!tgtSel) return;
    const targetId=tgtSel.value;
    const srcIds=[...document.querySelectorAll('.mgSrc[data-cat="'+pc.id+'"]:checked')].map(x=>x.value).filter(id=>id!==targetId);
    if(!srcIds.length) return;
    srcIds.forEach(sid=>{
      (p.costs||[]).forEach(x=>{ if(x.payGroup===sid){ x.payGroup=targetId; movedTxns++; } });
      p.payGroups=(p.payGroups||[]).filter(g=>g.id!==sid);
      delete PG_OPEN[sid];
      mergedGroups++;
    });
  });
  if(!mergedGroups){ toast('Chưa chọn nhóm nguồn nào'); return; }
  save(); closeModal(); renderChi(p);
  toast('Đã gộp '+mergedGroups+' nhóm · chuyển '+movedTxns+' giao dịch');
}

let PROJ_FILTER=''; // '' = tất cả, hoặc key địa điểm

function projSummary(p){
  const t=totals(p);
  const budget=p.budget||{};
  const budgetTotal=['vt','nc','tb','chung','khac'].reduce((s,k)=>s+Number((budget.cats&&budget.cats[k]&&budget.cats[k].total)||0),0);
  // Doanh thu hợp đồng: ưu tiên budget.revenue (từ dự toán), sau đó p.contractAmount thủ công
  let contract = 0;
  if(budget.revenue!=null && Number(budget.revenue)>0) contract = Math.trunc(Number(budget.revenue));
  else if(p.contractAmount!=null && Number(p.contractAmount)>0) contract = Math.trunc(Number(p.contractAmount));
  // Còn lại = Hợp đồng − đã thu. Nếu chưa có HĐ → null (hiện "—")
  const remain = contract>0 ? Math.max(0, contract - t.income) : null;
  return {id:p.id, name:p.name, location:p.location||'',
    income:t.income, adv:t.adv||0, paidIn:t.paidIn||0, remain, contract,
    cost:t.cost, tax:t.tax, profit:t.profit, budgetTotal};
}
/* Trạng thái xổ chi tiết trong tab Dự án: mỗi dự án có {open, level, parent, sub} */
const PROJ_DRILL={};
function pdState(id){ if(!PROJ_DRILL[id]) PROJ_DRILL[id]={open:false,level:0,parent:null,sub:null}; return PROJ_DRILL[id]; }
function toggleProjRow(id){
  const st=pdState(id);
  st.open=!st.open;
  if(st.open){ st.level=0; st.parent=null; st.sub=null; }
  renderDoanhMuc();
}
function pdGo(id,level){ const st=pdState(id); st.level=level; if(level<2) st.sub=null; if(level<1) st.parent=null; renderDoanhMuc(); }
function pdParent(id,name){ const st=pdState(id); st.level=1; st.parent=name; st.sub=null; renderDoanhMuc(); }
function pdSub(id,name){ const st=pdState(id); st.level=2; st.sub=name; renderDoanhMuc(); }
function pdSubDirect(id,name){ const st=pdState(id); st.level=2; st.parent=null; st.sub=name; renderDoanhMuc(); }

function projDrillBody(p){
  const st=pdState(p.id);
  const total=p.costs.reduce((s,x)=>s+Number(x.amount||0),0);
  let crumb=`<span class="crumb-link" onclick="event.stopPropagation();pdGo('${p.id}',0)">🗂️ Danh mục</span>`;
  if(st.level>=1 && st.parent!=null) crumb+=` <span class="crumb-sep">›</span> <span class="${st.level>1?'crumb-link':'crumb-cur'}" ${st.level>1?`onclick="event.stopPropagation();pdGo('${p.id}',1)"`:''}>${esc(st.parent)}</span>`;
  if(st.level>=2 && st.sub!=null) crumb+=` <span class="crumb-sep">›</span> <span class="crumb-cur">${esc(st.sub)}</span>`;
  let head=`<div class="drill-head">
    ${st.level>0?`<button class="drill-back" onclick="event.stopPropagation();pdGo('${p.id}',${st.level-1})">‹</button>`:''}
    <div class="crumb">${crumb}</div>
    <button class="btn sm" style="width:auto;padding:7px 14px" onclick="event.stopPropagation();openProjectFull('${p.id}')">Mở ›</button>
  </div>`;
  let body='';
  if(st.level===0){
    const groups=groupTotals(p.costs,p);
    if(!groups.length){ return head+'<div class="empty">Chưa có chi phí nào</div>'; }
    body=`<div class="drill-total">Tổng chi: <b class="num">${fmtFull(total)}</b></div>`+
      groups.map((g,i)=>rowBar(g.name,g.amount,g.pct,groupColor(i),g.isSuper,
        `onclick="event.stopPropagation();${g.isSuper?`pdParent('${p.id}','${jsq(g.name)}')`:`pdSubDirect('${p.id}','${jsq(g.name)}')`}"`)).join('');
  } else if(st.level===1){
    const smap=superOf(p);
    const inParent=p.costs.filter(x=>smap[subName(x)]===st.parent);
    const sum=inParent.reduce((s,x)=>s+Number(x.amount||0),0);
    const sub={}; inParent.forEach(x=>{ const s=subName(x); sub[s]=(sub[s]||0)+Number(x.amount||0); });
    const subs=Object.entries(sub).map(([name,amount])=>({name,amount})).sort((a,b)=>b.amount-a.amount);
    body=`<div class="drill-total">📦 ${esc(st.parent)}: <b class="num">${fmtFull(sum)}</b> · ${subs.length} nhóm con</div>`+
      subs.map((s,i)=>rowBar(s.name,s.amount,sum?s.amount/sum*100:0,groupColor(i),false,
        `onclick="event.stopPropagation();pdSub('${p.id}','${jsq(s.name)}')"`)).join('');
  } else {
    const list=p.costs.filter(x=>subName(x)===st.sub).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    const sum=list.reduce((s,x)=>s+Number(x.amount||0),0);
    body=`<div class="drill-total">${esc(st.sub)}: <b class="num">${fmtFull(sum)}</b> · ${list.length} giao dịch</div>`+
      (list.length? list.map(x=>`
        <div class="item">
          <div class="info">
            <div class="t1">${esc(x.note||'(không ghi chú)')} <span class="pill ${catCls(x.cat)}">${catName(x.cat)}</span>${attBadge(x)}</div>
            <div class="t2">${fmtDT(x)}</div>
          </div>
          <div class="amt minus num">${fmtFull(x.amount)}</div>
        </div>`).join('') : '<div class="empty">Không có giao dịch</div>');
  }
  return head+body;
}

// Danh sách dự án đã lọc theo địa điểm + từ khoá tìm kiếm, gom theo địa điểm, đánh số liên tục
function projListHtml(){
  const projById=id=>DB.projects.find(p=>p.id===id);
  const q=locNorm(PROJ_SEARCH);
  const matchP=p=>{
    if(!q) return true;
    const hay=locNorm([p.name, (p.budget&&p.budget.title&&p.budget.title.diaDiem)||'',
      (LOCATION_GROUPS.find(g=>g.key===p.location)||{}).name||''].join(' '));
    return hay.includes(q);
  };
  // thứ tự nhóm địa điểm cố định + "chưa gán" cuối
  const orderKeys=[...LOCATION_GROUPS.map(g=>g.key),''];
  let stt=0; let html=''; let shown=0;
  const grand={income:0,paidIn:0,adv:0,remain:0,cost:0,tax:0,profit:0};
  orderKeys.forEach(locKey=>{
    if(PROJ_FILTER && PROJ_FILTER!==locKey) return;
    let inLoc=DB.projects.filter(p=>(p.location||'')===locKey && matchP(p));
    if(!inLoc.length) return;
    const locName=(LOCATION_GROUPS.find(g=>g.key===locKey)||{}).name || 'Chưa phân địa điểm';
    let locSum={income:0,cost:0,profit:0};
    const rowsHtml=inLoc.map(p=>{
      const r=projSummary(p); stt++; shown++;
      locSum.income+=r.income; locSum.cost+=r.cost; locSum.profit+=r.profit;
      grand.income+=r.income; grand.adv+=r.adv; grand.paidIn+=r.paidIn; grand.remain+= (r.remain!=null?r.remain:0); grand.cost+=r.cost; grand.tax+=r.tax; grand.profit+=r.profit;
      const st=pdState(r.id);
      return `
      <div class="proj-block ${st.open?'open':''}">
        <div class="proj-row" onclick="toggleProjRow('${r.id}')">
          <div class="proj-top">
            <span class="proj-num">${stt}</span>
            <span class="proj-chev">▶</span>
            <div class="proj-name" style="flex:1">${esc(r.name)}</div>
            <button type="button" class="more-btn proj-kebab" data-act="more-proj" data-id="${r.id}" aria-label="Tùy chọn dự án">⋮</button>
          </div>
          <div class="proj-money">
            <span class="mini plus" title="${r.adv>0?('Gồm '+fmtFull(r.adv)+' tạm ứng'):''}"><span>Đã thanh toán</span><span>${fmtFull(r.income)}</span></span>
            <span class="mini" style="background:#fef3c7;color:#b45309" title="${r.contract?('HĐ '+fmtFull(r.contract)):'Chưa nhập giá trị hợp đồng'}"><span>Còn lại</span><span>${r.remain==null?'? HĐ':fmtFull(r.remain)}</span></span>
            <span class="mini minus"><span>Chi phí</span><span>${fmtFull(r.cost)}</span></span>
            <span class="mini" style="color:${r.profit<0?'var(--cost)':'var(--profit)'}"><span>Lợi nhuận</span><span>${fmtFull(r.profit)}</span></span>
          </div>
        </div>
        ${st.open?`<div class="proj-drill">${projDrillBody(projById(r.id))}</div>`:''}
      </div>`;
    }).join('');
    html+=`
      <div class="loc-sec">
        <div class="loc-head">
          <span class="loc-pin">📍</span>
          <span class="loc-title">${esc(locName)}</span>
          <span class="loc-count">${inLoc.length}</span>
          <span class="loc-sum" style="color:${locSum.profit<0?'var(--cost)':'var(--profit)'}">${fmtShort(locSum.profit)}</span>
        </div>
        ${rowsHtml}
      </div>`;
  });
  if(!shown){
    return `<div class="empty">${PROJ_SEARCH?('Không tìm thấy dự án khớp "'+esc(PROJ_SEARCH)+'"'):'Chưa có dự án nào trong nhóm này'}</div>`;
  }
  html+=`
    <div class="proj-foot">
      <div class="pf-name">TỔNG CỘNG · ${shown} dự án</div>
      <div class="pf-vals">
        <span class="mini plus" title="${grand.adv>0?('Gồm '+fmtFull(grand.adv)+' tạm ứng'):''}"><span>Đã thanh toán</span><span>${fmtFull(grand.income)}</span></span>
        <span class="mini" style="background:#fef3c7;color:#b45309"><span>Còn lại</span><span>${grand.remain?fmtFull(grand.remain):'—'}</span></span>
        <span class="mini minus"><span>Chi phí</span><span>${fmtFull(grand.cost)}</span></span>
        <span class="mini" style="color:${grand.profit<0?'var(--cost)':'var(--profit)'}"><span>Lợi nhuận</span><span>${fmtFull(grand.profit)}</span></span>
      </div>
    </div>`;

let CONGNO_TAB='all';   // all | payable | receivable
let CONGNO_SEARCH='';
function debts(){ return Array.isArray(DB.debts)?DB.debts:[]; }
function debtTotals(){
  const d=debts();
  const payable=d.filter(x=>x.dir==='payable'&&!x.done).reduce((s,x)=>s+Number(x.amount||0),0);
  const receivable=d.filter(x=>x.dir==='receivable'&&!x.done).reduce((s,x)=>s+Number(x.amount||0),0);
  const cash=acctTotal();          // tổng tiền đang có trong các tài khoản/quỹ
  const profit=(DB.projects||[]).reduce((s,p)=>s+(totals(p).profit||0),0); // tổng lợi nhuận mọi dự án
  // Tổng tài sản = lợi nhuận + tiền (tài khoản + tiền mặt) + tiền người ta nợ − tiền mình nợ
  const assets=profit+cash+receivable-payable;
  return {payable, receivable, cash, profit, assets, net:cash+receivable-payable};
}

function genQr(){
  const bin=document.getElementById('qrBank').value;
  const acc=(document.getElementById('qrAcc').value||'').trim();
  const amt=parseNum(document.getElementById('qrAmt').value)||0;
  const note=(document.getElementById('qrNote').value||'').trim();
  if(!acc){ toast('Nhập số tài khoản'); return; }
  try{
    const payload=buildVietQr(bin, acc, amt, note);
    const data=[]; for(let i=0;i<payload.length;i++) data.push(payload.charCodeAt(i));
    const matrix=QRCodeGen.build(data);
    const bankName=(VIETQR_BANKS.find(b=>b[0]===bin)||[,''])[1];
    const box=document.getElementById('qrResult');
    box.innerHTML=`<canvas id="qrCanvas" style="max-width:280px;width:100%;border:1px solid #e2e8f0;border-radius:12px"></canvas>
      <div style="margin-top:8px;font-size:14px"><b>${bankName}</b> · ${esc(acc)}</div>
      ${amt>0?`<div style="font-weight:700;color:var(--primary)">${fmtFull(amt)}</div>`:''}
      <div style="font-size:12px;color:#64748b;margin-top:4px">Quét bằng app ngân hàng để chuyển khoản</div>`;
    drawQrToCanvas(document.getElementById('qrCanvas'), matrix, 6);
  }catch(e){ toast('Lỗi tạo QR: '+e.message); console.error(e); }
}

let FIN_SEARCH='', FIN_FILTER='all';   // tìm kiếm & lọc giao dịch tài chính

// Gom toàn bộ giao dịch tài chính của dự án hiện tại (thu / chi / nạp-rút tài khoản)
function allFinanceTxns(){
  const p=proj(); const rows=[];
  if(p){
    (p.income||[]).forEach(x=>rows.push({date:x.date||'',time:x.time||'',amount:Number(x.amount||0),
      note:x.note||'', kind:(x.type==='adv'?'Tạm ứng':'Thanh toán'), cls:(x.type==='adv'?'adv':'in'), sign:1}));
    (p.costs||[]).forEach(x=>rows.push({date:x.date||'',time:x.time||'',amount:Number(x.amount||0),
      note:x.note||'', kind:'Chi phí'+(x.cat?(' · '+catName(x.cat)):''), cls:'cost', sign:-1}));
  }
  (DB.accounts||[]).forEach(a=>{ (a.txns||[]).forEach(x=>rows.push({date:x.date||'',time:x.time||'',amount:Math.abs(Number(x.amount||0)),
      note:(x.note||'')+' · '+a.name, kind:(Number(x.amount||0)>=0?'Nạp quỹ':'Rút/Chi quỹ'), cls:(Number(x.amount||0)>=0?'in':'cost'), sign:(Number(x.amount||0)>=0?1:-1)})); });
  // sắp xếp theo ngày+giờ GẦN NHẤT trước
  rows.sort((a,b)=>((b.date||'')+(b.time||'')).localeCompare((a.date||'')+(a.time||'')));
  return rows;
}
function renderTien(){
  const el=document.getElementById('pageTien'); if(!el) return;
  const accts=DB.accounts||[];

  const txnsAll=allFinanceTxns();
  const fq=locNorm(FIN_SEARCH);
  let txns=txnsAll.filter(x=>{
    if(FIN_FILTER==='in') return x.sign>0;
    if(FIN_FILTER==='out') return x.sign<0;
    if(FIN_FILTER==='fund') return x.kind.includes('quỹ');
    return true;
  });
  if(fq) txns=txns.filter(x=>locNorm([x.note,x.kind].join(' ')).includes(fq));
  const finSeg=[['all','Tất cả'],['in','Tiền vào'],['out','Tiền ra'],['fund','Quỹ']].map(([v,l])=>
    `<button type="button" class="${FIN_FILTER===v?'on':''}" onclick="finSetFilter('${v}')">${l}</button>`).join('');
  const finTotalIn=txns.filter(x=>x.sign>0).reduce((s,x)=>s+x.amount,0);
  const finTotalOut=txns.filter(x=>x.sign<0).reduce((s,x)=>s+x.amount,0);

function saveAccount(id){
  const name=(document.getElementById('acName').value||'').trim();
  if(!name){ toast('Nhập tên tài khoản'); return; }
  const bank=(document.getElementById('acBank').value||'').trim();
  const opening=parseNum(document.getElementById('acOpen').value);
  if(id){ const a=acctById(id); if(a){ a.name=name; a.bank=bank; a.opening=opening; } }
  else { const a=blankAccount(name,bank); a.opening=opening; DB.accounts.push(a); }
  save(); closeModal(); renderAll(); toast('Đã lưu tài khoản');
}
function deleteAccount(id){
  const a=acctById(id); if(!a) return;

function saveAcctTxn(id,dir){
  const a=acctById(id); if(!a) return;

  amt=Math.abs(amt); if(dir==='out') amt=-amt;

  const date=document.getElementById('atDate').value||today();
  a.txns.push({id:'at'+Date.now()+Math.floor(Math.random()*999), date, time:nowTime(), amount:amt, note});
  save(); closeModal(); renderAll(); toast(dir==='in'?'Đã nạp tiền':'Đã ghi khoản chi');
}

/* ==================== BIỂU ĐỒ SVG (thuần, không thư viện) ==================== */
const CHART_PAL=['#0f766e','#0891b2','#f59e0b','#8b5cf6','#ec4899','#10b981','#ef4444','#3b82f6'];
function svgWrap(inner,w,h){ return `<svg viewBox="0 0 ${w} ${h}" width="100%" preserveAspectRatio="xMidYMid meet" style="display:block;font-family:inherit">${inner}</svg>`; }
// rút gọn số cho nhãn trục
function axShort(n){ n=Number(n)||0; const a=Math.abs(n);
  if(a>=1e9) return (n/1e9).toFixed(a>=1e10?0:1).replace(/\.0$/,'')+' tỷ';
  if(a>=1e6) return (n/1e6).toFixed(a>=1e7?0:1).replace(/\.0$/,'')+' tr';
  if(a>=1e3) return Math.round(n/1e3)+'k';
  return String(Math.round(n)); }

// 1) CỘT GHÉP Thu/Chi theo tháng
function chartMonthlyBars(months){
  const keys=Object.keys(months).sort();
  if(!keys.length) return '<div class="empty">Chưa có dữ liệu theo tháng</div>';
  const W=520, H=330, padL=66, padR=14, padT=30, padB=52;
  const iw=W-padL-padR, ih=H-padT-padB;
  const max=Math.max(1,...keys.map(k=>Math.max(months[k].inc,months[k].cost)));
  const n=keys.length, grp=iw/n, bw=Math.min(34,grp/2-4);
  let g='';
  // lưới ngang + nhãn trục Y
  for(let i=0;i<=4;i++){ const y=padT+ih-ih*i/4; const val=max*i/4;
    g+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#eef2f7"/>`;
    g+=`<text x="${padL-8}" y="${(y+5).toFixed(1)}" text-anchor="end" font-size="14" fill="#94a3b8">${axShort(val)}</text>`;
  }
  keys.forEach((k,i)=>{
    const cx=padL+grp*i+grp/2;
    const hi=months[k].inc/max*ih, hc=months[k].cost/max*ih;
    const x1=cx-bw-3, x2=cx+3;
    g+=`<rect x="${x1.toFixed(1)}" y="${(padT+ih-hi).toFixed(1)}" width="${bw}" height="${Math.max(0,hi).toFixed(1)}" rx="4" fill="#059669"><title>Thu ${k}: ${fmtFull(months[k].inc)}</title></rect>`;
    g+=`<rect x="${x2.toFixed(1)}" y="${(padT+ih-hc).toFixed(1)}" width="${bw}" height="${Math.max(0,hc).toFixed(1)}" rx="4" fill="#dc2626"><title>Chi ${k}: ${fmtFull(months[k].cost)}</title></rect>`;
    const lbl=k.slice(5)+'/'+k.slice(2,4);
    g+=`<text x="${cx.toFixed(1)}" y="${H-padB+22}" text-anchor="middle" font-size="13" fill="#64748b">${lbl}</text>`;
  });
  const legend=`<g><rect x="${padL}" y="4" width="14" height="14" rx="3" fill="#059669"/><text x="${padL+20}" y="16" font-size="14" fill="#475569">Thu</text><rect x="${padL+80}" y="4" width="14" height="14" rx="3" fill="#dc2626"/><text x="${padL+100}" y="16" font-size="14" fill="#475569">Chi</text></g>`;
  return svgWrap(legend+g,W,H);
}

// 2) DONUT chi phí theo hạng mục — to, donut ở giữa, chú thích bên dưới
function chartCatDonut(t){
  const data=COST_CATS.map((c,i)=>({name:c.name,val:t.byCat[c.id]||0,col:CHART_PAL[i%CHART_PAL.length]})).filter(d=>d.val>0);
  const total=data.reduce((s,d)=>s+d.val,0);
  if(!total) return '<div class="empty">Chưa có chi phí</div>';
  const W=520, cx=W/2, cy=170, r=140, rin=88;
  const legRows=Math.ceil(data.length/2);
  const H=cy+r+24+legRows*30;
  let ang=-Math.PI/2, arcs='';
  const arc=(a0,a1,col,tip)=>{
    const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);
    const xi1=cx+rin*Math.cos(a1),yi1=cy+rin*Math.sin(a1),xi0=cx+rin*Math.cos(a0),yi0=cy+rin*Math.sin(a0);
    const large=(a1-a0)>Math.PI?1:0;
    return `<path d="M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} L${xi1.toFixed(2)} ${yi1.toFixed(2)} A${rin} ${rin} 0 ${large} 0 ${xi0.toFixed(2)} ${yi0.toFixed(2)} Z" fill="${col}" stroke="#fff" stroke-width="2"><title>${tip}</title></path>`;
  };
  data.forEach(d=>{ const a1=ang+(d.val/total)*Math.PI*2; arcs+=arc(ang,a1,d.col,`${d.name}: ${fmtFull(d.val)} (${(d.val/total*100).toFixed(1)}%)`); ang=a1; });
  arcs+=`<text x="${cx}" y="${cy-8}" text-anchor="middle" font-size="18" fill="#64748b">Tổng chi</text>`;
  arcs+=`<text x="${cx}" y="${cy+22}" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">${axShort(total)}</text>`;
  // legend 2 cột bên dưới
  const colW=W/2, startY=cy+r+30;
  data.forEach((d,i)=>{ const pct=(d.val/total*100).toFixed(1);
    const col=i%2, row=Math.floor(i/2);
    const lx=col*colW+14, ly=startY+row*30;
    arcs+=`<rect x="${lx}" y="${ly-13}" width="15" height="15" rx="3" fill="${d.col}"/>`;
    arcs+=`<text x="${lx+22}" y="${ly}" font-size="15" fill="#334155">${d.name}</text>`;
    arcs+=`<text x="${col*colW+colW-14}" y="${ly}" text-anchor="end" font-size="15" font-weight="700" fill="#0f172a">${pct}%</text>`;
  });
  return svgWrap(arcs,W,H);
}

// 3) NGÂN SÁCH vs THỰC CHI theo nhóm thanh toán (thanh ngang)
function chartBudgetVsActual(p){
  const rows=payGroups(p).filter(g=>Number(g.limit||0)>0).map(g=>({name:g.name,lim:Number(g.limit),act:pgTotal(p,g.id)}));
  (p.superGroups||[]).filter(sg=>Number(sg.limit||0)>0).forEach(sg=>rows.push({name:sg.name,lim:Number(sg.limit),act:superSpent(p,sg)}));
  if(!rows.length) return '<div class="empty">Chưa đặt hạn mức cho nhóm nào. Đặt hạn mức ở nhóm thanh toán hoặc nhóm cha để so sánh.</div>';
  rows.sort((a,b)=>(b.act/b.lim)-(a.act/a.lim));
  const rowH=62, W=520, padL=12, padR=12, barX=12, barW=W-padL-padR;
  const H=rows.length*rowH+12;
  let g='';
  rows.forEach((r,i)=>{
    const y=i*rowH+10; const pct=r.lim? r.act/r.lim:0;
    const fillW=Math.min(pct,1)*barW;
    const col=pct>1?'#dc2626':(pct>=0.85?'#f59e0b':'#0f766e');
    g+=`<text x="${barX}" y="${y+16}" font-size="15" font-weight="700" fill="#334155">${esc(r.name)}</text>`;
    g+=`<text x="${W-padR}" y="${y+16}" text-anchor="end" font-size="14" font-weight="600" fill="${col}">${fmtShort(r.act)} / ${fmtShort(r.lim)} · ${(pct*100).toFixed(0)}%</text>`;
    g+=`<rect x="${barX}" y="${y+26}" width="${barW}" height="18" rx="9" fill="#eef2f7"/>`;
    g+=`<rect x="${barX}" y="${y+26}" width="${fillW.toFixed(1)}" height="18" rx="9" fill="${col}"><title>${esc(r.name)}: ${(pct*100).toFixed(0)}%</title></rect>`;
    if(pct>1) g+=`<text x="${(barX+barW-8)}" y="${y+39}" text-anchor="end" font-size="12" font-weight="800" fill="#fff">VƯỢT</text>`;
  });
  return svgWrap(g,W,H);
}

// 4) LỢI NHUẬN LŨY KẾ theo thời gian (đường)
function chartCumProfit(p){
  // gộp mọi giao dịch theo ngày: thu (+) / chi (−) để ra lợi nhuận dòng tiền lũy kế
  const ev=[];
  (p.income||[]).forEach(x=>ev.push({d:x.date||'',v:Number(x.amount||0)}));
  (p.costs||[]).forEach(x=>ev.push({d:x.date||'',v:-Number(x.amount||0)}));
  ev.sort((a,b)=>(a.d||'').localeCompare(b.d||''));
  if(ev.length<2) return '<div class="empty">Cần ít nhất 2 giao dịch có ngày để vẽ đường lũy kế</div>';
  let cum=0; const pts=ev.map(e=>({d:e.d,y:(cum+=e.v)}));
  const W=520,H=300,padL=66,padR=16,padT=20,padB=42, iw=W-padL-padR, ih=H-padT-padB;
  const ys=pts.map(p=>p.y); let mn=Math.min(0,...ys), mx=Math.max(0,...ys); if(mn===mx) mx=mn+1;
  const X=i=>padL+iw*(i/(pts.length-1));
  const Y=v=>padT+ih-((v-mn)/(mx-mn))*ih;
  let g='';
  for(let i=0;i<=4;i++){ const val=mn+(mx-mn)*i/4; const y=Y(val);
    g+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#eef2f7"/>`;
    g+=`<text x="${padL-8}" y="${(y+5).toFixed(1)}" text-anchor="end" font-size="14" fill="#94a3b8">${axShort(val)}</text>`;
  }
  const zeroY=Y(0); g+=`<line x1="${padL}" y1="${zeroY.toFixed(1)}" x2="${W-padR}" y2="${zeroY.toFixed(1)}" stroke="#cbd5e1" stroke-dasharray="3 3"/>`;
  const line=pts.map((p,i)=>`${i?'L':'M'}${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ');
  const area=`M${X(0).toFixed(1)} ${zeroY.toFixed(1)} `+pts.map((p,i)=>`L${X(i).toFixed(1)} ${Y(p.y).toFixed(1)}`).join(' ')+` L${X(pts.length-1).toFixed(1)} ${zeroY.toFixed(1)} Z`;
  const last=pts[pts.length-1].y; const col=last<0?'#dc2626':'#2563eb';
  g+=`<path d="${area}" fill="${col}" opacity="0.10"/>`;
  g+=`<path d="${line}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  // điểm cuối
  g+=`<circle cx="${X(pts.length-1).toFixed(1)}" cy="${Y(last).toFixed(1)}" r="5.5" fill="${col}"/>`;
  g+=`<text x="${(X(pts.length-1)-6).toFixed(1)}" y="${(Y(last)-11).toFixed(1)}" text-anchor="end" font-size="15" font-weight="700" fill="${col}">${fmtShort(last)}</text>`;
  // nhãn ngày đầu/cuối
  g+=`<text x="${padL}" y="${H-padB+24}" font-size="13" fill="#64748b">${pts[0].d||''}</text>`;
  g+=`<text x="${W-padR}" y="${H-padB+24}" text-anchor="end" font-size="13" fill="#64748b">${pts[pts.length-1].d||''}</text>`;
  return svgWrap(g,W,H);
}

// ngân sách của 1 dự án: ưu tiên số tự nhập (allocBudget), nếu 0 thì lấy dự toán (budget.revenue)
function projBudget(p){ return Number(p.allocBudget||0) || Number((p.budget&&p.budget.revenue)||0) || 0; }
function projSpent(p){ return (p.costs||[]).reduce((s,x)=>s+Number(x.amount||0),0); }
function companyBudgetData(){
  const manual=Number(DB.companyBudget||0);
  const sumAlloc=DB.projects.reduce((s,p)=>s+projBudget(p),0);   // tổng ngân sách đã gán/dự toán
  const totalSpent=DB.projects.reduce((s,p)=>s+projSpent(p),0);  // tổng đã chi
  const base=manual>0?manual:sumAlloc;                          // mốc để cảnh báo vượt
  return {manual, sumAlloc, totalSpent, base, remain:base-totalSpent, over:base>0&&totalSpent>base};
}
function renderCompanyBudget(){
  const d=companyBudgetData();
  const pctSpent=d.base>0?Math.min(100,d.totalSpent/d.base*100):0;
  const barCol=d.over?'#dc2626':(pctSpent>=85?'#f59e0b':'#0f766e');
  const rows=DB.projects.map(p=>{
    const bud=projBudget(p), sp=projSpent(p);
    const pct=bud>0?sp/bud*100:0;
    const col=pct>100?'#dc2626':(pct>=85?'#f59e0b':'#0f766e');
    const src=Number(p.allocBudget||0)>0?'gán':'dự toán';
    return `<div class="cb-row" onclick="openAllocBudget('${p.id}')">
      <div class="cb-top"><span class="cb-name">${esc(p.name)}</span>
        <span class="cb-fig" style="color:${col}">${fmtShort(sp)} / ${bud>0?fmtShort(bud):'chưa có'}${bud>0?` · ${pct.toFixed(0)}%`:''}</span></div>
      <div class="cb-bar"><div class="cb-fill" style="width:${bud>0?Math.min(100,pct):0}%;background:${col}"></div></div>
      <div class="cb-sub">${bud>0?('Ngân sách theo '+src+(pct>100?' · ⛔ VƯỢT '+fmtShort(sp-bud):'')):'Chạm để gán ngân sách'}</div>
    </div>`;
  }).join('');
  return `
  <div class="card">
    <h2>🏛️ Ngân sách tổng công ty</h2>
    <div class="cb-head ${d.over?'over':''}">
      <div class="cb-h-row"><span>Ngân sách tổng ${d.manual>0?'(tự nhập)':'(= tổng dự toán)'}</span><b class="num">${fmtFull(d.base)}</b></div>
      <div class="cb-h-row"><span>Đã chi (mọi dự án)</span><b class="num" style="color:${d.over?'var(--cost)':'var(--income)'}">${fmtFull(d.totalSpent)}</b></div>
      <div class="cb-bar big"><div class="cb-fill" style="width:${pctSpent}%;background:${barCol}"></div></div>
      <div class="cb-h-row big"><span>${d.over?'⛔ Vượt ngân sách':'Còn lại'}</span><b class="num" style="color:${d.over?'var(--cost)':'var(--profit)'}">${fmtFull(Math.abs(d.remain))}</b></div>
      ${d.manual>0 && d.sumAlloc>0 && Math.abs(d.manual-d.sumAlloc)>1?`<div class="cb-cmp">Tổng dự toán/gán các dự án: <b>${fmtFull(d.sumAlloc)}</b> ${d.sumAlloc>d.manual?`<span style="color:var(--cost)">(cao hơn ngân sách ${fmtShort(d.sumAlloc-d.manual)})</span>`:`<span style="color:var(--income)">(thấp hơn ${fmtShort(d.manual-d.sumAlloc)})</span>`}</div>`:''}
    </div>
    <button class="btn sec sm" style="width:100%;margin-top:10px" onclick="openCompanyBudget()">✏️ Nhập ngân sách tổng công ty</button>

let REPORT_PERIOD='all';   // 'all' | 'YYYY-MM' (tháng) | 'YYYY-Qn' (quý) | 'YYYY' (năm)
function setReportPeriod(v){ REPORT_PERIOD=v; renderBao(proj()); }
// lọc giao dịch theo kỳ đã chọn
function inPeriod(dateStr){
  if(REPORT_PERIOD==='all') return true;
  const d=(dateStr||''); if(!d) return false;
  const y=d.slice(0,4), m=d.slice(5,7);
  if(/^\d{4}-Q[1-4]$/.test(REPORT_PERIOD)){
    const py=REPORT_PERIOD.slice(0,4), q=+REPORT_PERIOD.slice(6);
    const mn=+m; const qq=Math.ceil(mn/3);
    return y===py && qq===q;
  }
  if(/^\d{4}-\d{2}$/.test(REPORT_PERIOD)) return d.slice(0,7)===REPORT_PERIOD;
  if(/^\d{4}$/.test(REPORT_PERIOD)) return y===REPORT_PERIOD;
  return true;
}
// tính tổng doanh thu/chi phí/lợi nhuận trong kỳ
function periodTotals(p){
  const inc=p.income.filter(x=>inPeriod(x.date)).reduce((s,x)=>s+Number(x.amount||0),0);
  const costArr=p.costs.filter(x=>inPeriod(x.date));
  const cost=costArr.reduce((s,x)=>s+Number(x.amount||0),0);
  return {inc, cost, profit:inc-cost, nInc:p.income.filter(x=>inPeriod(x.date)).length, nCost:costArr.length};
}
// build danh sách kỳ có dữ liệu để chọn
function periodOptions(p){
  const set=new Set();
  [...p.income,...p.costs].forEach(x=>{ const d=(x.date||''); if(d.length>=7){ set.add(d.slice(0,7)); } });
  const months=[...set].sort().reverse();
  const years=[...new Set(months.map(m=>m.slice(0,4)))];
  let opts=`<option value="all" ${REPORT_PERIOD==='all'?'selected':''}>Tất cả thời gian</option>`;
  years.forEach(y=>{
    opts+=`<option value="${y}" ${REPORT_PERIOD===y?'selected':''}>Năm ${y}</option>`;
    [1,2,3,4].forEach(q=>{ if(months.some(m=>m.slice(0,4)===y && Math.ceil(+m.slice(5,7)/3)===q)){ const v=y+'-Q'+q; opts+=`<option value="${v}" ${REPORT_PERIOD===v?'selected':''}>Quý ${q}/${y}</option>`; } });
    months.filter(m=>m.slice(0,4)===y).forEach(m=>{ opts+=`<option value="${m}" ${REPORT_PERIOD===m?'selected':''}>Tháng ${m.slice(5,7)}/${y}</option>`; });
  });
  return opts;
}

function renderSuperGroupBody(p){
  const el=document.getElementById('sgBody'); if(!el) return;
  let sgs=[...(p.superGroups||[])];
  const q=xnorm(SG_SEARCH||'');
  if(q) sgs=sgs.filter(sg=>xnorm(sg.name).includes(q)||(sg.members||[]).some(m=>xnorm(m).includes(q)));
  if(SG_SORT==='name') sgs.sort((a,b)=>a.name.localeCompare(b.name,'vi'));
  else if(SG_SORT==='amount') sgs.sort((a,b)=>superSpent(p,b)-superSpent(p,a));
  el.innerHTML = sgs.length? sgs.map(sg=>sgItemHtml(p,sg)).join('') : `<div class="empty">${q?'Không tìm thấy nhóm cha':'Chưa có nhóm cha nào'}</div>`;
}

// Tách [Danh Mục] từ ghi chú -> gán vào group cho các chi phí chưa phân nhóm
function repairGroupsFromNote(){
  const p=proj();
  let fixed=0;
  (p.costs||[]).forEach(x=>{
    const g=(x.group&&x.group.trim())||'';
    if(g) return;
    const m=String(x.note||'').match(/^\s*\[([^\]]+)\]\s*(.*)$/);
    if(m){
      x.group=m[1].trim();          // tên danh mục -> nhóm con
      if(m[2].trim()) x.note=m[2].trim(); // bỏ tiền tố [..] khỏi ghi chú
      // suy lại hạng mục 4-loại cho chính xác
      x.cat=faBucket(x.group, x.note);
      fixed++;
    }
  });
  if(!fixed){ toast('Không có giao dịch nào cần sửa'); return; }
  save();
  // tự động gom nhóm cha ngay sau khi tách
  const already={}; (p.superGroups||[]).forEach(sg=>(sg.members||[]).forEach(mm=>already[mm]=1));
  const subs=[...new Set(p.costs.map(subName))];
  const prop=computeSuggestions(subs, already);
  let created=0;
  if(!p.superGroups) p.superGroups=[];
  Object.entries(prop).forEach(([name,members])=>{
    if(!members.length) return;
    const ex=p.superGroups.find(s=>s.name===name);
    if(ex){ ex.members=[...new Set([...(ex.members||[]),...members])]; }
    else { p.superGroups.push({id:'sg'+Date.now()+Math.floor(Math.random()*9999)+created,name,members}); created++; }
  });
  save(); drillReset(); renderAll();
  toast('Đã tách '+fixed+' giao dịch, tạo '+created+' nhóm cha');
}
// Từ khoá gom nhóm con theo nhóm cha. Quy tắc xét theo thứ tự; nhóm con vào nhóm cha khớp ĐẦU TIÊN.
// kw: khớp chứa chuỗi (không dấu). wkw: khớp nguyên từ (word-boundary) — dùng cho từ ngắn dễ nhầm như "đá","xe".
const AUTO_RULES=[
  {name:'Điều hòa & thông gió', kw:['điều hòa','thông gió','daikin','hệ thống lạnh']},
  {name:'Điện', kw:['dây điện','tủ điện','thang máy','thi công điện'], wkw:['điện']},
  {name:'Nhân công / Đội thi công', kw:['lương','nhân công','a toại','a dũng'], wkw:['đội']},
  {name:'Thép & kết cấu', kw:['thép','kết cấu','xà gồ','ván khuôn','dàn giáo','grating','thép v']},
  {name:'Sơn & hoàn thiện', kw:['sơn','hardener','xây tô','nhôm kính','ống upvc','màng pe','ống thông gió']},
  {name:'Bê tông & đá', kw:['bê tông','xi măng','gạch','cống','vải địa','khe co giãn'], wkw:['đá']},
  {name:'Thiết bị', kw:['thiết bị','bồn dầu','container','máy'], wkw:['xe']},
  {name:'Nhà thầu phụ / Công nợ', kw:['trả ','mượn','tạm ứng abc','công nợ']},
  {name:'Hạ tầng & PCCC', kw:['pccc','bể pccc','cửa trùm','túi khí','hạ tầng']},
  {name:'Chi phí văn phòng & khác', kw:['kho 20000','chi tiêu khác','văn phòng','vật tư phụ','vật liệu chính','thí nghiệm','thuế','không rõ','acb']},
];
function normalize(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d'); }
// Tính đề xuất gom nhóm: nhận danh sách tên nhóm con -> {parentName:[subs]}
function computeSuggestions(subs, exclude){
  exclude=exclude||{};
  const proposed={};
  const wordHit=(ns,w)=>{ const nw=normalize(w); return new RegExp('(^|[^a-z0-9])'+nw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'([^a-z0-9]|$)').test(ns); };
  subs.forEach(s=>{
    if(s==='Chưa phân nhóm' || exclude[s]) return;
    const ns=normalize(s);
    for(const r of AUTO_RULES){
      const hit=(r.kw||[]).some(k=>ns.includes(normalize(k))) || (r.wkw||[]).some(w=>wordHit(ns,w));
      if(hit){ (proposed[r.name]=proposed[r.name]||[]).push(s); break; }
    }
  });
  return proposed;
}
function autoSuggestGroups(){
  const p=proj();
  const subs=allSubGroups(p);
  const already={}; (p.superGroups||[]).forEach(sg=>(sg.members||[]).forEach(m=>already[m]=1));
  const proposed=computeSuggestions(subs, already);
  const entries=Object.entries(proposed).filter(([_,m])=>m.length);
  if(!entries.length){ toast('Không có nhóm con nào để gợi ý'); return; }
  // tính tổng tiền mỗi nhóm đề xuất
  const amtOf=s=>p.costs.filter(x=>subName(x)===s).reduce((a,x)=>a+Number(x.amount||0),0);
  document.getElementById('sheet').innerHTML=`
    <h3>✨ Gợi ý gom nhóm</h3>
    <div class="hint" style="margin-bottom:10px">Tích chọn các nhóm cha muốn tạo. Bạn có thể bỏ tick từng nhóm con không phù hợp.</div>

// ===== SAO LƯU KÈM CHỨNG TỪ (ĐÍNH KÈM) =====
// Đính kèm (ảnh/PDF) nằm ở IndexedDB, KHÔNG nằm trong DB. Backup phải gom cả chúng
// để khi đổi máy không mất chứng từ.

// Duyệt toàn bộ giao dịch, thu thập mọi id đính kèm đang được tham chiếu
function collectAttIds(){
  const ids=new Set();
  (DB.projects||[]).forEach(p=>{
    (p.costs||[]).forEach(c=>{ (c.att||[]).forEach(a=>{ if(a&&a.id) ids.add(a.id); }); });
    (p.income||[]).forEach(x=>{ (x.att||[]).forEach(a=>{ if(a&&a.id) ids.add(a.id); }); });
  });
  return [...ids];
}
// Blob -> chuỗi base64 (không kèm tiền tố data:)
function blobToBase64(blob){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{ const s=r.result||''; const i=s.indexOf(','); res(i>=0?s.slice(i+1):s); };
    r.onerror=()=>rej(r.error); r.readAsDataURL(blob);
  });
}
// base64 -> Blob
function base64ToBlob(b64, type){
  const bin=atob(b64); const len=bin.length; const arr=new Uint8Array(len);
  for(let i=0;i<len;i++) arr[i]=bin.charCodeAt(i);
  return new Blob([arr], {type:type||'application/octet-stream'});
}
// Tạo object backup đầy đủ: dữ liệu DB + toàn bộ đính kèm dạng base64
async function buildFullBackup(onProgress){
  const ids=collectAttIds();
  const atts={};
  let done=0;
  for(const id of ids){
    try{
      const blob=await attGet(id);
      if(blob){ atts[id]={ type:blob.type||'application/octet-stream', data:await blobToBase64(blob) }; }
    }catch(e){ console.error('backup att '+id, e); }
    done++; if(onProgress) onProgress(done, ids.length);
  }
  return { _format:'qlcp-backup', _version:2, _exportedAt:Date.now(), db:DB, attachments:atts };
}

async function exportJson(){
  try{
    toast('Đang gom dữ liệu + chứng từ…');
    const full=await buildFullBackup();

function dismissBackupReminder(){ hideBackupReminder(); window.__bkDismissRev=DB.rev||0; }
function hideBackupReminder(){ const b=document.getElementById('backupBanner'); if(b) b.style.display='none'; }
// Kiểm tra có nên nhắc sao lưu ra ngoài máy không
function checkBackupReminder(){
  const b=document.getElementById('backupBanner'); if(!b) return;
  const rev=DB.rev||0, bkRev=DB.lastBackupRev||0;
  const changed=rev-bkRev;                          // số thay đổi kể từ lần sao lưu ngoài gần nhất
  const days=DB.lastBackupAt? (Date.now()-DB.lastBackupAt)/86400000 : 999;
  // đã bấm ẩn cho mốc rev này thì thôi
  if(window.__bkDismissRev===rev){ return; }
  // nhắc khi: có ≥30 thay đổi chưa sao lưu, HOẶC chưa từng sao lưu và có >10 thay đổi, HOẶC >7 ngày
  let msg='';
  if(bkRev===0 && rev>10) msg='Bạn chưa từng sao lưu ra ngoài máy. Nếu mất/hỏng điện thoại sẽ mất hết sổ sách — sao lưu ngay nhé.';
  else if(changed>=30) msg='Bạn có '+changed+' thay đổi chưa sao lưu ra ngoài máy. Sao lưu để phòng mất/hỏng điện thoại.';
  else if(days>7 && changed>0) msg='Đã '+Math.floor(days)+' ngày chưa sao lưu ra ngoài máy. Nên sao lưu định kỳ.';
  if(msg){ b.querySelector('.br-msg').textContent=msg; b.style.display='flex'; }
  else b.style.display='none';
}
// Khôi phục dữ liệu từ file .json đã sao lưu
async function restoreJson(file){
  if(!file){ return; }
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    // Nhận 2 định dạng: MỚI {_format:'qlcp-backup', db, attachments} hoặc CŨ (chính là DB)
    let data, atts=null;
    if(parsed && parsed._format==='qlcp-backup' && parsed.db){
      data = parsed.db; atts = parsed.attachments||{};
    } else {
      data = parsed;
    }
    if(!data || !Array.isArray(data.projects)) { toast('File không hợp lệ (thiếu danh sách dự án)'); return; }
    const attCount = atts ? Object.keys(atts).length : 0;
    const msg = 'Khôi phục sẽ THAY THẾ toàn bộ dữ liệu hiện tại bằng dữ liệu trong file'
      + (attCount? (' (kèm '+attCount+' chứng từ)') : '') + '. Tiếp tục?';
    if(!confirm(msg)) return;
    // Ghi lại các chứng từ đính kèm vào IndexedDB trước
    if(atts && attCount){
      toast('Đang khôi phục '+attCount+' chứng từ…');
      let ok=0;
      for(const id of Object.keys(atts)){
        try{ const a=atts[id]; if(a&&a.data){ await attPut(id, base64ToBlob(a.data, a.type)); ok++; } }
        catch(e){ console.error('restore att '+id, e); }
      }
      console.log('Đã khôi phục '+ok+'/'+attCount+' chứng từ');
    }
    DB = migrate(data);
    CUR = DB.projects[0] ? DB.projects[0].id : null;
    save(); drillReset(); applyTabOrder(); renderAll();
    toast('Đã khôi phục '+DB.projects.length+' dự án'+(attCount?(' + '+attCount+' chứng từ'):''));
  }catch(e){ toast('Lỗi đọc file: '+e.message); console.error(e); }
}
