function parseCsv(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim());
  const split=l=>{ const out=[];let cur='';let q=false;
    for(let i=0;i<l.length;i++){const ch=l[i];
      if(ch==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++;} else q=!q; }
      else if(ch===','&&!q){ out.push(cur);cur=''; } else cur+=ch; }
    out.push(cur); return out; };
  const hdr=split(lines[0]);
  return lines.slice(1).map(l=>{ const c=split(l); const o={}; hdr.forEach((h,i)=>o[h.trim()]=(c[i]||'').trim()); return o; });
}

function faBucket(cat,note){
  const s=(String(cat)+' '+String(note)).toLowerCase();
  if(/lương|luong|nhân công|nhan cong|đội |cong nhat|công nhật|kỹ sư|ky su/.test(s)) return 'nc';
  if(/thiết bị|thiet bi|xe đào|xe dao|máy đào|may dao|máy đục|may duc|thang máy|thang may|daikin|container|cần cẩu|can cau|xe cẩu|xe cau|máy ép|may ep|máy khoan|may khoan|lu rung|máy lu/.test(s)) return 'tb';
  if(/thuế|thue/.test(s)) return 'khac';
  if(/thép|thep|bê tông|be tong|xi măng|xi mang|đá|cát|cat|gạch|gach|ống|ong |vật tư|vat tu|vật liệu|vat lieu|ván khuôn|van khuon|dàn giáo|dan giao|màng pe|mang pe|sơn|son|dây điện|day dien|tủ điện|tu dien|kết cấu|ket cau|nhôm|nhom|cống|cong|vải địa|vai dia|grating|khuôn|khuon|hdpe/.test(s)) return 'vt';
  return 'khac';
}
// Nhóm chi tiết = ĐÚNG tên Danh Mục của Finance Assist (giữ nguyên).
// Chỉ suy đoán khi Danh Mục trống hoặc chung chung (ví/kho/tiền mặt).
function faGroup(cat,note){
  let c=String(cat||'').trim();
  // Nếu ghi chú có tiền tố [Danh Mục] -> ưu tiên
  const pre=String(note||'').match(/^\s*\[([^\]]+)\]/);
  if(pre) return pre[1].trim();
  const generic=/^(kho\b|kho ?\d*|tiền mặt|tien mat|ví|vi|doanh thu|a toại|chi tiêu khác|chi tieu khac|thanh toan|thanh toán|không rõ|khong ro)$/i;
  if(c && !generic.test(c)) return c;   // <-- dùng thẳng Danh Mục thật
  // fallback khi Danh Mục trống/chung chung: suy từ ghi chú
  const s=String(note||'').toLowerCase();
  if(/điều hòa|dieu hoa|daikin/.test(s)) return 'Điều Hòa';
  if(/màng|mang pe|hdpe|hpde/.test(s)) return 'Màng Pe';
  if(/gạch|gach/.test(s)) return 'Gạch';
  if(/thép|thep|kẽm|kem/.test(s)) return 'Thép';
  if(/bê tông|be tong|xi măng|xi mang/.test(s)) return 'Bê Tông / Xi Măng';
  if(/ván khuôn|van khuon|xà gồ|xa go/.test(s)) return 'Ván Khuôn, Xà Gồ';
  if(/sơn|son/.test(s)) return 'Sơn';
  if(/ống|ong /.test(s)) return 'Ống';
  if(/vải địa|vai dia/.test(s)) return 'Vải Địa';
  if(/lương|luong|công nhật|cong nhat|nhân công|nhan cong/.test(s)) return 'Nhân Công';
  if(/đá|da /.test(s)) return 'Đá';
  return c || 'Chi phí khác';
}
function classifyFinanceAssist(records){
  // Detect columns (Finance Assist Vietnamese headers)
  const F=(r,keys)=>{ for(const k of keys){ for(const kk in r){ if(kk.trim().toLowerCase().includes(k)) return r[kk]; } } return ''; };
  const rows=records.map(r=>({
    time: F(r,['thời gian','thoi gian','time','date']),
    amount: parseNum(F(r,['số tiền','so tien','amount'])),   // <-- chỉ lấy phần nguyên
    wallet: F(r,['ví','vi','wallet','ví ']),
    cat: String(F(r,['danh mục','danh muc','category'])||'').trim(),
    note: String(F(r,['ghi chú','ghi chu','note'])||'').trim(),
  })).filter(r=>r.amount);
  // Collapse exact double-entry pairs (Tiền Mặt + Doanh Thu Dự Án, same time+amount+note)
  const seen={}; const kept=[];
  rows.forEach(r=>{
    const sig=r.time+'|'+r.amount+'|'+r.note;
    if(seen[sig]){ seen[sig]++; return; } // drop duplicate of a pair
    seen[sig]=1; kept.push(r);
  });
  const income=[], costs=[];
  kept.forEach(r=>{
    const ts=String(r.time);
    const date=ts.slice(0,10)||today();
    const tm=(ts.match(/\d{2}:\d{2}(:\d{2})?/)||[''])[0]; // giờ:phút(:giây)
    if(r.amount>0){
      income.push({id:'i'+Math.random().toString(36).slice(2),type:/tạm ứng|tam ung/i.test(r.note)?'adv':'in',
        amount:Math.trunc(r.amount),date,time:tm,note:r.note||r.cat});
    }else{
      const grp=faGroup(r.cat,r.note);
      // ghi chú: giữ nguyên ghi chú thật; nếu trống thì dùng tên danh mục
      const cleanNote=String(r.note||'').replace(/^\s*\[[^\]]+\]\s*/,'').trim();
      costs.push({id:'c'+Math.random().toString(36).slice(2),cat:faBucket(r.cat,r.note),
        group:grp,
        amount:Math.trunc(Math.abs(r.amount)),date,time:tm,note:cleanNote||grp||r.cat});
    }
  });
  return {income,costs,dropped:rows.length-kept.length};
}

function faSuggestName(parsed){
  // đoán tên dự án từ dữ liệu Finance Assist (nếu có tên file gợi ý thì ưu tiên)
  if(parsed.suggestName) return parsed.suggestName;
  // gom theo Danh Mục xuất hiện nhiều nhất (loại nhóm chung chung)
  const generic=/^(kho\b|kho ?\d*|tiền mặt|tien mat|ví|vi|doanh thu|thiết bị|thiet bi|chi phí khác|chi phi khac)$/i;
  const freq={};
  parsed.costs.forEach(x=>{ const g=(x.group||'').trim(); if(g&&!generic.test(g)) freq[g]=(freq[g]||0)+1; });
  const top=Object.entries(freq).sort((a,b)=>b[1]-a[1])[0];
  return top ? ('Dự án '+top[0]) : '';
}

async function cassoFetch(){
  const key = (DB.cassoApiKey||'').trim();
  if(!key){ toast('Nhập Casso API Key trước'); return; }
  toast('Đang lấy giao dịch từ Casso…');
  try{
    // Lấy 30 ngày gần nhất, sort DESC
    const from = new Date(); from.setDate(from.getDate()-30);
    const fromStr = from.toISOString().slice(0,10);
    const url = `https://oauth.casso.vn/v2/transactions?pageSize=100&page=1&sort=DESC&fromDate=${fromStr}`;
    const res = await fetch(url, {
      headers: { 'Authorization': 'Apikey ' + key, 'Content-Type': 'application/json' }
    });
    if(!res.ok){
      const t = await res.text();
      throw new Error('HTTP '+res.status+' — '+t.slice(0,120));
    }
    const j = await res.json();
    if(j.error !== 0) throw new Error(j.message || 'Lỗi Casso');
    const records = (j.data && j.data.records) || [];
    if(!records.length){ toast('Không có giao dịch nào trong 30 ngày'); return; }
    // Convert to our format
    const income=[], costs=[];
    let latestBal = null;
    records.forEach(r=>{
      const amt = Number(r.amount)||0;
      const date = (r.when||'').slice(0,10) || today();
      const note = (r.description||'').trim() || (r.corresponsiveName||'') || 'Casso';
      const bal = r.cusum_balance != null ? Number(r.cusum_balance) : null;
      if(bal != null && latestBal == null) latestBal = bal; // first = newest because DESC
      if(amt > 0){
        income.push({id:'i'+Math.random().toString(36).slice(2), type:'in', amount:Math.trunc(amt), date, time:'', note:note+' [Casso]', fromCasso:true});
      } else if(amt < 0){
        costs.push({id:'c'+Math.random().toString(36).slice(2), cat:'khac', group:'Casso', amount:Math.trunc(Math.abs(amt)), date, time:'', note:note, fromCasso:true});
      }
    });
    // Show preview
    showCassoPreview({income, costs, latestBal, total: records.length});
  }catch(e){
    console.error(e);
    toast('Lỗi Casso: '+(e.message||e));
    if(String(e.message).includes('Failed to fetch') || String(e).includes('CORS')){
      alert('Trình duyệt chặn CORS.\n\nCách xử lý tạm:\n1. Cài extension "CORS Unblock" / "Allow CORS"\n2. Hoặc dùng backend proxy nhỏ\n3. Hoặc copy giao dịch thủ công từ Casso');
    }
  }
}

  // dấu hiệu WebView Android: có 'wv' hoặc 'version/x.x ... chrome' nhưng thiếu 'safari' đầy đủ, hoặc là app-wrapper

// Mở URL ra trình duyệt ngoài (thoát WebView)
function openExternal(url){
  try{
    // cách 1: intent để Android mở trình duyệt ngoài
    const a=document.createElement('a');
    a.href=url; a.target='_blank'; a.rel='noopener external';
    document.body.appendChild(a); a.click(); a.remove();
  }catch(e){ window.open(url,'_blank'); }
}
// Nhận token dán vào, thử gọi Drive để xác thực
async function drivePasteToken(){
  let tok=(document.getElementById('drvToken')||{}).value||'';
  tok=tok.trim();
  // nếu người dùng dán cả URL, tự tách access_token
  const m=tok.match(/access_token=([^&\s]+)/);
  if(m) tok=decodeURIComponent(m[1]);
  if(!tok){ toast('Dán access token trước'); return; }
  gisToken=tok;
  setSync('busy');
  try{
    // kiểm tra token bằng cách tìm file — nếu OK thì đẩy luôn
    await driveFind();
    setSync('ok');
    const el=document.getElementById('driveStatus'); if(el) el.textContent='Trạng thái: đã kết nối (token thủ công)';
    closeModal();
    toast('Đã kết nối Drive');
    schedulePush();
  }catch(e){
    setSync('err');
    toast('Token không hợp lệ hoặc hết hạn — lấy lại token mới');
  }
}
function schedulePush(){
  syncDirty=true;
  if(!gisToken){ setSync('dirty'); return; }
  setSync('dirty');
  clearTimeout(pushTimer);
  pushTimer=setTimeout(drivePush, 1200);
}
async function drivePush(){
  if(!gisToken){ setSync('dirty'); return; }
  if(pushInFlight){ return; }           // tránh đẩy chồng; syncDirty vẫn giữ để đẩy lại sau
  pushInFlight=true; setSync('busy');
  try{
    const meta={name:'qlcp-backup.json', parents:['appDataFolder']};
    const existing=await driveFind();
    const body=JSON.stringify(DB);
    const boundary='qlcp'+Date.now();
    const multipart=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`+
      JSON.stringify(existing?{name:meta.name}:meta)+`\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n`+
      body+`\r\n--${boundary}--`;
    const url=existing
      ? `https://www.googleapis.com/upload/drive/v3/files/${existing}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    const res=await fetch(url,{method:existing?'PATCH':'POST',
      headers:{Authorization:'Bearer '+gisToken,'Content-Type':`multipart/related; boundary=${boundary}`},
      body:multipart});
    if(!res.ok) throw new Error('HTTP '+res.status);
    DB.lastSync=Date.now(); syncDirty=false; pushRetry=0; pushInFlight=false; setSync('ok');
    // nếu trong lúc đẩy có thay đổi mới -> đẩy tiếp
    if(syncDirty) schedulePush();
  }catch(e){
    pushInFlight=false; console.error(e);
    // token hết hạn -> xin lại lặng lẽ
    if(String(e.message).includes('401') && tokenClient){ try{ tokenClient.requestAccessToken({prompt:''}); }catch(_){} }
    // tự thử lại với backoff (2s,4s,8s… tối đa 30s), giữ syncDirty
    pushRetry=Math.min(pushRetry+1,5); setSync('err');
    clearTimeout(pushTimer);
    pushTimer=setTimeout(drivePush, Math.min(2000*Math.pow(2,pushRetry-1),30000));
  }
}
// Đẩy ngay (đồng bộ) khi rời/ẩn app để không mất dữ liệu — dùng keepalive
async function flushSyncOnHide(){
  if(!gisToken || !syncDirty || pushInFlight) return;
  try{
    const existing=await driveFind();
    const meta={name:'qlcp-backup.json', parents:['appDataFolder']};
    const body=JSON.stringify(DB);
    const boundary='qlcp'+Date.now();
    const multipart=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`+
      JSON.stringify(existing?{name:meta.name}:meta)+`\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n`+
      body+`\r\n--${boundary}--`;
    const url=existing
      ? `https://www.googleapis.com/upload/drive/v3/files/${existing}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    await fetch(url,{method:existing?'PATCH':'POST',keepalive:true,
      headers:{Authorization:'Bearer '+gisToken,'Content-Type':`multipart/related; boundary=${boundary}`},
      body:multipart});

  }catch(e){ /* nền: bỏ qua, sẽ đẩy lại lần sau */ }
}

async function driveFind(){
  const res=await fetch("https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q="+
    encodeURIComponent("name='qlcp-backup.json'")+"&fields=files(id)",
    {headers:{Authorization:'Bearer '+gisToken}});
  const j=await res.json(); return j.files?.[0]?.id||null;

async function drivePull(){

    const res=await fetch(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`,
      {headers:{Authorization:'Bearer '+gisToken}});
    const data=await res.json();
    DB=migrate(data); CUR=DB.projects[0]?.id; localStorage.setItem('qlcp_db',JSON.stringify(DB));
    setSync('ok'); renderAll(); toast('Đã khôi phục từ Drive');
  }catch(e){ setSync('err'); toast('Lỗi khôi phục'); console.error(e); }
}

/* ===== LỚP CHẠM TIN CẬY (fix "bấm khi được khi không" trên màn nhỏ như BlackBerry KEY2) =====
   Nguyên nhân: trên màn hình nhỏ/dày đặc, mỗi lần chạm ngón tay thường nhích vài pixel; trình
   duyệt hiểu nhầm là cuộn và HỦY sự kiện click → nút không ăn. Lớp này dùng pointerdown/up:
   nếu ngón tay gần như đứng yên (di chuyển < 12px) và nhả nhanh, ta coi là một cú CHẠM và kích
   hoạt đúng nút đó, đồng thời chặn cú click "ma" ngay sau để không kích hoạt 2 lần. */
(function(){
  const SEL='button, .tab, .card.coll>h2, [onclick], [data-act], select, a, label, input, .proj-row, .pg-item-row, .drill-row, .crumb-link, .loc-chip, .icon-opt, .choice-btn';
  let sx=0, sy=0, moved=false, downEl=null, downT=0, suppressClickUntil=0;
  function actionable(t){ return t && t.closest ? t.closest(SEL) : null; }
  document.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse' && e.button!==0) return;
    downEl=actionable(e.target); sx=e.clientX; sy=e.clientY; moved=false; downT=Date.now();
  }, true);
  document.addEventListener('pointermove',e=>{
    if(!downEl) return;
    if(Math.abs(e.clientX-sx)>12 || Math.abs(e.clientY-sy)>12) moved=true;
  }, true);
  document.addEventListener('pointerup',e=>{
    const el=downEl; downEl=null;
    if(!el) return;
    // chỉ xử lý khi là chạm/bút; chuột để đường click gốc lo (tránh double)
    if(e.pointerType==='mouse') return;
    if(moved) return;                          // đang cuộn -> bỏ qua
    if(Date.now()-downT>700) return;           // giữ lâu -> không phải tap
    const up=actionable(e.target);
    if(up!==el) return;                        // nhả ở nơi khác -> bỏ
    // để các input/select/textarea/date/time hoạt động tự nhiên (focus, mở picker)
    const tag=(el.tagName||'').toLowerCase();
    if(tag==='input'||tag==='select'||tag==='textarea') return;
    // đây là một cú chạm hợp lệ: kích hoạt và chặn click ma tiếp theo
    suppressClickUntil=Date.now()+600;
    e.preventDefault();
    fireTap(el);
  }, true);
  // chặn cú click tổng hợp ngay sau tap để không kích hoạt 2 lần
  document.addEventListener('click', e=>{
    if(Date.now()<suppressClickUntil){
      suppressClickUntil=0;
      e.preventDefault(); e.stopPropagation();
    }
  }, true);
  function fireTap(el){
    const act=el.getAttribute && el.getAttribute('data-act');
    if(act){ runDataAct(el); return; }
    // nếu có onclick nội tuyến -> gọi trực tiếp
    if(typeof el.onclick==='function'){ el.onclick(new Event('click')); return; }
    // nếu chính nó không có onclick nhưng cha gần nhất có -> click cha
    const oc=el.closest && el.closest('[onclick]'); if(oc && typeof oc.onclick==='function'){ oc.onclick(new Event('click')); return; }
    // fallback: click gốc (label, a…)
    if(typeof el.click==='function'){ suppressClickUntil=0; el.click(); }
  }
  // Xử lý các nút [data-act] (⋮ / Sửa / Chuyển nhóm / Xóa …)
  function runDataAct(btn){
    const act = btn.getAttribute('data-act');
    const id = btn.getAttribute('data-id') || '';
    if(act==='more'){ costMoreSheet(id); return; }
    if(act==='more-in'){ incomeMoreSheet(id); return; }
    if(act==='more-proj'){ projMoreSheet(id); return; }
    if(act==='edit' || act==='edit-row') openCost(id);
    else if(act==='move') openMove(id);
    else if(act==='edit-in') openIncome(id);
    else if(act==='edit-pg') openPayGroup(id);
    else if(act==='edit-sg') openSuperGroup(id);
    else if(act==='open-proj') openProjectFull(id);
    else if(act==='del-proj') deleteProject(id);
    else if(act==='edit-hd') openContractFor(id);
    else if(act==='domove') doMove(id, btn.getAttribute('data-group')||'');
    else if(act==='domove-new'){
      const v=(document.getElementById('mvNew')||{}).value||'';
      doMove(id, String(v).trim());
    }
  }
  window.runDataAct=runDataAct;
})();

/* ===== Event delegation click (cho chuột/desktop và làm phương án dự phòng) ===== */
(function(){
  let lastTarget=null, lastTime=0;
  function handleAct(ev){
    const btn = ev.target.closest ? ev.target.closest('[data-act]') : null;
    if(!btn) return;
    const now=Date.now();
    if(btn===lastTarget && (now-lastTime)<400){ return; }
    lastTarget=btn; lastTime=now;
    try { ev.preventDefault(); ev.stopPropagation(); } catch(e){}
    window.runDataAct(btn);
  }
  document.addEventListener('click', handleAct, true);
})();

    toast('Đã tải bản sao lưu .json');
  }catch(e){ console.error(e); }
}

/* ==================== BOOT ==================== */
// Nếu quay về từ đăng nhập Google (URL có #access_token=...) thì tự nhận token
function captureTokenFromUrl(){
  try{
    const h=location.hash||'';
    const m=h.match(/access_token=([^&]+)/);
    if(m){
      gisToken=decodeURIComponent(m[1]);
      // xóa token khỏi URL cho sạch
      history.replaceState(null,'',location.pathname+location.search);
      setSync('busy');
      driveFind().then(()=>{ setSync('ok'); toast('Đã kết nối Drive'); schedulePush(); })
                 .catch(()=>{ setSync('err'); });
    }
  }catch(e){/* bỏ qua */}
}
// Đối chiếu IndexedDB (bền) với localStorage khi khởi động: nếu IndexedDB mới hơn
// (localStorage bị dọn/mất) thì khôi phục từ IndexedDB — chống mất dữ liệu.
async function reconcileStores(){
  try{
    const idb=await idbLoadMain();
    if(idb && typeof idb==='object'){
      const idbRev=Number(idb.rev||0), curRev=Number(DB.rev||0);
      if(idbRev>curRev){
        DB=migrate(idb); CUR=DB.projects[0]?.id||CUR;
        try{ localStorage.setItem('qlcp_db', JSON.stringify(DB)); }catch(e){}
        applyTabOrder(); renderAll();
        toast('Đã khôi phục dữ liệu từ bộ nhớ dự phòng');
      } else if(curRev>idbRev){
        // localStorage mới hơn -> đồng bộ ngược vào IndexedDB
        idbSaveMain(DB).catch(()=>{});
      }
    } else {
      // chưa có bản IndexedDB -> tạo lần đầu
      idbSaveMain(DB).catch(()=>{});
    }
  }catch(e){ console.error('reconcile error', e); }
}
/* ===== KHOÁ APP BẰNG MÃ PIN ===== */
let _pinBuf='', _pinMode='unlock', _pinFirst='', _pinCb=null;
function pinRenderDots(){
  const d=document.getElementById('pinDots'); if(!d) return;
  const n=Math.max(4,_pinBuf.length);
  d.innerHTML=Array.from({length:Math.max(4,_pinBuf.length)},(_,i)=>`<span class="pd ${i<_pinBuf.length?'on':''}"></span>`).join('');
}
function pinBuildPad(){
  const pad=document.getElementById('pinPad'); if(!pad) return;
  const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  pad.innerHTML=keys.map(k=>k===''?`<button class="pin-key blank"></button>`:`<button class="pin-key" onclick="pinPress('${k}')">${k}</button>`).join('');
}
function pinPress(k){
  const msg=document.getElementById('pinMsg'); if(msg) msg.textContent='';
  if(k==='⌫'){ _pinBuf=_pinBuf.slice(0,-1); pinRenderDots(); return; }
  if(_pinBuf.length>=6) return;
  _pinBuf+=k; pinRenderDots();
  if(_pinBuf.length>=4){
    // tự xử lý khi đủ 4 số (cho phép tối đa 6 nếu người dùng bấm tiếp nhanh)
    setTimeout(pinSubmit, 120);
  }
}
function pinSubmit(){
  if(_pinBuf.length<4) return;
  const val=_pinBuf; _pinBuf='';
  const msg=document.getElementById('pinMsg');
  if(_pinMode==='unlock'){
    if(val===DB.pin){ document.getElementById('pinLock').style.display='none'; pinRenderDots(); }
    else { if(msg) msg.textContent='Sai mã PIN, thử lại'; pinRenderDots(); navigator.vibrate&&navigator.vibrate(200); }
  } else if(_pinMode==='set1'){
    _pinFirst=val; _pinMode='set2';
    document.getElementById('pinTitle').textContent='Nhập lại mã PIN'; pinRenderDots();
  } else if(_pinMode==='set2'){
    if(val===_pinFirst){
      DB.pin=val; save();
      document.getElementById('pinLock').style.display='none';
      _pinMode='unlock'; _pinFirst=''; pinRenderDots();
      toast('Đã đặt mã PIN');
      if(_pinCb){ const cb=_pinCb; _pinCb=null; cb(); }
    } else {
      _pinMode='set1'; _pinFirst='';
      document.getElementById('pinTitle').textContent='Mã không khớp — đặt lại';
      if(msg) msg.textContent='Hai lần nhập khác nhau'; pinRenderDots();
    }
  }
}
function showPinLock(){
  if(!DB.pin){ return false; }
  _pinMode='unlock'; _pinBuf='';
  document.getElementById('pinTitle').textContent='Nhập mã PIN';
  document.getElementById('pinMsg').textContent='';
  pinBuildPad(); pinRenderDots();
  document.getElementById('pinLock').style.display='flex';
  return true;
}
function setupPin(){
  if(DB.pin){
    // đã có PIN -> hỏi đổi hoặc gỡ
    if(confirm('Bạn đã có mã PIN. Bấm OK để ĐỔI mã, bấm Huỷ để GỠ mã.')){
      _pinMode='set1'; _pinBuf=''; _pinFirst='';
      document.getElementById('pinTitle').textContent='Nhập mã PIN mới';
      document.getElementById('pinMsg').textContent='';
      pinBuildPad(); pinRenderDots();
      document.getElementById('pinLock').style.display='flex';
    } else {
      if(confirm('Gỡ mã PIN? App sẽ không hỏi PIN khi mở nữa.')){ DB.pin=''; save(); toast('Đã gỡ mã PIN'); renderAll(); }
    }
  } else {
    _pinMode='set1'; _pinBuf=''; _pinFirst='';
    document.getElementById('pinTitle').textContent='Đặt mã PIN (4–6 số)';
    document.getElementById('pinMsg').textContent='';
    pinBuildPad(); pinRenderDots();
    document.getElementById('pinLock').style.display='flex';
  }
}
window.addEventListener('load',()=>{ applyTabOrder(); renderAll(); captureTokenFromUrl(); reconcileStores(); showPinLock(); setTimeout(initGis,600); setTimeout(checkBackupReminder,1500); });

/* ==================== CẦU NỐI GOOGLE DRIVE NATIVE (chạy trong APK) ====================
   Khi chạy trong app native (có window.AndroidDrive), dùng OAuth native — KHÔNG dùng
   ô Client ID cũ (cách web bị Google chặn trong WebView). */
var IS_NATIVE_APP = (typeof window.AndroidDrive !== 'undefined' && window.AndroidDrive && window.AndroidDrive.isAvailable && window.AndroidDrive.isAvailable());

// Native báo kết quả thao tác Drive
(function(){
  var _prev = window.__onDriveResult || function(){};
  window.__onDriveResult = function(op, ok, msg){
    if(op==='backup'){
      if(ok){ if(typeof markBackupDone==='function') markBackupDone(); toast('✅ Đã sao lưu lên Google Drive'); }
      else toast('Sao lưu Drive lỗi: '+msg);
      return;
    }
    if(op==='connect'){ toast(ok?'✅ Đã kết nối Google Drive':'Kết nối Drive lỗi: '+msg); return; }
    if(op==='restore' && !ok){ toast(msg==='no-backup'?'Chưa có bản sao lưu nào trên Drive':('Khôi phục lỗi: '+msg)); return; }
    return _prev(op, ok, msg);
  };
})();

// Native tải xong nội dung backup từ Drive (base64)
window.__onDriveRestore = async function(b64){
  try{
    var text = decodeURIComponent(escape(atob(b64)));
    var parsed = JSON.parse(text);
    var data, atts=null;
    if(parsed && parsed._format==='qlcp-backup' && parsed.db){ data=parsed.db; atts=parsed.attachments||{}; }
    else data=parsed;
    if(!data || !Array.isArray(data.projects)){ toast('Dữ liệu Drive không hợp lệ'); return; }
    var attCount = atts?Object.keys(atts).length:0;
    if(!confirm('Khôi phục từ Drive sẽ THAY THẾ toàn bộ dữ liệu hiện tại'+(attCount?(' (kèm '+attCount+' chứng từ)'):'')+'. Tiếp tục?')) return;
    if(atts && attCount){ for(var id of Object.keys(atts)){ try{ var a=atts[id]; if(a&&a.data) await attPut(id, base64ToBlob(a.data, a.type)); }catch(e){} } }
    DB = migrate(data);
    CUR = DB.projects[0]?DB.projects[0].id:null;
    save(); if(typeof drillReset==='function') drillReset(); applyTabOrder(); renderAll();
    toast('✅ Đã khôi phục '+DB.projects.length+' dự án từ Drive'+(attCount?(' + '+attCount+' chứng từ'):''));
  }catch(e){ toast('Lỗi khôi phục Drive: '+e.message); }
};

async function driveBackupNow(){
  if(!IS_NATIVE_APP){ toast('Chức năng Drive tự động chỉ chạy trong app đã cài (APK)'); return; }
  try{
    toast('Đang gom dữ liệu + chứng từ…');
    var full = await buildFullBackup();
    window.AndroidDrive.backup(JSON.stringify(full));
    toast('Đang đẩy lên Google Drive…');
  }catch(e){ toast('Lỗi chuẩn bị sao lưu: '+e.message); }
}
function driveRestoreNow(){
  if(!IS_NATIVE_APP){ toast('Chức năng Drive chỉ chạy trong app đã cài (APK)'); return; }
  toast('Đang tải bản sao lưu từ Drive…');
  window.AndroidDrive.restore();
}

// Chèn nút Drive native vào tab Cài đặt (chỉ khi chạy trong APK)
function injectDriveButtons(){
  if(!IS_NATIVE_APP) return;
  if(document.getElementById('driveNativeBox')) return;
  var anchor = document.querySelector('#pageCai');
  if(!anchor) return;
  var box = document.createElement('div');
  box.className='card'; box.id='driveNativeBox';
  box.style.cssText='background:linear-gradient(135deg,#0d6e66,#134e4a);color:#fff';
  box.innerHTML =
    '<div style="font-weight:700;margin-bottom:6px">☁️ Google Drive (tự động)</div>'+
    '<div style="font-size:13px;opacity:.9;margin-bottom:10px">Sao lưu & khôi phục dữ liệu kèm chứng từ. Tự động sao lưu định kỳ khi có thay đổi.</div>'+
    '<button class="btn" style="width:100%;background:#fff;color:#0d6e66" onclick="driveBackupNow()">⬆️ Sao lưu lên Drive ngay</button>'+
    '<button class="btn sec" style="width:100%;margin-top:8px;border-color:#fff;color:#fff" onclick="driveRestoreNow()">⬇️ Khôi phục từ Drive</button>';
  anchor.insertBefore(box, anchor.firstChild);
}

// Tự động sao lưu Drive mỗi 5 phút nếu có thay đổi
var __lastDriveBackupAt = 0;
if(IS_NATIVE_APP){
  (function(){ var _save=window.save; window.save=function(){ try{ if(DB) DB.__lastChange=Date.now(); }catch(e){} return _save.apply(this,arguments); }; })();
  window.addEventListener('load', function(){
    setTimeout(injectDriveButtons, 800);
    // Nút chấm trên tiêu đề: sáng xanh + đổi chú thích (bấm = sao lưu Drive)
    var dot=document.getElementById('syncDot');
    if(dot){ dot.classList.add('ok'); dot.title='Sao lưu lên Google Drive'; }
    var _rc = window.renderCai;
    if(typeof _rc==='function'){ window.renderCai=function(){ var r=_rc.apply(this,arguments); setTimeout(injectDriveButtons,50); return r; }; }
    setInterval(function(){
      try{ var lc=DB.__lastChange||0; if(lc>__lastDriveBackupAt && (Date.now()-__lastDriveBackupAt>5*60*1000)){ __lastDriveBackupAt=Date.now(); driveBackupNow(); } }catch(e){}
    }, 60*1000);
  });
}
